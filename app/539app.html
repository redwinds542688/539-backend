  // 「定期」的核心邏輯抽成一個獨立函式，讓「定期十六」可以直接呼叫
  // 這個函式本身，不透過 periodBtn.click() 觸發——因為 periodBtn
  // 等一下會被 disabled（使用者要求把浮動的「定期」按鍵取消掉），
  // disabled 的按鈕就算用 JS 呼叫 .click() 也不會真的觸發 click
  // 事件，如果「定期十六」還是依賴 periodBtn.click() 就會一起失效。
  // 拆成獨立函式之後，periodBtn 跟「定期十六」各自掛自己的監聽器，
  // 呼叫同一個函式，其中一個被停用不會影響另一個。
  function togglePeriodMode(){
    if(recentOnly){
      // 已經在「定期」狀態下：要連續點兩下（400毫秒內）才會真的離開，
      // 單獨點一下不會有反應，避免不小心誤觸就把整個篩選狀態關掉。
      const now = Date.now();
      const isDoubleTap = (now - periodExitClickTime) < PERIOD_EXIT_DOUBLE_TAP_MS;
      periodExitClickTime = now;
      if(!isDoubleTap) return;
      periodExitClickTime = 0; // 用掉了，重設，避免連三下把第2、3下又湊成一組

      // 離開「定期」：把圖示恢復顯示，並且把釘選、全螢幕也一併還原
      // 回沒有啟動的狀態，捲動位置也一起歸零，整組回到剛打開放大鏡
      // 當下的初始畫面。
      recentOnly = false;
      periodBtn.classList.toggle("armed", false);
      // 關鍵順序修正：找到真正的bug了——進入「定期」時setPinned(true)
      // 會把.scroller的overflow設成行內樣式"hidden"（優先權比CSS的
      // body.recent-only-mode .scroller{overflow:visible}還高），
      // 讓「定期」底下的.scroller其實是被裁切住的，不是原本設計要的
      // 「可以顯示超出範圍的縮放內容」。離開「定期」時一定要先呼叫
      // setPinned(false)（把overflow行內樣式改回"auto"），再呼叫
      // applyRecentOnly()（裡面會重設寬度/scrollLeft等）——原本的
      // 順序是反的（先applyRecentOnly()才setPinned(false)），導致
      // 重設動作是在.scroller還被裁切住的狀態下執行、量到的東西不準，
      // 這才是「退出定期後畫面還是往左壓縮」的真正原因。
      if(viewPinned) setPinned(false);
      applyRecentOnly();
      // 使用者最終要求：不管九宮鍵區或其他功能以後怎麼變動，退出
      // 「定期十六」回到一般抓牌畫面，一律固定套用MAGNIFIER_ZOOM
      // （0.600802）這個常數，不再變回applyRecentOnly()預設重置
      // 的0.59。
      panels.style.zoom = MAGNIFIER_ZOOM;
      pinBtn.style.display = "";
    pinBtn.disabled = false;
    pinBtn.classList.remove("period-locked");
      fullBtn.style.display = "";
      floatSaveBtn.style.display = "";
      floatBackBtn.style.display = "";
      recentClearBtn.style.display = "none";
      recentShotBtn.style.display = "none";
      if(fullDisplay){ fullDisplay = false; applyFullDisplay(); }
      window.scrollTo(0, 0);
      requestAnimationFrame(updateButtonOverlapGuard);
      return;
    }

    // 先回復到還沒調整「上移左移」之前的樣子，回歸初始畫面時先用這個
    // 原本的版本顯示。
    document.body.classList.add("no-cell-shift");

    // 先執行「關閉」：真的把放大鏡關掉一次（不是只重設畫面），確保
    // 所有狀態、尺寸都乾淨歸零，不會殘留任何舊資料。
    closeBtn.click();

    // 再執行「放大鏡」：立刻重新打開，回到剛打開放大鏡當下的初始
    // 畫面——開獎單本身、上面已經有的標記／連接線都要正常畫出來，
    // 六大功能（關閉/存檔/調色/分佈/返回/清除）沿用原本的標記/歷史
    // 紀錄去判斷，不會被歸零。
    showFullPageImage();

    // 立即套用「定期」（拿掉原本10秒等待的限制），只留一個極短的
    // 延遲讓瀏覽器把剛重新打開的畫面排版穩定下來。
    requestAnimationFrame(function(){
      requestAnimationFrame(activatePeriodMode);
    });
  }

  periodBtn.addEventListener("click", togglePeriodMode);
  // 「定期十六」不依賴 periodBtn.click()，直接呼叫同一個函式本體，
  // 不受 periodBtn 本身是否 disabled 影響。
  if(period16Btn){
    period16Btn.addEventListener("click", togglePeriodMode);
  }
  // 使用者要求：把「定期十六」的所有功能複製給「C式概率」跟
  // 「E式概率」——這兩顆鍵原本的功能（分佈的廣泛標記、清除）已經
  // 被拿掉、變成空鍵（見前面updateToolbarState()、click監聽器
  // 移除的異動），現在改成跟「定期十六」一樣，直接呼叫同一個
  // togglePeriodMode()函式本體，三顆按鍵（定期十六／C式概率／
  // E式概率）行為完全一致、共用同一份狀態。
  if(broadBtn){
    broadBtn.addEventListener("click", togglePeriodMode);
  }
  if(clearBtn){
    clearBtn.addEventListener("click", togglePeriodMode);
  }

  // 開獎單位置完全不動，工具列又是固定貼在畫面最上方，如果首頁頭部/
  // 最新開獎資訊原本的高度不夠高，工具列可能會蓋到開獎單最上面幾排。
  // 這裡即時比對每一顆按鈕的位置跟開獎單頂端的位置，只要按鈕被開獎單
  // 蓋住，就把那顆按鈕關掉（不能點、也不會攔截手指），讓手指可以正常
  // 穿透去操作底下的開獎單；等捲動離開重疊區域，按鈕再自動恢復正常。
  // 原本這裡會在按鈕被開獎單蓋住時自動停用它，但這樣反而會讓正常情況
  // 下（沒開全頁顯示）本來就看得到、應該要能點的按鈕也被誤判停用。
  // 改成不再自動停用——避免誤觸滑過去點到按鈕的防護，已經交給前面
  // 「手指移動超過一點距離就不算點擊」那段程式去處理。
  function updateButtonOverlapGuard(){
    document.querySelectorAll(".draw-toolbar button:not(#img-close)").forEach(function(b){
      b.style.pointerEvents = "";
      b.style.opacity = "";
    });
  }
  window.addEventListener("scroll", updateButtonOverlapGuard, { passive: true });
  // 連接線現在是用「固定在螢幕上的座標」畫的，捲動畫面時開獎單會移動、
  // 但線本身不會自動跟著動，要在捲動時重新算一次位置才會對得上。
  // 九宮鍵區外框（.hint-bar）「不」跟著捲動重新計算——使用者明確
  // 要求外框位置固定，開獎單捲動/縮放都不能影響它的位置，也不能
  // 讓開獎單內容跑到外框背後透出來。之前這裡也掛了
  // applyImgHintBarConnect()，結果捲動的時候外框跟著亂跳、跟畫面
  // 對不上，變成文字重疊的破圖，是反效果，拿掉。
  window.addEventListener("scroll", function(){
    if(document.body.classList.contains("magnifier-mode")){
      renderConnections();
    }
  }, { passive: true });
  window.addEventListener("resize", updateButtonOverlapGuard);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", updateButtonOverlapGuard);
  // 電腦上縮放/調整瀏覽器視窗大小時，如果剛好在抓牌全頁畫面裡，
  // 工具列九顆按鍵的寬度也要跟著重新貼齊（見showFullPageImage()
  // 開頭的說明），只在magnifier-mode開著的時候才需要重算，避免
  // 首頁一般瀏覽時每次resize都白白多算一次沒有用到的東西。這裡的
  // resize是指瀏覽器視窗本身大小改變（電腦拖曳視窗邊界、手機轉
  // 橫向），跟使用者兩指縮放開獎單內容（pageZoom）是不同的事件，
  // 不受「九宮鍵區位置固定」這條規則影響——視窗大小真的改變時，
  // 九宮鍵區本來就應該跟著重新排版，不然會跟新的螢幕尺寸對不上。
  window.addEventListener("resize", function(){
    if(document.body.classList.contains("magnifier-mode")){
      applyDesktopMagnifierToolbarWidth();
      applyImgGameTabsWidth();
      applyImgHintBarConnect();
    } else {
      // 首頁狀態下視窗大小改變（電腦拖曳視窗邊界），置中的邊距也要
      // 跟著重新算，不然視窗變大/變小之後左右留白會不對稱。
      centerHomepageWrap();
    }
  });

  // 沒辦法讓大頭釘完全不受瀏覽器縮放影響（縮放是瀏覽器把整張畫面一起
  // 縮放，網頁端管不到），退而求其次：偵測到畫面正在縮放/移動時，
  // 先把大頭釘藏起來；等畫面停下來，用 visualViewport 算出「現在螢幕
  // 上實際看得到的範圍」，把大頭釘貼到那個範圍的右下角（螢幕上的真實
  // 位置，不是開獎單內容裡的位置），再讓它重新出現。
  // 存檔／返回／清除／大頭釘 這四顆現在同一列、由左至右平均分布
  // （之前只有清除在左、大頭釘在右兩顆，現在改成四顆平分整排寬度）。
  const PIN_MARGIN = 10, PIN_SIZE = 26;
  function positionPinOnScreen(){
    const vv = window.visualViewport;
    const baseLeft = vv ? vv.offsetLeft : 0;
    const baseTop = vv ? vv.offsetTop : 0;
    const width = vv ? vv.width : window.innerWidth;
    const height = vv ? vv.height : window.innerHeight;
    const rowTop = Math.round(baseTop + height - PIN_SIZE - PIN_MARGIN);
    const usable = width - 2 * PIN_MARGIN - PIN_SIZE; // 最左顆左緣到最右顆左緣之間可以分配的距離
    const slotLeft = function(i){ return Math.round(baseLeft + PIN_MARGIN + usable * (i / 3)); };
    floatSaveBtn.style.left = slotLeft(0) + "px";
    floatSaveBtn.style.top = rowTop + "px";
    floatBackBtn.style.left = slotLeft(1) + "px";
    floatBackBtn.style.top = rowTop + "px";
    fullBtn.style.left = slotLeft(2) + "px";
    fullBtn.style.top = rowTop + "px";
    pinBtn.style.left = slotLeft(3) + "px";
    pinBtn.style.top = rowTop + "px";
    // 「定期」浮動鍵（#period-btn）進入「定期十六」時會取代大頭釘
    // 的位置（大頭釘那時候整個隱藏），所以位置直接跟大頭釘同一格
    // （slotLeft(3)），不是原本的置中位置——這樣「定期」啟動時，
    // 那個位置看起來就是「大頭釘的圖示換成了16」，位置完全銜接。
    periodBtn.style.left = slotLeft(3) + "px";
    periodBtn.style.top = rowTop + "px";
    recentClearBtn.style.left = Math.round(baseLeft + PIN_MARGIN) + "px";
    recentClearBtn.style.top = rowTop + "px";
    recentShotBtn.style.left = Math.round(baseLeft + width - PIN_SIZE - PIN_MARGIN) + "px";
    recentShotBtn.style.top = rowTop + "px";
  }

  let pinSettleTimer = null;
  function handleViewportActivity(){
    pinBtn.style.visibility = "hidden";
    fullBtn.style.visibility = "hidden";
    floatSaveBtn.style.visibility = "hidden";
    floatBackBtn.style.visibility = "hidden";
    periodBtn.style.visibility = "hidden";
    recentClearBtn.style.visibility = "hidden";
    recentShotBtn.style.visibility = "hidden";
    clearTimeout(pinSettleTimer);
    pinSettleTimer = setTimeout(function(){
      positionPinOnScreen();
      pinBtn.style.visibility = "visible";
      fullBtn.style.visibility = "visible";
      floatSaveBtn.style.visibility = "visible";
      floatBackBtn.style.visibility = "visible";
      periodBtn.style.visibility = "visible";
      recentClearBtn.style.visibility = "visible";
      recentShotBtn.style.visibility = "visible";
    }, 350);
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", handleViewportActivity);
    window.visualViewport.addEventListener("scroll", handleViewportActivity);
  }
  positionPinOnScreen();

  // 使用者要求「抓」鍵要連點兩下才能啟動（跟「印」鍵先前的調整
  // 一致），改成dblclick事件，取代原本單點就觸發的click事件，
  // 避免使用者不小心單點一下就誤觸進入抓牌全頁畫面。
  btn.addEventListener("dblclick", showFullPageImage);
  closeBtn.addEventListener("click", function(){
    overlay.classList.remove("open");
    document.body.classList.remove("magnifier-mode");
    // 完全退出抓牌系統時，順便清掉pinch-fullscreen-mode這個class，
    // 避免下次重新進入抓牌系統時，殘留的全頁狀態誤觸發UI隱藏。
    document.body.classList.remove("pinch-fullscreen-mode");
    // 使用者要求：從首頁進入抓牌系統、再回到首頁，開獎單的位置
    // 必須回歸首頁初始的位置——在抓牌畫面裡捲動瀏覽（往下看更早
    // 期數的開獎資料）時，捲動的其實是整個頁面本身的捲動位置
    // （window.scrollY），header.top/九宮鍵是fixed疊在上面才會
    // 「看起來」固定，底下的內容還是真的隨頁面捲動在移動。這個
    // 捲動位置離開抓牌畫面時沒有被明確重設，殘留下來就會讓回到
    // 首頁時畫面停在抓牌時捲到的位置，不是首頁原本該有的最上方
    // 初始狀態。這裡明確加回window.scrollTo(0,0)，確保每次關閉
    // 抓牌畫面，首頁都是從最頂端、乾淨的初始位置重新開始顯示。
    window.scrollTo(0, 0);
    // 離開抓牌模式，把header.top搬回原本在#page-zoom-wrap裡的位置
    // （用#header-top-anchor這個空佔位元素標記插入點），避免它
    // 一直留在#header-top-bg-wrap底下，影響首頁原本的版面結構。
    const headerTopEl = document.getElementById("header-top");
    const headerTopAnchor = document.getElementById("header-top-anchor");
    if(headerTopEl && headerTopAnchor && headerTopEl.parentElement && headerTopEl.parentElement.id === "header-top-bg-wrap"){
      headerTopAnchor.parentElement.insertBefore(headerTopEl, headerTopAnchor);
    }
    const meta = document.querySelector('meta[name="viewport"]');
    if(meta) meta.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");
    pageZoom = 1;
    applyPageZoom();
    // 不管關閉當下是不是還在「固定畫面」狀態，離開放大鏡一定要把鎖定
    // 全部解除，不然捲動鎖定、觸控攔截會殘留到首頁，害首頁的原生縮放
    // 跟捲動也跟著失效。
    setPinned(false);
    recentOnly = false;
    pinBtn.style.display = "";
    pinBtn.disabled = false;
    pinBtn.classList.remove("period-locked");
    fullBtn.style.display = "";
    floatSaveBtn.style.display = "";
    floatBackBtn.style.display = "";
    recentClearBtn.style.display = "none";
    recentShotBtn.style.display = "none";
    periodBtn.classList.remove("armed");
    applyRecentOnly();
    // applyRecentOnly() 在 recentOnly===false 的分支裡，會把
    // .scroller 的 style.width 重設成空字串（見它自己內部的說明），
    // 但沒有重新套用電腦版專屬的「外框寬度貼齊內容」邏輯——這裡
    // 補上，不然電腦版使用者關閉抓牌回到首頁時，開獎單外框會掉回
    // CSS預設的滿版寬度，變成異常寬的邊框（見 applyDesktopScrollerWidth()
    // 開頭的完整說明）。
    // 使用者實測回報：關閉抓牌回到首頁，尺寸會跟剛啟動App、第一次
    // 進首頁時不一樣（產生落差/尺寸跑掉）。原因：關閉抓牌的當下，
    // 上面幾行剛把viewport meta標籤從放大鏡專用設定改回首頁設定
    // （拿掉maximum-scale/user-scalable那些限制），這個meta標籤
    // 異動會讓瀏覽器重新計算有效可視寬度，部分瀏覽器/裝置需要
    // 超過1個影格才能完全重新排版、穩定下來——原本只用單一個
    // requestAnimationFrame等，時機可能太早，量到的.scroller/
    // #panels寬度還是meta標籤異動前、或重排到一半的中間值，不是
    // 真正穩定之後的數字，導致算出來的縮放比例跟頁面剛載入時
    // （沒有經過這次meta標籤異動）算出來的不一樣，兩種情境下尺寸
    // 因此對不起來。**改成用這份程式碼裡其他地方已經確立的「雙重
    // requestAnimationFrame」寫法**（例如saveAsImage()裡等待
    // viewport相關異動穩定用的同一套手法），多等一個影格，確保
    // 量測的當下版面已經真正重新排列、穩定下來。
    requestAnimationFrame(function(){
      requestAnimationFrame(applyDesktopScrollerWidth);
    });
    document.querySelectorAll(".draw-toolbar button, .pin-btn").forEach(function(b){
      b.style.pointerEvents = "";
      b.style.opacity = "";
    });
  });
  // 防止「滑動手勢剛好從按鈕上開始」誤觸發按鈕本身的功能：手指按下
  // 之後如果移動超過一點點距離才放開，就當作是滑動經過、不是真的
  // 點擊，攔掉這次的 click 事件。
  document.querySelectorAll(".draw-toolbar button").forEach(function(b){
    let downX = null, downY = null, moved = false;
    b.addEventListener("pointerdown", function(e){
      downX = e.clientX; downY = e.clientY; moved = false;
    });
    b.addEventListener("pointermove", function(e){
      if(downX === null) return;
      const d = Math.hypot(e.clientX - downX, e.clientY - downY);
      if(d > 8) moved = true;
    });
    b.addEventListener("click", function(e){
      if(moved){ e.preventDefault(); e.stopImmediatePropagation(); }
      downX = null; downY = null; moved = false;
    }, true);
  });

  // 使用者要求：「C式概率」的功能整個拿掉，變成一顆空的功能鍵——
  // 移除這裡原本的click事件綁定，點擊不再觸發toggleBroad()。
  // 「分佈機率」不受影響，繼續保留自己的click綁定（見下面），
  // 兩顆按鍵原本共用同一個函式，現在拆開成「分佈機率」獨立擁有
  // 這個功能，「C式概率」變成純粹的空鍵。
  // 「分佈機率」直接呼叫 toggleBroad 函式本體。
  const distProbBtn = document.getElementById("draw-dist-prob");
  if(distProbBtn){
    distProbBtn.addEventListener("click", toggleBroad);

  backBtn.addEventListener("click", goBack);
  saveBtn.addEventListener("click", function(){ saveAsImage(); });
  const cleanSheetBtn = document.getElementById("clean-sheet-btn");
  if(cleanSheetBtn){
    setupPaperSizeLongPress(cleanSheetBtn);
  }
  // 使用者要求：「E式概率」的功能整個拿掉，變成一顆空的功能鍵——
  // 移除這裡原本的click事件綁定，點擊不再觸發clearAll()。
  // clearAll()函式本體完全不動，fullBtn（「定期」模式的浮動清除鍵）
  // 繼續直接呼叫這個函式，不受影響。

  // 「資料更新」鍵：使用者要求改成「立刻上雲端拉最新資料，如果
  // 有新資料便更新並儲存、更新顯示」——不是只檢查提示，是真的
  // 直接合併進App（呼叫 manualUpdateAndMergeData()，內部用
  // manualUpsertDrawRecord() 合併，同一天但號碼被雲端校正過的情況
  // 也會正確覆蓋）。按下去先把文字暫時換成「查詢中」，避免使用者
  // 重複連點；查完之後，按鍵文字會依結果短暫顯示「已更新」（真的
  // 合併了新資料，畫面也會跟著自動重畫）或「已最新」（查過沒有
  // 新資料），2秒後恢復原本的「資料更新」文字。
  // 使用者後續要求改成連點兩下才觸發（跟「抓」「大頭釘」等App裡
  // 其他重要按鍵同一套規則），避免手滑單點誤觸就跑去打雲端API。
  const dataUpdateBtn = document.getElementById("data-update-btn");
  if(dataUpdateBtn){
    dataUpdateBtn.addEventListener("dblclick", function(){
      if(dataUpdateBtn.disabled) return;
      dataUpdateBtn.disabled = true;
      const originalHTML = dataUpdateBtn.innerHTML;
      dataUpdateBtn.innerHTML = "查詢<br>中";
      manualUpdateAndMergeData()
        .then(function(merged){
          dataUpdateBtn.innerHTML = merged.length > 0 ? "已<br>更新" : "已<br>最新";
        })
        .catch(function(e){
          console.warn("手動更新雲端資料失敗（不影響其他功能）：", e);
          dataUpdateBtn.innerHTML = "查詢<br>失敗";
        })
        .finally(function(){
          setTimeout(function(){
            dataUpdateBtn.innerHTML = originalHTML;
            dataUpdateBtn.disabled = false;
          }, 2000);
        });
    });
  }

  // 調色盤：針對「指定號碼」的四個顏色分開設定——框色、底色、字色、線色，
  // 各自對應一個 CSS 變數，改用 CSS 變數控制是為了選色之後能直接生效，
  // 不用重新產生整個開獎單。仿照大頭釘的方式做成一個浮動面板。
  // 選色會存進 localStorage，離開調色盤、甚至整個關掉瀏覽器重開，
  // 下次進來都會自動沿用上次選的顏色，不會每次都跳回預設值。
  const PALETTE_COLORS = ["#FF3B3B","#FF8A00","#FFD400","#2ECC71","#00BFA5","#3FA9FF","#3F51B5","#A259FF","#FF4FA3","#000000"];
  const PALETTE_ATTRS = [
    { key: "--mark-frame-color", label: "框色", def: "#2ECC71" },
    { key: "--mark-bg-color",    label: "底色", def: "#FF3B3B" },
    { key: "--mark-text-color",  label: "字色", def: "#000000" },
    { key: "--mark-line-color",  label: "線色", def: "#3B82F6" },
    { key: "--mark-predict-color", label: "預測", def: "#FF3B3B" }, // 供第四招（長按空白格選號）使用，控制指定號碼的顏色
  ];
  const PALETTE_STORAGE_PREFIX = "539_palette_";
  function readSavedPaletteColor(attr){
    try{
      return localStorage.getItem(PALETTE_STORAGE_PREFIX + attr.key);
    }catch(e){
      return null; // 部分瀏覽器的隱私模式會擋掉 localStorage，讀不到就當作沒存過，改用預設值
    }
  }
  function savePaletteColor(attr, color){
    try{
      localStorage.setItem(PALETTE_STORAGE_PREFIX + attr.key, color);
    }catch(e){
      // 存不進去（例如隱私模式）就算了，這次選的顏色還是會立即生效，
      // 只是下次重開不會記得，不影響當下使用。
    }
  }

  // 存檔用的紙張尺寸設定（A3/A4），透過「印單」鍵長按選擇（見下方
  // setupPaperSizeLongPress()）。存進 localStorage，是「規範設定」
  // ——一旦選定，之後該玩法的所有存檔輸出（不管是這裡的印單鍵、
  // 還是抓牌浮動存檔鍵）都會套用同一個設定，直到再次長按改掉為止。
  // **四種玩法（539/天天樂/六合彩/大樂透）各自獨立設定，互不影響**
  // ——用 currentGameKey 當作key的一部分，切換玩法分頁時，讀到的
  // 是那個玩法自己上次設定的值，不是共用同一份。每個玩法預設值
  // 都是 A3。
  function getPaperSizeStorageKey(){
    return "539_paper_size_" + currentGameKey;
  }
  function getPaperSizeSetting(){
    try{
      const saved = localStorage.getItem(getPaperSizeStorageKey());
      if(saved === "A3" || saved === "A4") return saved;
    }catch(e){
      // 部分瀏覽器的隱私模式會擋掉 localStorage，讀不到就當作沒存過，
      // 改用預設值。
    }
    return "A3";
  }
  function setPaperSizeSetting(size){
    try{
      localStorage.setItem(getPaperSizeStorageKey(), size);
    }catch(e){
      // 存不進去就算了，這次選的設定還是會立即生效（getPaperSizeSetting
      // 之後還是讀得到，因為值就在這次呼叫的當下已經設定過一次；但
      // 下次重開瀏覽器就不會記得，只是體驗上打折，不影響當下使用）。
    }
  }

  // 「印單」鍵：單純點一下＝存檔（跟原本行為一樣）；長按（550ms）
  // 會跳出A3/A4選單，選了之後存進 getPaperSizeSetting()/
  // setPaperSizeSetting() 那組設定，之後所有存檔輸出都會套用。
  // 用 pointerdown/pointerup（涵蓋觸控跟滑鼠兩種輸入）搭配計時器
  // 判斷長按，長按觸發後要標記起來、擋掉隨後接著發生的click事件，
  // 不然放開手指的時候還是會誤觸發一次存檔。
  //
  // 選單元素改成用JS動態建立、直接掛在document.body底下（不是寫
  // 死在.hero-right裡面）——原本寫死在HTML裡、position:absolute
  // 定位在按鍵正上方的做法，因為.hero-right有overflow:hidden（是
  // 之前調整hero框高度用的），選單往上彈出時超出.hero-right的
  // 範圍就被裁切看不到了，使用者實測「長按印單畫面上沒有顯示A3/A4
  // 選項」就是這個原因。改成掛在body底下、position:fixed，用JS
  // 讀按鍵的getBoundingClientRect()算出畫面座標，不會再被任何
  // 父層的overflow裁切。
  function setupPaperSizeLongPress(btn){
    const LONG_PRESS_MS = 550;
    let pressTimer = null;
    let longPressFired = false;

    const menu = document.createElement("div");
    menu.id = "paper-size-menu";
    menu.className = "paper-size-menu";
    menu.style.display = "none";
    menu.innerHTML =
      '<div class="paper-size-menu-title">存檔紙張尺寸</div>' +
      '<button type="button" class="paper-size-option" data-size="A3">A3</button>' +
      '<button type="button" class="paper-size-option" data-size="A4">A4</button>';
    document.body.appendChild(menu);

    function updateActiveOption(){
      const current = getPaperSizeSetting();
      menu.querySelectorAll(".paper-size-option").forEach(function(opt){
        opt.classList.toggle("active", opt.dataset.size === current);
      });
    }
    function positionMenu(){
      // position:fixed 是相對整個瀏覽器視窗定位，跟頁面本身的zoom/
      // 縮放、任何父層的overflow都無關，用按鍵目前在畫面上的實際
      // 座標（getBoundingClientRect()）算出選單要擺在哪裡，貼著
      // 按鍵正下方、水平置中對齊。
      // 使用者要求「固定往下彈」，不要再嘗試往上彈——原本「上方
      // 空間不夠才往下彈」的邏輯，因為不同瀏覽器（手機版Chrome跟
      // Claude App內建的WebView）對「視窗高度」算法不完全一致，
      // 同一支手機在不同瀏覽器測試，會出現選單有時候在上面、有時
      // 候在下面的不一致情況。改成固定往下彈，拿掉「判斷上方空間
      // 夠不夠」這段邏輯，不管在哪個瀏覽器都是同一個結果，不會再
      // 有環境不一致的問題。
      const vv = window.visualViewport;
      const viewportWidth = vv ? vv.width : window.innerWidth;
      const viewportHeight = vv ? vv.height : window.innerHeight;
      const viewportOffsetTop = vv ? vv.offsetTop : 0;
      const rect = btn.getBoundingClientRect();
      menu.style.position = "fixed";
      // 先讓選單顯示出來才量得到它自己的寬高，量完再套用實際位置，
      // 避免用還沒展開前的0×0尺寸算出錯誤的座標。
      menu.style.left = "0px";
      menu.style.top = "0px";
      menu.style.visibility = "hidden";
      menu.style.display = "flex";
      const menuRect = menu.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - menuRect.width / 2;
      left = Math.max(8, Math.min(left, viewportWidth - menuRect.width - 8));
      let top = rect.bottom + 8;
      menu.style.left = left + "px";
      menu.style.top = top + "px";
      menu.style.visibility = "visible";
      // 保險起見，選單顯示之後如果底部超出可視範圍（極端情況，例如
      // 螢幕特別矮），再往上收，確保整個選單都在看得到的範圍內。
      const finalRect = menu.getBoundingClientRect();
      if(finalRect.bottom > viewportOffsetTop + viewportHeight - 8){
        top = Math.max(viewportOffsetTop + 8, viewportOffsetTop + viewportHeight - menuRect.height - 8);
        menu.style.top = top + "px";
      }
    }
    function showMenu(){
      updateActiveOption();
      positionMenu();
      menuOpen = true;
    }
    function hideMenu(){
      menu.style.display = "none";
      menuOpen = false;
    }
    let menuOpen = false;

    btn.addEventListener("pointerdown", function(e){
      longPressFired = false;
      pressTimer = setTimeout(function(){
        longPressFired = true;
        showMenu();
        // 長按當下震動一下（如果裝置支援），提示使用者選單已經跳出來，
        // 不支援的裝置這行安靜地什麼都不做，不影響其他功能。
        if(navigator.vibrate) navigator.vibrate(30);
      }, LONG_PRESS_MS);
    });
    function cancelTimer(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    }
    btn.addEventListener("pointerup", cancelTimer);
    btn.addEventListener("pointerleave", cancelTimer);
    btn.addEventListener("pointercancel", cancelTimer);

    // 使用者要求：A3/A4選單跳出來之後，**除了「選A3或A4」、或是
    // 「再按一次印讓選單消失」這兩種方式，沒有其他方法可以關閉
    // 選單**（原本「點選單以外的地方也能關閉」這個防呆已經拿掉，
    // 見下面說明）。同時「印」鍵真正觸發存檔的方式，從單點改成
    // 連點兩下（dblclick）——單點「印」現在什麼都不會做（選單
    // 沒開著的時候）或是關閉選單（選單開著的時候），只有連點兩下
    // 才會真的存檔。
    btn.addEventListener("click", function(e){
      if(longPressFired){
        // 長按已經處理過（跳出選單），這次接著發生的click是長按放開
        // 手指時瀏覽器自動補發的，要擋掉，不是使用者真的想再點一次。
        e.preventDefault();
        e.stopPropagation();
        longPressFired = false;
        return;
      }
      if(menuOpen){
        // 選單開著的時候點「印」＝關閉選單，不是存檔（存檔現在要
        // 連點兩下才會觸發，見下面的dblclick監聽器）。
        e.preventDefault();
        e.stopPropagation();
        hideMenu();
        return;
      }
      // 選單沒開著時的單純一次點擊：不做任何事，存檔改成要連點兩下
      // 才會觸發，避免使用者只是想長按叫出選單、卻不小心先點了一下
      // 就誤觸發存檔。
    });
    btn.addEventListener("dblclick", function(e){
      // 選單開著的時候，連點兩下也不觸發存檔——選單優先，使用者這時候
      // 應該先處理選單（選尺寸或關閉），不應該在選單還開著的狀態下
      // 意外存了一次檔。
      if(menuOpen) return;
      saveCleanSheetImage();
    });

    menu.querySelectorAll(".paper-size-option").forEach(function(opt){
      opt.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        setPaperSizeSetting(opt.dataset.size);
        updateActiveOption();
        hideMenu();
      });
    });
  }

  const paletteRows = document.getElementById("palette-rows");
  PALETTE_ATTRS.forEach(function(attr){
    // 有存過的顏色就沿用上次選的，沒有（第一次使用）才用預設值。
    const savedColor = readSavedPaletteColor(attr);
    const initialColor = savedColor || attr.def;

    const section = document.createElement("div");
    section.className = "palette-section";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = attr.label;
    section.appendChild(label);

    const row = document.createElement("div");
    row.className = "swatch-row";
    PALETTE_COLORS.forEach(function(color){
      const sw = document.createElement("button");
      sw.type = "button";
      sw.className = "swatch";
      sw.style.background = color;
      if(color.toLowerCase() === initialColor.toLowerCase()) sw.classList.add("selected");
      sw.addEventListener("click", function(){
        document.documentElement.style.setProperty(attr.key, color);
        row.querySelectorAll(".swatch").forEach(function(s){ s.classList.remove("selected"); });
        sw.classList.add("selected");
        savePaletteColor(attr, color);
      });
      row.appendChild(sw);
    });
    section.appendChild(row);
    paletteRows.appendChild(section);

    // 套用初始值（沿用上次選的，或第一次使用的預設值）
    document.documentElement.style.setProperty(attr.key, initialColor);
  });

  paletteBtn.addEventListener("click", function(){
    const isOpen = palettePanel.classList.toggle("open");
    paletteBtn.classList.toggle("armed", isOpen);
  });

  updateToolbarState();

  return showFullPageImage;
}


function resetViewToDefault(){
  const meta = document.querySelector('meta[name="viewport"]');
  // 這個函式不只在開頁時跑，分頁從背景切回前景（visibilitychange）
  // 也會跑——例如存檔後跳出系統下載通知、點開圖片看完再切回來，
  // 就會觸發一次。如果那個當下使用者其實還留在抓牌模式裡，不能
  // 硬改成首頁那套設定，不然會把抓牌模式該關閉的原生縮放重新
  // 打開，跟抓牌自己的兩指縮放（pageZoom）同時生效、互相打架，
  // 縮放手感會變得很奇怪（顛倒/錯亂），捲動位置也會被無故重設，
  // 打斷使用者原本在抓牌裡的瀏覽狀態。
  // 修正：先檢查當下是不是還在抓牌模式，是的話只重新套用抓牌該有的
  // viewport 設定（維持原生縮放關閉），其他什麼都不動；不是抓牌
  // 模式（真的在首頁）才照原本的邏輯全部重設（首頁維持原生縮放）。
  if(document.body.classList.contains("magnifier-mode")){
    if(meta) meta.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
    return;
  }
  window.scrollTo(0, 0);
  const scroller = document.querySelector(".scroller");
  if(scroller) scroller.scrollLeft = 0;
  document.body.style.zoom = "";
  document.body.style.overflow = "";
  window.__magnifierPinned = false;
  if(meta) meta.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");
  if(typeof pageZoom !== "undefined"){
    pageZoom = 1;
    if(typeof applyPageZoom === "function") applyPageZoom();
  }
}

async function loadData(){
  // 這個函式只負責539（唯一有即時資料來源的玩法），不管現在畫面上
  // 顯示的是不是539，都會照樣抓、照樣更新快取，只是「要不要真的
  // 重畫畫面」要看使用者當下是不是正在看539分頁——如果正在看天天樂，
  // 不能因為539背景抓資料，就把畫面搶回去變成539。
  try{
    const res = await fetch("https://539-backend-production.up.railway.app/data/results.json", {cache:"no-store"});
    if(!res.ok) throw new Error("no file");
    const data = await res.json();
    if(!Array.isArray(data) || data.length===0) throw new Error("empty");
    document.getElementById("demo-banner").innerHTML = "";
    data539Cache = data;
  }catch(e){
    data539Cache = EMBEDDED_DATA;
  }
  if(currentGameKey === "539"){
    currentAllData = data539Cache;
    buildPanels(data539Cache, currentBlanks);
    if(typeof window.__reapplyNumPicked === "function") window.__reapplyNumPicked();
    if(typeof window.__reapplyMagnifierState === "function") requestAnimationFrame(window.__reapplyMagnifierState);
  }
}

// 放大鏡開著的時候，把瀏覽器原生的雙指縮放擋掉，改用放大鏡自己實作的
// 縮放（見 setupImageView 裡的 touchstart/touchmove）。只在放大鏡開著
// 只有放大鏡開著的時候，才把瀏覽器原生的雙指縮放擋掉、改用自己實作
// 的縮放；沒開放大鏡的首頁，維持原生縮放不受影響。
function blockNativePinchZoomInMagnifier(){
  // 使用者最終要求：抓牌畫面裡的浮動按鍵要維持固定大小，不跟著
  // 內容縮放——這只能靠App自己的transform:scale()縮放（見
  // setupPageZoom()的完整說明），所以這裡要把封鎖原生縮放的邏輯
  // 加回來，但只限定在抓牌畫面（isMagnifierOpenGlobal()）才生效，
  // 首頁維持原生縮放不受影響。
  document.addEventListener("gesturestart", function(e){
    if(isMagnifierOpenGlobal()) e.preventDefault();
  }, { passive: false });
  document.addEventListener("gesturechange", function(e){
    if(isMagnifierOpenGlobal()) e.preventDefault();
  }, { passive: false });

  // 使用者回報：全頁模式（pinch-fullscreen-mode）縮到最小之後，
  // 用單指滑動（不是兩指縮放），畫面右側會出現一大塊空白，捲到
  // 超出開獎單實際內容邊界的地方。單指滑動是瀏覽器原生的捲動
  // 行為，不會經過上面兩指縮放那段自訂的JS邏輯（那段只處理兩指
  // 同時觸控的情況），所以只在那裡加水平捲動夾限沒有用，這裡另外
  // 加一個通用的scroll事件監聽器，只要偵測到目前是全頁模式，就
  // 即時把scrollX夾限在合理範圍內，不管是兩指縮放還是單指滑動
  // 觸發的捲動，都會被這裡攔到、修正。
  let scrollClampScheduled = false;
  window.addEventListener("scroll", function(){
    if(!document.body.classList.contains("pinch-fullscreen-mode")) return;
    if(scrollClampScheduled) return;
    scrollClampScheduled = true;
    requestAnimationFrame(function(){
      scrollClampScheduled = false;
      const pageZoomWrapElForClamp = document.getElementById("page-zoom-wrap");
      if(!pageZoomWrapElForClamp) return;
      const wrapRectForClamp = pageZoomWrapElForClamp.getBoundingClientRect();
      const maxScrollX = Math.max(0, window.scrollX + wrapRectForClamp.right - window.innerWidth);
      if(window.scrollX > maxScrollX){
        window.scrollTo(maxScrollX, window.scrollY);
      } else if(window.scrollX < 0){
        window.scrollTo(0, window.scrollY);
      }
    });
  }, { passive: true });

  // 封鎖瀏覽器原生的「下拉更新」：只有在頁面已經捲到最頂端、而且手指
  // 是往下移動（不是往上滑要看更下面的內容）的時候才擋掉，不然會連
  // 正常的往下捲動頁面都一起擋住。
  let pullRefreshStartY = null;
  document.addEventListener("touchstart", function(e){
    pullRefreshStartY = (e.touches && e.touches.length === 1) ? e.touches[0].clientY : null;
  }, { passive: true });

  document.addEventListener("touchmove", function(e){
    if(isMagnifierOpenGlobal() && e.touches && e.touches.length > 1) e.preventDefault();
    // body/html 的 overflow:hidden 在手機瀏覽器上不一定攔得住觸控捲動，
    // 固定畫面時額外在這裡把單指的捲動也一起擋掉，確保真的鎖死。
    if(viewPinnedGlobal() && e.touches && e.touches.length === 1) e.preventDefault();
    if(e.touches && e.touches.length === 1 && window.scrollY <= 0 && pullRefreshStartY !== null){
      const movedDown = e.touches[0].clientY - pullRefreshStartY;
      // 不管有沒有開放大鏡，不小心觸發整頁重新整理，會把標記、連接線、
      // 定期模式等等目前的操作狀態全部清空重來，一律擋掉。
      if(movedDown > 0) e.preventDefault();
    }
  }, { passive: false });
}

function isMagnifierOpenGlobal(){
  const overlay = document.getElementById("img-overlay");
  return overlay && overlay.classList.contains("open");
}

function viewPinnedGlobal(){
  return !!window.__magnifierPinned;
}

// 放大鏡自己實作的整頁縮放：只有放大鏡開著時才生效，用 transform 縮放
// 包住全部內容的 wrap。首頁本身（放大鏡沒開的時候）維持原生縮放。
let pageZoom = 1;
const PAGE_ZOOM_MIN = 1, PAGE_ZOOM_MAX = 5;

function applyPageZoom(){
  const wrap = document.getElementById("page-zoom-wrap");
  const spacer = document.getElementById("page-zoom-spacer");
  if(!wrap) return;
  wrap.style.transform = "scale(" + pageZoom + ")";
  if(spacer){
    // wrap 是用 transform 縮放，不會撐大 body 本身可捲動的範圍。這個
    // 看不見的定位點負責把可捲動範圍撐到縮放後、視覺上看到的右下角，
    // 縮多大就撐多大，才能捲到放大後超出原本畫面的部分。
    // 使用者實測發現首頁（沒有放大、pageZoom===1）捲到底時，下方
    // 會多出一大塊不該存在的空白——原因是這個spacer可能在某次
    // applyPageZoom()呼叫時，量到的wrap.getBoundingClientRect()
    // 不是最終定案的高度（例如切換玩法、資料還沒重新渲染完成的
    // 中途狀態），把可捲動範圍撐到比實際內容還長的位置，之後即使
    // 內容變回正常高度，這個撐開的範圍也不會自動縮回去。修法：
    // pageZoom===1（沒有放大）的時候，直接把spacer收回wrap的
    // 左上角（跟wrap本身重疊、不額外撐開任何範圍），不需要、也
    // 不應該讓可捲動範圍比body自然高度更長——只有真的放大
    // （pageZoom>1）才需要用spacer撐開多出來的可視範圍。
    if(pageZoom <= 1){
      spacer.style.left = "0px";
      spacer.style.top = "0px";
    } else {
      const rect = wrap.getBoundingClientRect();
      spacer.style.left = Math.round(window.scrollX + rect.left + rect.width) + "px";
      spacer.style.top = Math.round(window.scrollY + rect.top + rect.height) + "px";
    }
  }
  // 縮放當下同步重新計算連接線的位置＋粗細，讓線條的粗細跟著螢幕上
  // 實際的縮放程度即時同步變化，不會停在縮放前算好的舊尺寸。
  if(typeof window.__renderConnections === "function") window.__renderConnections();
  // 九宮鍵區外框「不」跟著縮放重新計算高度/寬度——使用者明確要求
  // 九宮鍵區位置固定，開獎單縮放/捲動都不能影響它，也不能讓開獎單
  // 內容跑到九宮鍵區背後透出來。之前在這裡掛了 applyImgHintBarConnect()
  // 想讓外框「跟著開獎單即時連接」，結果縮放之後外框位置反而跟著
  // 亂跳、跟畫面對不上，造成文字重疊的破圖——這是反效果，拿掉。
  // 外框的高度/位置維持「打開抓牌畫面那一刻」算出來的固定值，之後
  // 不管使用者怎麼縮放、捲動開獎單，都不再重新計算。
}

function setupPageZoom(){
  const wrap = document.getElementById("page-zoom-wrap");
  if(!wrap) return;
  // 使用者最終要求：抓牌畫面（放大鏡模式）縮放時，最下面那四顆
  // 浮動按鍵（存檔/返回/清除/大頭釘）要維持固定的螢幕顯示大小，
  // 不要跟著內容一起放大縮小。瀏覽器原生縮放是把整張畫面（包含
  // 所有position:fixed元素）當成一張照片整張一起縮放，網頁自己
  // 沒辦法讓特定元素排除在外——這是原生縮放天生的限制，不是bug，
  // 沒辦法用CSS/JS繞過。要讓浮動按鍵維持固定大小，只能改回用
  // App自己的transform:scale()縮放「開獎單內容」本身：這四顆
  // 浮動按鍵所在的.img-overlay，實際上是#page-zoom-wrap的
  // 「兄弟節點」、不在裡面（DOM結構上兩者平行），只要縮放對象是
  // #page-zoom-wrap，這四顆按鍵天生就不會被牽動，自然維持固定
  // 大小——這是選擇「自訂縮放」而非「原生縮放」的關鍵原因。
  // 首頁維持原生縮放不變（前面已確認首頁效果符合預期），這裡的
  // 自訂縮放只在抓牌畫面（isMagnifierOpenGlobal()）才生效。
  let pinchStartDist = null, pinchStartZoom = 1;
  let anchorContentX = 0, anchorContentY = 0; // 手指中心點對應的「內容座標」，縮放中途要讓這個點一直停在手指下面
  function dist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  function mid(touches){
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2,
    };
  }
  document.addEventListener("touchstart", function(e){
    if(!isMagnifierOpenGlobal()) return; // 首頁不受影響，維持原生縮放
    if(viewPinnedGlobal()) return; // 固定畫面時，縮放跟著鎖住
    if(e.touches.length === 2){
      // 兩指一放上去就先攔截掉，不給瀏覽器機會啟動自己的原生縮放
      // 辨識（跟原生縮放同時生效會互相打架），這個listener因此
      // 要用{passive:false}（見下方），不然這裡呼叫preventDefault()
      // 沒有用。
      e.preventDefault();
      pinchStartDist = dist(e.touches);
      pinchStartZoom = pageZoom;
      // transform-origin 固定在 wrap 的左上角(0,0)，記錄手指中心點目前
      // 對應到「內容裡的哪個座標」，縮放時才能讓這個點一路跟著手指走，
      // 手感才會跟原生縮放一樣是「以手指為中心」，而不是每次都從
      // 左上角開始放大。
      const m = mid(e.touches);
      anchorContentX = (window.scrollX + m.x) / pageZoom;
      anchorContentY = (window.scrollY + m.y) / pageZoom;
    }
  }, { passive: false });
  document.addEventListener("touchmove", function(e){
    if(!isMagnifierOpenGlobal()) return;
    if(viewPinnedGlobal()) return;
    if(e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      const d = dist(e.touches);
      let next = pinchStartZoom * (d / pinchStartDist);
      next = Math.max(PAGE_ZOOM_MIN, Math.min(PAGE_ZOOM_MAX, next));
      pageZoom = next;
      applyPageZoom();
      // 使用者回報：兩指縮放自動開啟全頁模式的功能，不小心影響到了
      // 「定期十六」的顯示（body.recent-only-mode）——這個全頁功能
      // 應該只在一般抓牌系統生效，「定期十六」是完全獨立的另一套
      // 顯示邏輯，不該被這裡牽動。加一個判斷，只要目前是定期十六
      // 模式，就整個跳過下面「觸發全頁模式」這一大段，不執行任何
      // pinch-fullscreen-mode相關的class切換/捲動/margin調整，
      // 「定期十六」畫面因此完全不受影響。
      if(document.body.classList.contains("recent-only-mode")) return;
      // 使用者要求：只要偵測到兩指縮放的動作，馬上進入「全頁」模式
      // （隱藏四顆彩券按鍵、九宮鍵工具列，只留開獎單本身跟左上角
      // 的✕鍵，見上面CSS body.pinch-fullscreen-mode那組規則），
      // 而且開獎單要移到最上面。這裡先判斷「這是不是第一次進入
      // 全頁模式的這一刻」（class還沒被加上去之前）——只有在這個
      // 轉換瞬間才強制捲動到最上面（window.scrollTo頂端），跳過
      // 下面正常的「手指錨點」捲動邏輯（那段邏輯是為了讓手指中心
      // 對應的內容位置不要跳動，但這裡使用者要的是「進全頁的那一刻
      // 直接跳到最上面」，兩者互相衝突，這一格畫面用跳到最上面優先）；
      // 之後同一次手勢繼續縮放的每個frame，就恢復用正常的錨點捲動
      // 邏輯，不會每個frame都被拉回最上面、變成完全不能繼續縮放
      // 瀏覽其他位置。
      const isEnteringFullscreenThisFrame = !document.body.classList.contains("pinch-fullscreen-mode");
      document.body.classList.add("pinch-fullscreen-mode");

      if(isEnteringFullscreenThisFrame){
        // 使用者回報：全頁模式左右留白不對稱，原因是#page-zoom-wrap
        // 可能還殘留其他地方（例如centerHomepageWrap()）用行內樣式
        // 設定的-1%左移，行內樣式的優先權比CSS stylesheet規則高，
        // 光靠CSS的body.pinch-fullscreen-mode覆蓋規則不保證一定
        // 生效（如果剛好在這個時間點之前，行內樣式又被其他程式碼
        // 重新設定過）。這裡在JS這層直接明確清空，作為最終保險，
        // 確保不管CSS選擇器優先權戰爭的結果如何，全頁模式下這個
        // 元素的margin-left一定是0，左右留白一定對稱。
        const pageZoomWrapElForFullscreen = document.getElementById("page-zoom-wrap");
        if(pageZoomWrapElForFullscreen) pageZoomWrapElForFullscreen.style.marginLeft = "0px";
        window.scrollTo(window.scrollX, 0);
      } else {
        // 縮放完之後，把捲動位置調整回去，讓手指中心點對應的內容還是
        // 停在原本的螢幕位置上，畫面才不會「跳來跳去」。
        const m = mid(e.touches);
        let targetScrollX = anchorContentX * pageZoom - m.x;
        let targetScrollY = anchorContentY * pageZoom - m.y;
        // 使用者回報：全頁模式縮到最小之後向左滑動，畫面右側會出現
        // 一大塊空白（滑過頭，捲到超出開獎單實際內容邊界的地方）。
        // 這裡額外做水平捲動範圍的夾限（clamp），確保scrollX不會
        // 超出#page-zoom-wrap目前實際渲染出來的寬度範圍，避免捲到
        // 內容邊界以外的空白區域。
        const pageZoomWrapElForClamp = document.getElementById("page-zoom-wrap");
        if(pageZoomWrapElForClamp){
          const wrapRectForClamp = pageZoomWrapElForClamp.getBoundingClientRect();
          const maxScrollX = Math.max(0, window.scrollX + wrapRectForClamp.right - window.innerWidth);
          targetScrollX = Math.max(0, Math.min(targetScrollX, maxScrollX));
        }
        window.scrollTo(targetScrollX, targetScrollY);
      }
    }
  }, { passive: false });
  document.addEventListener("touchend", function(e){
    if(e.touches.length < 2) pinchStartDist = null;
  });
  document.addEventListener("touchcancel", function(){ pinchStartDist = null; });

  // 使用者要求：左上角✕鍵連點兩下，立刻恢復成「像剛從首頁進入
  // 抓牌系統」的初始畫面——縮放回1倍、捲動回最頂端、UI（四顆
  // 彩券按鍵、九宮鍵工具列）全部恢復顯示，拿掉pinch-fullscreen-mode
  // 這個class。跟App裡其他類似的「連點兩下」按鍵一致，用dblclick
  // 事件，避免使用者不小心單點一下就誤觸。
  const pinchFullscreenCloseBtn = document.getElementById("pinch-fullscreen-close-btn");
  if(pinchFullscreenCloseBtn){
    pinchFullscreenCloseBtn.addEventListener("dblclick", function(){
      document.body.classList.remove("pinch-fullscreen-mode");
      pageZoom = 1;
      applyPageZoom();
      window.scrollTo(0, 0);
      // 退出全頁模式、回到一般抓牌畫面時，把margin-left恢復成一般
      // 抓牌畫面原本就該有的-1%（這是使用者之前就明確要求的效果，
      // 只有「全頁模式」不要這個偏移，一般抓牌畫面還是要維持）。
      const pageZoomWrapElForExit = document.getElementById("page-zoom-wrap");
      if(pageZoomWrapElForExit) pageZoomWrapElForExit.style.marginLeft = "-1%";
    });
  }
}

async function boot(){
  blockNativePinchZoomInMagnifier();
  setupPageZoom();
  setupStepper();
  setupImageView();
  setupGameTabs();
  setupManualEntry();
  resetViewToDefault();
  // 首頁一進來預設是539，理論上應該要唸一次「539」，但瀏覽器基於
  // 防止網頁自動亂出聲音的政策，通常不允許頁面「一載入」就自己
  // 播放語音（要先有使用者確實碰過畫面一次才能解鎖），直接在這裡
  // 呼叫大機率會被瀏覽器安靜地擋掉、沒反應。改成：監聽「使用者
  // 第一次碰畫面」這個時機點，那個當下才補唸一次「539」，確保
  // 真的唸得出來，不是空等一個實際上不會生效的呼叫。
  let hasSpokenInitial = false;
  function speakInitialOnFirstTouch(){
    if(hasSpokenInitial) return;
    hasSpokenInitial = true;
    speakGameName("539");
    document.removeEventListener("touchstart", speakInitialOnFirstTouch);
    document.removeEventListener("click", speakInitialOnFirstTouch);
  }
  document.addEventListener("touchstart", speakInitialOnFirstTouch, { once: true, passive: true });
  document.addEventListener("click", speakInitialOnFirstTouch, { once: true });
  window.addEventListener("pageshow", resetViewToDefault);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      resetViewToDefault();
      loadData();
    }
  });
  const refreshBtn = document.getElementById("refresh-btn");
  if(refreshBtn){
    // 「更新資料」現在會先呼叫 539-backend 的 API，請後端「現在馬上跑
    // 一次」抓取、比對、寫檔，等後端回應完成，才重新讀取顯示最新結果。
    // 如果後端沒有在跑（例如你還沒啟動 539-backend），這裡會直接失敗，
    // 退回原本「只重新讀取現有 results.json」的行為，不會讓畫面卡住。
    const BACKEND_REFRESH_URL = "https://539-backend-production.up.railway.app/api/refresh";

    refreshBtn.addEventListener("click", async function(){
      if(refreshBtn.classList.contains("spinning")) return;
      refreshBtn.classList.add("spinning");
      try{
        const controller = new AbortController();
        const timeoutId = setTimeout(function(){ controller.abort(); }, 20000);
        const res = await fetch(BACKEND_REFRESH_URL, { method: "POST", signal: controller.signal });
        clearTimeout(timeoutId);
        const result = await res.json();
        if(!result.ok){
          console.warn("539-backend 更新失敗：", result.error || result.reason);
        }
      }catch(e){
        console.warn("連不到 539-backend（可能還沒啟動），只重新讀取目前的資料檔。", e);
      }
      await loadData();
      setTimeout(function(){ refreshBtn.classList.remove("spinning"); }, 400);
    });
  }
  await loadData();
  // 60秒自動重新整理暫時停用（使用者要求）。首頁初始載入、手動按
  // 「更新」鍵，都還是正常運作，只有這個自動排程被關掉。要恢復的話
  // 把下面這行的註解拿掉即可。
  // setInterval(loadData, 60000);

  // 每次App啟動，順便去雲端資料庫（使用者自建的Railway API）看一下
  // 四種彩券各自有沒有比App目前內嵌資料更新的期數——這是「檢查、
  // 提示」，不是「自動合併」：這個雲端資料庫對539/六合彩/天天樂來說
  // 資料是片段不完整的backfill（已經跟使用者確認過），自動信任、
  // 自動合併風險較高，所以偵測到有更新的話，只在畫面上顯示一則
  // 提示，由使用者自己確認之後，再手動把號碼提供給開發者加入，不會
  // 自己動手改資料。這個檢查不會擋住App正常使用（await之外用
  // .catch吞掉任何錯誤，網路不通/雲端連不到都不影響其他功能）。
  checkCloudUpdates().catch(function(e){ console.warn("雲端更新檢查失敗（不影響其他功能）：", e); });

  // 使用者後續要求：「每次進入本程式時，也要上雲端看一下」——在上面
  // 「只提示不合併」的檢查之外，額外加一次會直接合併的查詢（沿用
  // 「資料更新」鍵背後同一套邏輯manualUpdateAndMergeData()，四種
  // 玩法都查、查到有更新就直接存進App），完全安靜執行，不跳出任何
  // 提示視窗。查完之後如果剛好合併了新資料，畫面（首頁最新開獎框、
  // 開獎單）會自動跟著更新。
  manualUpdateAndMergeData().catch(function(e){ console.warn("開啟時自動合併雲端資料失敗（不影響其他功能）：", e); });

  // 使用者要求：另外在本機開一個「獨立在程式之外」的資料庫
  // （IndexedDB），資料要跟著App目前的內嵌陣列保持同步。App每次
  // 啟動，都把當下EMBEDDED_DATA等陣列的完整內容同步一次進本機
  // 資料庫（見syncLotteryLocalDB()），確保就算使用者是先前某個
  // 版本累積更新過內嵌資料、才換到這一版程式碼，本機資料庫也會
  // 補齊成最新的完整內容，不會缺漏。
  syncLotteryLocalDB().catch(function(e){ console.warn("本機資料庫初始同步失敗（不影響App主要功能）：", e); });
}
boot();

async function checkCloudUpdates(){
  const CLOUD_GAME_MAP = getCloudGameMap();
  const updates = [];
  for(const g of CLOUD_GAME_MAP){
    const result = await fetchSingleGameCloudLatest(g);
    if(result.ok && result.update) updates.push(result.update);
  }
  if(updates.length > 0){
    showCloudUpdateBanner(updates);
  }
}

// 「資料更新」鍵手動觸發用：跟 checkCloudUpdates()（App開啟時的
// 自動檢查，只提示不合併）不一樣，這個函式查到有更新**直接合併
// 進App**（呼叫 manualUpsertDrawRecord()，跟排程自動合併同一套
// 邏輯），不是只顯示提示banner。使用者明確要求「點選資料更新，
// 立刻上雲端拉最新資料，如果有新資料便更新並儲存、更新顯示」，
// 這是比「只檢查」更進一步、會實際改動App資料的操作，所以獨立
// 成一個函式，跟自動檢查的政策分開，不要混用。
// 使用者後續要求：改用manualUpsertDrawRecord()而不是
// appendNewDrawRecord()——後者只接受「比本機最後一筆更新」的日期，
// 沒辦法處理「同一天但號碼被雲端校正過」這種情況（見
// fetchSingleGameCloudLatest()裡新增的isSameDateButDifferentNumbers
// 判斷），manualUpsertDrawRecord()可以正確處理新增跟覆蓋兩種情況。
// 回傳更新摘要陣列，讓呼叫端（按鍵的click handler）決定怎麼顯示
// 結果訊息。
async function manualUpdateAndMergeData(){
  const CLOUD_GAME_MAP = getCloudGameMap();
  const merged = [];
  for(const g of CLOUD_GAME_MAP){
    const result = await fetchSingleGameCloudLatest(g);
    if(result.ok && result.update){
      const numbers = result.update.numbersRaw.trim().split(/\s+/)
        .map(function(s){ return parseInt(s, 10); }).filter(function(n){ return !isNaN(n); });
      const special = parseInt(result.update.specialRaw, 10);
      manualUpsertDrawRecord(g.key, result.update.cloudDate, numbers, special);
      merged.push(result.update);
    }
  }
  return merged;
}

// 內部玩法代號 -> 雲端資料庫的game參數名稱、對應的內嵌資料變數、
// 顯示用名稱。539優先看 data539Cache（539自己另外有即時backend，
// loadData()已經在這之前跑完，data539Cache如果有值代表這才是
// 畫面上實際顯示的最新資料，比純靜態的EMBEDDED_DATA更準）。抽成
// 一個函式而不是寫死的常數，是因為 data539Cache 是會變動的（每次
// loadData()完成後可能更新），排程檢查（見下方
// runScheduledCloudChecks()）是在App開著的過程中反覆執行的，每次
// 執行都要重新讀一次「當下」的 data539Cache，不能只在App剛開的
// 那一刻算一次就固定住。
function getCloudGameMap(){
  return [
    { key: "539", cloudName: "今彩539", data: (data539Cache || EMBEDDED_DATA) },
    { key: "daily", cloudName: "加州天天樂", data: EMBEDDED_DAILY_DATA },
    { key: "mark6", cloudName: "香港六合彩", data: EMBEDDED_MARK6_DATA },
    { key: "lotto", cloudName: "大樂透", data: EMBEDDED_LOTTO_DATA },
  ];
}

// draw_date 可能是 "YYYY-MM-DD" 或 "YYYY/MM/DD"，統一換成
// "YYYY-MM-DD" 才能直接用字串比大小。
function normalizeDrawDate(s){
  return (s || "").trim().replace(/\//g, "-");
}

// 查詢「單一玩法」雲端最新資料，跟本機資料比對，有更新就回傳更新
// 資訊物件，沒有更新（或查詢失敗）回傳null。這個函式同時給
// checkCloudUpdates()（App開啟時檢查全部4種玩法）跟
// runScheduledCloudChecks()（下方排程，一次只檢查「輪到的」那一種
// 玩法）共用，不用寫兩份幾乎一樣的fetch邏輯。
// 查詢單一玩法的雲端最新資料，回傳 {ok, update}——ok表示「這次
// 查詢本身有沒有順利完成」（不管有沒有查到更新都算ok=true），
// update是「有更新才會有值，否則是null」。把「查詢有沒有成功」跟
// 「有沒有查到更新」分開回傳，是因為排程檢查（見下方
// runScheduledCloudChecks()）需要分辨這兩種情況：查詢失敗要retry，
// 查詢成功但沒有更新則不用retry。
async function fetchSingleGameCloudLatest(g){
  // 修正：網址跟串接方式都改成正確的雲端資料庫規格（見「樂透雲端
  // 資料庫讀取說明」文件）——
  // 1) 網址原本是api-production-6a938.up.railway.app，是錯的舊
  //    網址，正確應該是hearty-vitality-production-0687.up.railway.app。
  // 2) game要放在路徑裡（/draws/{game}），不是查詢字串（?game=xxx）
  //    ——原本的寫法（?game=xxx）打到正確的新網址上其實是查「全部
  //    玩法」的資料，沒有依照game正確篩選。
  // 3) 回傳格式是直接一個JSON陣列（不是包在{draws:[...]}物件裡），
  //    原本json.draws這個寫法會抓到undefined，變成永遠查不到資料。
  // 使用者持續回報：改完上面三點之後，「查詢雲端資料失敗（今彩539）：
  // DataCloneError」這個警告還是每次都出現，代表問題不只這三點。
  // 找到更精確的原因：DataCloneError是「結構化複製演算法」相關的
  // 錯誤類型（postMessage／IndexedDB等API在用），不是一般的網路/
  // CORS錯誤會丟出的類型——某些Android WebView版本（使用者測試的
  // 網址是content://開頭，代表是系統內建WebView元件開啟，不是完整
  // 版Chrome），已知在fetch()搭配AbortController的signal參數時，
  // 會誤觸發這個內部bug。這裡改用Promise.race做逾時控制，不把
  // signal傳給fetch()，避開這個瀏覽器層級的問題。
  const CLOUD_API = "https://hearty-vitality-production-0687.up.railway.app/draws";
  try{
    const url = CLOUD_API + "/" + encodeURIComponent(g.cloudName) + "?limit=5&_ts=" + Date.now();
    const fetchPromise = fetch(url, {
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" },
    });
    const timeoutPromise = new Promise(function(_, reject){
      setTimeout(function(){ reject(new Error("timeout")); }, 8000);
    });
    const res = await Promise.race([fetchPromise, timeoutPromise]);
    // 文件補充說明：查不到該彩券任何資料時，API會回傳404，body是
    // {"detail": "找不到「xxx」的資料"}——這是合法的「目前沒資料」
    // 回應，不是真正的查詢失敗，不應該當成失敗去retry，這裡特別
    // 判斷：404單獨當作「有連上、只是沒資料」處理；其他非2xx狀態
    // 碼（逾時、伺服器錯誤等）才算真正的查詢失敗。
    if(res.status === 404) return { ok: true, update: null };
    if(!res.ok) return { ok: false, update: null };
    const json = await res.json();
    // 回傳本身就是陣列（見文件的Python範例：records = get_latest(...)，
    // 直接for r in records疊代，不是先取.draws）。這裡同時保留對
    // 「萬一哪天API改成包一層物件」的容錯，兩種格式都能正確處理。
    const draws = Array.isArray(json) ? json : ((json && json.draws) || []);
    if(draws.length === 0) return { ok: true, update: null }; // 有連上但沒資料，不算失敗
    // 保險起見自己再排序一次，取真正最新的一筆。
    draws.sort(function(a, b){
      return normalizeDrawDate(b.draw_date).localeCompare(normalizeDrawDate(a.draw_date));
    });
    const cloudLatest = normalizeDrawDate(draws[0].draw_date);
    const localLastRecord = g.data.length ? g.data[g.data.length - 1] : null;
    const localLatest = localLastRecord ? localLastRecord.date : "";
    // 使用者要求：如果本機已經有同一天的資料，但雲端抓到的號碼
    // 跟本機不一樣（代表雲端後來校正過），要以雲端號碼為準覆蓋
    // 本機——不只是「有沒有比本機更新一期」才算更新，「同一天但
    // 號碼不同」也要算。這裡把雲端號碼、特別號都正規化成統一格式
    // （補0、空白分隔），才能正確比對是不是真的不一樣（避免因為
    // 補0格式不同、順序不同這種表面差異被誤判成「不一樣」）。
    function normalizeNumbersForCompare(numbers){
      return (numbers || []).map(function(n){ return String(n).padStart(2, "0"); }).join(" ");
    }
    const cloudNumbersNormalized = (draws[0].numbers || "").trim().split(/\s+/)
      .map(function(s){ return s.padStart(2, "0"); }).join(" ");
    const cloudSpecialNormalized = draws[0].special_number ? String(parseInt(draws[0].special_number, 10)).padStart(2, "0") : "";
    let isSameDateButDifferentNumbers = false;
    if(cloudLatest && localLatest && cloudLatest === localLatest && localLastRecord){
      const localNumbersNormalized = normalizeNumbersForCompare(localLastRecord.numbers);
      const localSpecialNormalized = typeof localLastRecord.special === "number" ? String(localLastRecord.special).padStart(2, "0") : "";
      if(localNumbersNormalized !== cloudNumbersNormalized || localSpecialNormalized !== cloudSpecialNormalized){
        isSameDateButDifferentNumbers = true;
      }
    }
    if(cloudLatest && localLatest && (cloudLatest > localLatest || isSameDateButDifferentNumbers)){
      return {
        ok: true,
        update: {
          label: GAME_LABELS[g.key] || g.key,
          cloudDate: cloudLatest,
          localDate: localLatest,
          isCorrection: isSameDateButDifferentNumbers, // 標記這是「同一天號碼被雲端校正」，不是全新一期，呼叫端要用覆蓋而不是單純append
          // 這一筆的原始號碼字串（空白分隔）跟特別號，供排程檢查
          // 自動合併進App用（見 manualUpsertDrawRecord()）。今彩539／
          // 加州天天樂沒有特別號，draws[0].special_number會是空
          // 字串，這裡照樣存起來，呼叫端會判斷這個玩法用不用得到。
          numbersRaw: draws[0].numbers || "",
          specialRaw: draws[0].special_number || "",
        },
      };
    }
    return { ok: true, update: null };
  }catch(e){
    // 查詢失敗（逾時、網路問題等）不影響其他玩法繼續查，也不影響
    // App其他功能。
    console.warn("查詢雲端資料失敗（" + g.cloudName + "）：", e);
    return { ok: false, update: null };
  }
}

function showCloudUpdateBanner(updates){
  const banner = document.getElementById("demo-banner");
  if(!banner) return;
  const lines = updates.map(function(u){
    return u.label + "：雲端已到 " + u.cloudDate + "（App目前到 " + u.localDate + "）";
  });
  banner.innerHTML =
    '<div style="background:#fff8e0; border:1.5px solid #e0a020; border-radius:6px; ' +
    'margin:8px 14px; padding:8px 10px; font-size:12px; line-height:1.6; color:#5a4a00;">' +
    '☁️ 偵測到雲端資料庫有更新，App裡的資料可能不是最新：<br>' +
    lines.join('<br>') +
    '</div>';
}

// ============================================================
// 定時排程：每天固定時段檢查雲端資料庫有沒有各玩法的最新資料
// ============================================================
// 使用者要求的時段（都是台灣當地時間，App用手機系統時間判斷）：
//   539：每天晚上 21:00～21:30
//   加州天天樂：每天早上 11:30～12:00
//   香港六合彩、大樂透：每天晚上 22:00～22:30
// **重要限制：這是純手機瀏覽器網頁App，沒有後端伺服器、沒有背景
// 執行能力，這個排程只有在App實際開著（畫面在前景）的時候才會
// 運作**，沒辦法在手機App關閉、螢幕鎖著的情況下自動在背景觸發。
// 使用者已經確認了解這個限制、還是要這個功能（會盡量在那些時段
// 開著App）。
//
// **這個排程是純背景運作，畫面上完全不會顯示任何東西**（不管查詢
// 結果正確或失敗，都不會跳出提示訊息、不會有banner）——這一點
// 是使用者明確要求的，跟「App開啟時的 checkCloudUpdates()」不一樣
// （那個會在首頁顯示提示banner）。這個排程只是單純把資料查回來、
// 記錄下來而已，不打擾使用者。
//
// 判斷邏輯：每分鐘檢查一次目前時間，如果落在某個玩法的時段內：
// - 如果查詢「失敗」（網路問題、逾時等），**不標記為已檢查，
//   3分鐘後才會再重試一次**（不是每分鐘都重試，用
//   lastAttemptAt這個時間戳記判斷，避免短時間內對雲端狂發請求）
// - 如果查詢「成功」（不管有沒有查到更新），就標記「今天這個
//   玩法已經檢查過」，結束這次排程，這個時段內不會再重複查詢
// 「今天已檢查過」的標記存在localStorage，就算App中途關掉、當天
// 稍晚在同一個時段內重新打開，也不會重複觸發；換日期之後（key裡
// 帶了日期）等於全新一天重新開始判斷。
const SCHEDULE_WINDOWS = [
  { key: "539",   windowId: "primary",  startMin: 21*60,     endMin: 21*60+30 },
  { key: "daily", windowId: "primary",  startMin: 11*60+30,  endMin: 12*60 },
  { key: "mark6", windowId: "primary",  startMin: 22*60,     endMin: 22*60+30 },
  { key: "lotto", windowId: "primary",  startMin: 22*60,     endMin: 22*60+30 },
  // 使用者要求：如果當天號碼到隔天0點還沒更新，要再上雲端拉一次；
  // 另外每天固定中午也要拉一次——這兩個是額外的「補漏」檢查點，
  // 4種玩法都要各自檢查一次，不管前面主要時段有沒有查過/查到。
  // 因為同一個gameKey現在會出現在好幾個不同的時段（primary／
  // midnight／noon），下面把「今天是否已檢查過」的判斷從單純用
  // gameKey，改成gameKey+windowId一起組合，確保這幾個時段各自
  // 獨立判斷、不會因為某個時段查過了，其他時段就被誤判成「今天
  // 已經查過」而跳過。
  { key: "539",   windowId: "midnight", startMin: 0,       endMin: 10 },
  { key: "daily", windowId: "midnight", startMin: 0,       endMin: 10 },
  { key: "mark6", windowId: "midnight", startMin: 0,       endMin: 10 },
  { key: "lotto", windowId: "midnight", startMin: 0,       endMin: 10 },
  { key: "539",   windowId: "noon",     startMin: 12*60,   endMin: 12*60+10 },
  { key: "daily", windowId: "noon",     startMin: 12*60,   endMin: 12*60+10 },
  { key: "mark6", windowId: "noon",     startMin: 12*60,   endMin: 12*60+10 },
  { key: "lotto", windowId: "noon",     startMin: 12*60,   endMin: 12*60+10 },
];
const RETRY_INTERVAL_MS = 3 * 60 * 1000; // 查詢失敗後，多久才重試一次
const scheduleLastAttemptAt = {}; // 記錄每個「玩法+時段」最近一次「嘗試查詢」的時間戳，只存在記憶體裡，App關掉重開就重置（沒關係，重開之後本來就會重新判斷）
function getScheduleCheckedKey(gameKey, windowId, dateStr){
  return "539_schedule_checked_" + gameKey + "_" + windowId + "_" + dateStr;
}
function hasScheduleCheckedToday(gameKey, windowId, dateStr){
  try{
    return localStorage.getItem(getScheduleCheckedKey(gameKey, windowId, dateStr)) === "1";
  }catch(e){
    return false; // 讀不到localStorage就當作沒檢查過，寧可多查一次也不要漏查
  }
}
function markScheduleCheckedToday(gameKey, windowId, dateStr){
  try{
    localStorage.setItem(getScheduleCheckedKey(gameKey, windowId, dateStr), "1");
  }catch(e){
    // 存不進去就算了，這次的查詢結果還是有效，只是下次可能會
    // 重複查一次，不影響正確性。
  }
}

// 把排程查到的「單一筆最新開獎資料」實際加進App裡（首頁最新開獎
// 顯示、開獎單都會跟著更新）——使用者已經明確確認要這個自動合併
// 行為，了解過風險（這個雲端資料庫除了大樂透以外，之前測試過是
// 片段不完整的backfill）之後才要求的。因為排程是鎖定「單一玩法
// 固定的開獎後時段」去查「有沒有比本地新一筆」，查到的通常就是
// 剛開出來的最新一期，是新增「一筆」、不是整批匯入，風險比之前
// 疑慮的「批次匯入片段資料」小很多。
const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"]; // Date.getDay()的順序：0是星期日
function appendNewDrawRecord(gameKey, dateStr, numbersRaw, specialRaw){
  // 用日期字串自己算星期幾，不依賴雲端回傳的星期（雲端有些欄位
  // 是空的，自己算比較保險）。用 T00:00:00 明確指定時間，避免
  // 不同時區解析出不同的日期。
  const d = new Date(dateStr + "T00:00:00");
  if(isNaN(d.getTime())) return; // 日期格式異常，安全起見不新增，等下次排程再試
  const weekday = WEEKDAY_LABELS[d.getDay()];
  const numbers = numbersRaw.trim().split(/\s+/).map(function(s){ return parseInt(s, 10); }).filter(function(n){ return !isNaN(n); });
  if(numbers.length === 0) return; // 號碼解析不出來，安全起見不新增
  const record = { date: dateStr, weekday: weekday, numbers: numbers };
  const special = parseInt(specialRaw, 10);
  if(!isNaN(special)) record.special = special; // 六合彩/大樂透才有特別號，539/天天樂這裡會是NaN，不會加上這個欄位

  let targetArray = null;
  if(gameKey === "539"){
    targetArray = EMBEDDED_DATA;
    // 539另外有自己的即時backend快取（data539Cache），如果現在
    // 有值，也要一起加，不然下次539分頁重新整理／切換回來的時候，
    // 會看到用data539Cache算出來的版本沒有這筆、又「消失」。
    if(data539Cache && Array.isArray(data539Cache)) data539Cache.push(record);
  } else if(gameKey === "daily"){
    targetArray = EMBEDDED_DAILY_DATA;
  } else if(gameKey === "mark6"){
    targetArray = EMBEDDED_MARK6_DATA;
  } else if(gameKey === "lotto"){
    targetArray = EMBEDDED_LOTTO_DATA;
  }
  if(!targetArray) return;
  // 保險起見再檢查一次最後一筆的日期，避免極端情況下（例如同一
  // 時間點排程被觸發兩次）重複新增同一筆。
  if(targetArray.length && targetArray[targetArray.length - 1].date >= dateStr) return;
  targetArray.push(record);

  // 使用者要求：本機獨立資料庫（IndexedDB）要跟著自動更新——這裡
  // 新增了一筆新資料到內嵌陣列，同一筆也要寫進本機資料庫，兩邊
  // 保持同步。用單筆寫入（saveDrawRecordToDB）而不是整批重新
  // 同步（syncLotteryLocalDB），效能上更輕量，不用每次新增一筆
  // 就把整個陣列重新寫一次。
  saveDrawRecordToDB(gameKey, record).catch(function(e){
    console.warn("新資料寫入本機資料庫失敗（不影響App主要功能）：", e);
  });

  // 使用者接著要求：每次有新資料，也要自動把整個資料庫重新下載成
  // 一份真正的檔案（不是瀏覽器內部儲存），讓其他程式有機會透過
  // 讀取實體檔案的方式取得資料，不受IndexedDB的來源限制。使用者
  // 已經確認過、可以接受「每次自動下載都是新檔名（系統自動加
  // 編號）」這個限制，會自己手動整理檔案，所以這裡直接觸發下載，
  // 不用處理檔名衝突。
  try{
    exportLotteryDatabaseAsFile();
  }catch(e){
    console.warn("自動匯出資料庫檔案失敗（不影響App主要功能）：", e);
  }

  // 如果使用者現在正好開著這個玩法的分頁，立刻重畫（首頁最新開獎
  // 框、開獎單都會馬上看到新的一筆）；如果現在開著的是別的玩法，
  // 就只更新資料、不搶畫面——使用者切換過去的時候，本來就會用
  // 更新後的資料重新畫一次，不用現在就強制重畫。
  if(currentGameKey === gameKey){
    currentAllData = (gameKey === "539" && data539Cache) ? data539Cache : targetArray;
    buildPanels(currentAllData, currentBlanks);
    if(typeof window.__reapplyNumPicked === "function") window.__reapplyNumPicked();
    if(typeof window.__reapplyMagnifierState === "function") requestAnimationFrame(window.__reapplyMagnifierState);
  }
}

// 手動輸入開獎專用的新增/覆蓋函式，跟上面appendNewDrawRecord()不
// 共用的原因：appendNewDrawRecord()是排程/雲端合併專用，刻意只接受
// 「比陣列最後一筆還新」的日期（避免排程重複觸發、亂序寫入），手動
// 輸入的使用情境不一樣——使用者可能補一筆剛好卡在中間的舊日期、
// 也可能是想覆蓋/修正某一筆已經存在但打錯的資料，所以這裡改成：
// 依日期找到正確的排序位置插入；如果那個日期本來就已經有一筆，
// 直接覆蓋掉那一筆（不是拒絕、也不是重複新增）。
function manualUpsertDrawRecord(gameKey, dateStr, numbers, special){
  const d = new Date(dateStr + "T00:00:00");
  if(isNaN(d.getTime())) return { ok: false, reason: "日期格式錯誤" };
  const weekday = WEEKDAY_LABELS[d.getDay()];
  // 使用者要求：開獎號碼要由小到大排序，特別號不列入排序範圍——
  // 這裡只排序一般號碼（numbers這個陣列），special是完全獨立的
  // 另一個欄位，不會混進排序，維持原本選的值。跟App裡其他地方的
  // 開獎資料格式一致（不管是內嵌資料、雲端拉下來的資料，號碼欄位
  // 本來就是由小到大排序的狀態），手動輸入這裡也要符合同樣的
  // 格式，畫面顯示、比對等功能才會正常運作。
  const sortedNumbers = numbers.slice().sort(function(a, b){ return a - b; });
  const record = { date: dateStr, weekday: weekday, numbers: sortedNumbers };
  if(typeof special === "number" && !isNaN(special)) record.special = special;

  let targetArray = null;
  if(gameKey === "539") targetArray = EMBEDDED_DATA;
  else if(gameKey === "daily") targetArray = EMBEDDED_DAILY_DATA;
  else if(gameKey === "mark6") targetArray = EMBEDDED_MARK6_DATA;
  else if(gameKey === "lotto") targetArray = EMBEDDED_LOTTO_DATA;
  if(!targetArray) return { ok: false, reason: "找不到對應的玩法資料" };

  const existingIdx = targetArray.findIndex(function(r){ return r.date === dateStr; });
  if(existingIdx >= 0){
    targetArray[existingIdx] = record; // 同一天已經有資料，直接覆蓋
  } else {
    // 找到第一筆「日期比新資料晚」的位置，插進它前面，維持陣列
    // 原本按日期由舊到新排序的順序；如果找不到（代表這筆比全部都
    // 新），insertAt會是-1，退回push到最後。
    const insertAt = targetArray.findIndex(function(r){ return r.date > dateStr; });
    if(insertAt === -1) targetArray.push(record);
    else targetArray.splice(insertAt, 0, record);
  }
  // 539另外有自己的即時backend快取（data539Cache），要跟EMBEDDED_DATA
  // 做同樣的插入/覆蓋，不然畫面實際顯示用的是data539Cache、看不到
  // 這筆手動輸入的資料。
  if(gameKey === "539" && data539Cache && Array.isArray(data539Cache)){
    const cacheIdx = data539Cache.findIndex(function(r){ return r.date === dateStr; });
    if(cacheIdx >= 0) data539Cache[cacheIdx] = record;
    else {
      const cacheInsertAt = data539Cache.findIndex(function(r){ return r.date > dateStr; });
      if(cacheInsertAt === -1) data539Cache.push(record);
      else data539Cache.splice(cacheInsertAt, 0, record);
    }
  }

  saveDrawRecordToDB(gameKey, record).catch(function(e){
    console.warn("手動輸入資料寫入本機資料庫失敗（不影響App主要功能）：", e);
  });
  try{
    exportLotteryDatabaseAsFile();
  }catch(e){
    console.warn("自動匯出資料庫檔案失敗（不影響App主要功能）：", e);
  }
  if(currentGameKey === gameKey){
    currentAllData = (gameKey === "539" && data539Cache) ? data539Cache : targetArray;
    buildPanels(currentAllData, currentBlanks);
    if(typeof window.__reapplyNumPicked === "function") window.__reapplyNumPicked();
    if(typeof window.__reapplyMagnifierState === "function") requestAnimationFrame(window.__reapplyMagnifierState);
  }
  return { ok: true };
}

// 首頁「手動輸入」按鍵：使用者要求在「資料更新」左邊加一顆手動輸入
// 開獎結果的功能，日期用原生date輸入元件（不能選未來日期），號碼
// 不能用鍵盤打字，要用點選的號碼表（539/天天樂5欄、最大39號；
// 六合彩/大樂透6號碼+1特別號共7欄、最大49號），且同一筆裡不能選
// 重複號碼。
function setupManualEntry(){
  const entryBtn = document.getElementById("manual-entry-btn");
  const inlineWrap = document.getElementById("manual-entry-inline");
  const backdrop = document.getElementById("manual-entry-backdrop");
  const dateInput = document.getElementById("manual-entry-date");
  const slotsWrap = document.getElementById("manual-entry-slots");
  const hintEl = document.getElementById("manual-entry-hint");
  const confirmBtn = document.getElementById("manual-entry-confirm");
  const cancelBtn = document.getElementById("manual-entry-cancel");
  const pickerDropdown = document.getElementById("manual-num-picker-dropdown");
  const pickerTitle = document.getElementById("manual-num-picker-title");
  const pickerGrid = document.getElementById("manual-num-picker-grid");
  if(!entryBtn || !inlineWrap) return;

  let active = false; // 目前是不是在「手動輸入」編輯狀態
  let slotValues = []; // 目前每一欄選到的號碼，null代表還沒選
  let activeSlotIndex = -1; // 目前正在編輯（點開選號表）的是第幾欄
  // 使用者要求：如果選的日期在資料庫裡已經有資料，代表這次是要
  // 「更正」既有號碼，存入之前要先跳出確認字樣，不能一按確認就
  // 直接覆蓋掉。這個旗標記錄「使用者已經看過確認訊息、按過一次
  // 確認」的狀態，第二次按確認才會真的存入；只要日期或任何一個
  // 號碼欄位被改動過，就要重設回false，不能讓「確認過」的狀態
  // 沿用到使用者後來又改了其他內容的情況。
  let pendingCorrectionConfirm = false;

  // 依gameKey＋日期，找出資料庫（內嵌陣列）裡原本已經存在的那一筆
  // （沒有就回傳null），用來判斷「這次存入是不是在更正既有資料」。
  function findExistingRecord(gameKey, dateStr){
    let targetArray = null;
    if(gameKey === "539") targetArray = (data539Cache && Array.isArray(data539Cache)) ? data539Cache : EMBEDDED_DATA;
    else if(gameKey === "daily") targetArray = EMBEDDED_DAILY_DATA;
    else if(gameKey === "mark6") targetArray = EMBEDDED_MARK6_DATA;
    else if(gameKey === "lotto") targetArray = EMBEDDED_LOTTO_DATA;
    if(!targetArray) return null;
    return targetArray.find(function(r){ return r.date === dateStr; }) || null;
  }

  function todayStr(){
    const now = new Date();
    return now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");
  }

  // 依目前是哪個玩法，決定欄位數量、最大號碼、有沒有特別號欄位。
  function getSlotConfig(){
    if(isWideGame()){
      // 六合彩／大樂透：6個一般號碼＋1個特別號，最大49號。
      return { count: 7, max: 49, specialIndex: 6 };
    }
    // 539／天天樂：5個號碼，最大39號，沒有特別號欄位。
    return { count: 5, max: 39, specialIndex: -1 };
  }

  function hideHint(){ hintEl.classList.remove("open"); hintEl.textContent = ""; }
  function showHint(msg){ hintEl.textContent = msg; hintEl.classList.add("open"); }

  function resetConfirmState(){
    pendingCorrectionConfirm = false;
    confirmBtn.textContent = "✓";
    hideHint();
  }

  function renderSlots(){
    const cfg = getSlotConfig();
    slotValues = new Array(cfg.count).fill(null);
    slotsWrap.innerHTML = "";
    for(let i = 0; i < cfg.count; i++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "manual-entry-slot" + (i === cfg.specialIndex ? " special" : "");
      btn.textContent = "--";
      btn.dataset.slotIndex = String(i);
      btn.addEventListener("click", function(){ openPickerForSlot(i); });
      slotsWrap.appendChild(btn);
    }
    updateConfirmButtonState();
  }

  function updateSlotButton(i){
    const btn = slotsWrap.children[i];
    if(!btn) return;
    const v = slotValues[i];
    btn.textContent = v === null ? "--" : String(v).padStart(2, "0");
    btn.classList.toggle("filled", v !== null);
  }

  // 使用者要求：號碼必須選滿才能按「確認」（539/天天樂5個號碼、
  // 六合彩/大樂透6個號碼+1個特別號共7個，全部欄位都要有值），不是
  // 「點了確認才顯示還沒選完」，是直接把按鍵鎖住、選滿之前根本點
  // 不動，操作上更直覺。
  function allSlotsFilled(){
    return slotValues.length > 0 && slotValues.every(function(v){ return v !== null; });
  }
  function updateConfirmButtonState(){
    confirmBtn.disabled = !allSlotsFilled();
  }

  dateInput.addEventListener("change", resetConfirmState);

  // 使用者要求：選號碼的時候，不用選一顆就整個選擇框消失，要連續
  // 選下去——選完一顆自動跳到下一個還沒選的空欄位繼續選，選滿
  // 全部（5顆或7顆）之後，整個選號框才會關閉。
  function findNextEmptySlot(afterIndex){
    // 先找「目前這格之後」的空欄位，比較符合使用者一路往下選的
    // 直覺；找不到的話再從頭開始找有沒有漏掉的（例如使用者跳著選、
    // 中間留了空格）。
    for(let idx = afterIndex + 1; idx < slotValues.length; idx++){
      if(slotValues[idx] === null) return idx;
    }
    for(let idx = 0; idx < slotValues.length; idx++){
      if(slotValues[idx] === null) return idx;
    }
    return -1; // 全部都選滿了
  }
  function openPickerForSlot(i){
    activeSlotIndex = i;
    const cfg = getSlotConfig();
    pickerTitle.textContent = (i === cfg.specialIndex) ? "選擇特別號" : "選擇號碼";
    // 同一筆裡已經被其他欄位選走的號碼要灰掉、不能重複選——但如果
    // 是「重新點開自己這一欄」要修改，自己原本選的那個號碼不能被
    // 自己擋住，要排除掉自己這一欄目前的值。
    const usedElsewhere = {};
    slotValues.forEach(function(v, idx){
      if(idx !== i && v !== null) usedElsewhere[v] = true;
    });
    pickerGrid.innerHTML = "";
    for(let n = 1; n <= cfg.max; n++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = String(n).padStart(2, "0");
      if(usedElsewhere[n]){
        btn.disabled = true;
      } else {
        btn.addEventListener("click", function(){
          slotValues[activeSlotIndex] = n;
          updateSlotButton(activeSlotIndex);
          updateConfirmButtonState();
          // 號碼欄位被改動了，先前「已經確認過更正」的狀態不能沿用。
          resetConfirmState();
          const nextEmpty = findNextEmptySlot(activeSlotIndex);
          // 抓到真正的bug：如果在這裡「立刻」清空重建選號表
          // （openPickerForSlot會先pickerGrid.innerHTML=""再重
          // 建），這次點擊事件還沒结束、還在往外傳遞（bubble）到
          // document的過程中，原本被點擊的這顆按鈕已經從DOM上消失
          // 了——下面「點擊選號框以外的地方就關閉」那段監聽器，檢查
          // 「這次點擊是不是點在選號框裡面」時，會因為e.target（就
          // 是這顆已經被移除的按鈕）已經不在DOM樹上，判斷成「點在
          // 外面」，反而把選號框關掉，變成「選一顆就消失」。改成用
          // setTimeout延後執行，等這次點擊事件完全處理完（包含
          // document監聽器也跑完）之後，才真的去換下一個欄位、
          // 重建選號表內容，就不會有這個時序問題。
          setTimeout(function(){
            if(nextEmpty === -1){
              closePicker(); // 全部選滿了，這時候才真的關閉選號框
            } else {
              openPickerForSlot(nextEmpty); // 還沒選滿，直接換成下一個空欄位繼續選，不關閉
            }
          }, 0);
        });
      }
      pickerGrid.appendChild(btn);
    }
    pickerDropdown.classList.add("open");
  }
  function closePicker(){
    pickerDropdown.classList.remove("open");
    activeSlotIndex = -1;
  }
  // 點選號下拉框以外的地方（但不是點在「手動輸入」那一整列本身
  // 的其他部分）就關閉選號框，跟原本全螢幕遮罩「點背景關閉」的
  // 邏輯精神一樣，只是現在沒有全螢幕背景可以點，改成監聽整個文件。
  document.addEventListener("click", function(e){
    if(!pickerDropdown.classList.contains("open")) return;
    if(pickerDropdown.contains(e.target)) return;
    if(e.target.closest && e.target.closest(".manual-entry-slot")) return;
    closePicker();
  });

  // 使用者最終要求：開獎單完全固定不能被推動，輸入區改成浮在畫面
  // 上的覆蓋層，啟動時螢幕上其他所有功能按鍵都要失效。按「手動
  // 輸入」切換開關：打開時顯示背景遮罩（蓋住整個畫面、擋掉底下
  // 所有按鍵的點擊，不用一顆一顆手動disable）跟浮動的輸入面板；
  // 再按一次（或按裡面的✕取消鍵、或點遮罩空白處）收合回去。
  function openInline(){
    active = true;
    inlineWrap.classList.add("open");
    if(backdrop) backdrop.classList.add("open");
    // 使用者要求：面板要對齊開獎單裡「5 3 9」那種彩券名稱欄位標題
    // （.panel-head）的位置，不是螢幕最上面的分頁列。用JS即時量測
    // .scroller目前實際渲染出來的座標，直接對齊在那裡，比用猜的
    // 固定px數字準確、不管螢幕大小怎麼變都能正確對齊。
    const scrollerEl = document.querySelector(".scroller");
    if(scrollerEl){
      const scrollerTop = scrollerEl.getBoundingClientRect().top;
      inlineWrap.style.top = Math.max(4, scrollerTop) + "px";
    }
    // max屬性設成今天，瀏覽器原生日期選擇器會直接把今天之後的日期
    // 整個disable掉、選不到，符合「不能選未來日期」的要求，不用
    // 自己另外寫驗證邏輯去擋。使用者要求打開時直接預設顯示當天
    // 日期（不用再手動點選一次），大部分手動輸入的情境本來就是
    // 補當天的號碼，預設今天可以省掉一個步驟；如果要輸入的是
    // 別的日期，還是可以點開日期欄位自己改。
    dateInput.max = todayStr();
    dateInput.value = todayStr();
    resetConfirmState();
    renderSlots();
  }
  function closeInline(){
    active = false;
    inlineWrap.classList.remove("open");
    if(backdrop) backdrop.classList.remove("open");
    closePicker();
    hideHint();
  }
  // 使用者明確要求拿掉「點背景遮罩關閉」這個行為——不小心點到輸入
  // 面板以外的地方，不會整個清空取消，只能點裡面的✕鍵才會真的
  // 取消放棄，避免手滑誤觸就把已經選好的日期/號碼弄丟。

  // 使用者要求：「手動輸入」也要連點兩下才能啟動，跟「資料更新」
  // 等App裡其他重要按鍵同一套規則，避免手滑單點誤觸就打開編輯區。
  entryBtn.addEventListener("dblclick", function(){
    if(active) closeInline();
    else openInline();
  });
  if(cancelBtn) cancelBtn.addEventListener("click", closeInline);

  confirmBtn.addEventListener("click", function(){
    const dateStr = dateInput.value;
    if(!dateStr){
      showHint("請先選擇開獎日期");
      return;
    }
    // 保險起見再檢查一次不是未來日期（正常情況下瀏覽器的max屬性
    // 就已經擋掉了，這裡是防止極少數瀏覽器沒有正確支援date的max
    // 限制）。
    if(dateStr > todayStr()){
      showHint("不能選擇未來的日期");
      return;
    }
    const cfg = getSlotConfig();
    if(slotValues.some(function(v){ return v === null; })){
      showHint("還有號碼欄位沒有選");
      return;
    }
    const gameKey = currentGameKey;
    // 使用者要求：如果選的日期資料庫裡已經有資料，代表這次是要
    // 「更正」既有號碼，存入之前要先跳出確認字樣，不能一按就直接
    // 覆蓋掉。第一次按「確認」時，如果偵測到已有資料而且還沒確認
    // 過，就顯示警告文字、把按鍵文字換成「確認更正」的樣式，直接
    // return不存入；使用者看過警告、再按一次（這時候
    // pendingCorrectionConfirm已經是true），才會真的往下執行存入。
    const existing = findExistingRecord(gameKey, dateStr);
    if(existing && !pendingCorrectionConfirm){
      const oldNumbersStr = existing.numbers.map(function(n){ return String(n).padStart(2, "0"); }).join(" ") +
        (typeof existing.special === "number" ? "　特別號 " + String(existing.special).padStart(2, "0") : "");
      showHint("此日期已有資料（原號碼：" + oldNumbersStr + "），再按一次✓才會覆蓋更正");
      pendingCorrectionConfirm = true;
      confirmBtn.textContent = "!";
      return;
    }
    let numbers, special;
    if(cfg.specialIndex >= 0){
      numbers = slotValues.slice(0, cfg.specialIndex);
      special = slotValues[cfg.specialIndex];
    } else {
      numbers = slotValues.slice();
      special = NaN;
    }
    const result = manualUpsertDrawRecord(gameKey, dateStr, numbers, special);
    if(!result.ok){
      showHint(result.reason || "儲存失敗");
      return;
    }
    closeInline();
  });
}

async function runScheduledCloudChecks(){
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowMs = now.getTime();
  const todayStr = now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");
  const cloudGameMap = getCloudGameMap();
  for(const win of SCHEDULE_WINDOWS){
    if(nowMin < win.startMin || nowMin >= win.endMin) continue; // 不在這個時段內
    if(hasScheduleCheckedToday(win.key, win.windowId, todayStr)) continue; // 今天這個「玩法+時段」已經查過了
    const attemptKey = win.key + "_" + win.windowId;
    const lastAttempt = scheduleLastAttemptAt[attemptKey] || 0;
    if(nowMs - lastAttempt < RETRY_INTERVAL_MS) continue; // 距離上次嘗試不到3分鐘，還不用重試
    const g = cloudGameMap.find(function(item){ return item.key === win.key; });
    if(!g) continue;
    scheduleLastAttemptAt[attemptKey] = nowMs;
    const result = await fetchSingleGameCloudLatest(g);
    if(result.ok){
      // 查詢成功（不管有沒有查到更新）：標記今天這個時段已檢查過，
      // 這個時段內不再重複查詢。畫面上完全不顯示任何提示訊息/
      // banner，這是排程的規定；但如果查到有更新，會直接把這筆新
      // 資料加進App裡（見manualUpsertDrawRecord()，改用這個而不是
      // appendNewDrawRecord()，才能正確處理「同一天號碼被雲端校正
      // 過」的情況，不是只能處理全新一期），首頁最新開獎顯示跟
      // 開獎單都會跟著更新，只是不會另外跳出提示文字。
      markScheduleCheckedToday(win.key, win.windowId, todayStr);
      if(result.update){
        const numbers = result.update.numbersRaw.trim().split(/\s+/)
          .map(function(s){ return parseInt(s, 10); }).filter(function(n){ return !isNaN(n); });
        const special = parseInt(result.update.specialRaw, 10);
        manualUpsertDrawRecord(win.key, result.update.cloudDate, numbers, special);
      }
    }
    // result.ok為false（查詢失敗）的情況：不標記已檢查、也不顯示
    // 任何東西，單純等3分鐘後（下一輪符合RETRY_INTERVAL_MS條件的
    // 檢查）自動重試，一樣不會有任何畫面提示。
  }
}
// 每分鐘檢查一次目前時間是否落在排程時段內。這個計時器從App一開啟
// 就開始跑，只要App在前景開著，不管使用者在首頁、抓牌、還是哪個
// 畫面，都會持續運作；App被關掉（分頁關閉、瀏覽器結束）計時器就
// 會跟著停止，符合「純網頁App沒有背景執行能力」這個已知限制。
setInterval(function(){
  runScheduledCloudChecks().catch(function(e){
    console.warn("排程檢查雲端資料失敗（不影響其他功能）：", e);
  });
}, 60000);
</script>
