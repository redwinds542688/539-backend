<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>今彩539</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<style>
  :root{
    --gold:#E8B800;
    --ink:#1a1a1a;
    --ink-dim:#666666;
    --line:#8c8c8c;
    --wd-gray:#c8c8c8;
    --wd-text:#141414;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  /* 使用者要求首頁改回瀏覽器原生縮放（試過App自己的JS縮放，Chrome
     上手感/方向都跟原生打架，遠端沒辦法即時看到實機反應，風險
     越改越高，改回最安全、確保能用的原生縮放）。這裡原本為了讓
     App自己的縮放獨占兩指觸控而加的touch-action:pan-y已經拿掉，
     恢復瀏覽器原生的兩指縮放手勢辨識。 */
  /* 使用者實測回報：往上滑到開獎單最上緣（「539」分頁標題那一列）
     時，畫面會突然「彈回」或「卡住」——這是瀏覽器原生的捲動邊界
     反彈效果（overscroll bounce），捲到頂端/底端還繼續滑的時候，
     瀏覽器會用內建的彈性動畫視覺回饋，感覺像是「卡住、彈回去」。
     原本只有調色盤面板（.palette-float）自己設定過
     overscroll-behavior:contain，首頁本身（html/body）沒有設定，
     這裡補上，讓整個首頁捲動到邊界時直接停住，不會有這種彈跳
     視覺效果。 */
  html,body{ overscroll-behavior-y:contain; }
  html,body,*{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  body{
    background:#e9e9e9;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    /* 原本是寫死的24.7px，使用者要求改成開獎單高度的2%，動態計算
       （見buildPanels()裡的requestAnimationFrame區塊），這裡的
       CSS值只是JS還沒執行前的初始/備用值，實際生效的數字由JS
       接管。 */
    padding-bottom:24.7px;
    overflow-x:hidden;
  }
  #page-zoom-wrap{
    transform-origin:0 0;
    width:max-content;
    min-width:100%;
  }
  /* 使用者要求首頁整個畫面固定往左平移1%（前面試過CSS margin:auto
     置中、JS量測自動置中，實測都沒有達到預期效果，最後改回最單純
     直接的固定比例平移，見centerHomepageWrap()函式），後來又要求
     抓牌畫面也要套用同樣的1%左移——改成不限定body的class，首頁、
     抓牌畫面統一都套用這個平移。transform屬性是JS在管的（抓牌
     畫面兩指縮放用），這裡改用margin，不會跟transform衝突。 */
  #page-zoom-wrap{
    margin-left:-1%;
  }
  /* 使用者回報：全頁模式（pinch-fullscreen-mode）左右留白感覺不
     對稱。原因：上面這條-1%左移是很早之前另一個需求（首頁整體
     往左偏移1%）刻意加的，套用到全頁模式時，會讓左右邊界看起來
     不對稱。這裡只在全頁模式下把這個偏移覆蓋回0，讓左右留白對稱；
     不影響首頁、一般抓牌畫面（沒有進到pinch-fullscreen-mode）
     原本已經確認過的-1%左移效果。 */
  body.pinch-fullscreen-mode #page-zoom-wrap{
    margin-left:0;
  }
  #page-zoom-spacer{
    position:absolute;
    top:0; left:0;
    width:1px; height:1px;
    opacity:0;
    pointer-events:none;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  /* 保持絕對豎屏：曾經改成「全螢幕＋鎖定直向」，但實測在使用者
     手機上鎖定失敗（畫面還是跟著實際方向跑），而且進全螢幕會犧牲
     網址列，失敗了等於白白損失網址列卻沒達到效果。改回最早那版
     單純用CSS偵測橫向的做法：不進全螢幕、保留網址列，橫向時用
     這個黑底遮罩擋住畫面，提示使用者轉回直向，轉回來遮罩自動
     消失，不需要使用者按任何按鍵。 */
  #portrait-lock-overlay{
    display:none;
    position:fixed; inset:0; z-index:99999;
    background:#000; color:#fff;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    font-size:16px; line-height:1.8;
  }
  @media (orientation:landscape){
    /* 暫時停用鎖定豎屏功能——使用者要求先關掉，橫向時不再跳出黑底
       遮罩擋畫面。CSS規則本身還留著（沒有整段刪除），只是註解掉
       實際生效的那條規則，之後如果要恢復，把下面這行的註解符號
       拿掉即可，不用重新寫一次。 */
    /* #portrait-lock-overlay{ display:flex; } */
  }

  /* 使用者要求四個彩券按鍵（.game-tabs，在.brand裡面、是header.top
     唯一的內容）整體上移20%——因為按鍵上方沒有其他文字或元素，
     位置完全是靠header.top的padding-top撐出來的空間，上移20%就
     是把這個padding-top縮小20%（14px×0.8=11.2px），不動
     padding-right/padding-bottom（6px維持不變）。使用者接著說
     「再上移20%」，是疊加在目前的11.2px上面再縮小20%
     （11.2×0.8=8.96px），不是回到原始14px重新算一次20%。後來
     使用者用長按拖曳工具（第一輪）把這個區塊往下拖了約29.89px，
     加進基準值變成38.85px；第二輪重新啟用拖曳工具後，又往下拖了
     約64.18px，加進基準值變成103.03px；第三輪這次往上拖了約
     89.51px（負值，是唯一一次往上調整），103.03-89.51≈13.52px。
     拖曳工具這次也已經完整拿掉。
     使用者後來要求「三區的寬度也要一樣」——原本左右兩側的間距是
     用padding-left/right:14px做的（header.top自己整個外框還是
     滿版寬度，只是內容.brand被padding往內推14px），跟.hero/
     .scroller用margin-left/right:14px（外框本身縮進14px，不是
     內容被推進去）機制不一樣，理論算出來的可視寬度應該一致，
     但為了徹底排除任何潛在的計算誤差、讓三者用完全相同的CSS
     機制，改成header.top左右也用margin（不是padding），跟
     .hero/.scroller的做法完全統一。 */
  /* 使用者回報：放大之後，開獎單的一小部分還是從九宮鍵跟四彩券鍵
     背後的縫隙透出來。原因：header.top自己是用margin:0 14px（不是
     padding）做左右間距，margin是「外框本身縮進去」，不是「內容
     被推進去」，所以header.top自己的背景色只會蓋住中間扣掉左右
     14px之後的範圍，兩側各留了14px寬的縫隙沒有背景覆蓋，底下的
     開獎單才會從這兩條縫隙透出來。不能直接拿掉這個margin改用
     padding（header.top左右間距要用跟.hero/.scroller完全一致的
     margin機制，是使用者先前明確要求的，見上面那段說明），改成
     另外包一層「外層滿版背景包裹層」（#header-top-bg-wrap）：
     這個外層本身沒有margin、真正滿版整個螢幕寬度，負責蓋住兩側
     縫隙；header.top維持原本的margin邏輯放在這個外層裡面，不受
     影響，寬度對齊機制完全不變。 */
  #header-top-bg-wrap{
    position:fixed;
    top:0; left:0; right:0;
    z-index:900;
    background:#e9e9e9;
    display:none;
  }
  body.magnifier-mode #header-top-bg-wrap{
    display:block;
  }
  /* 跟下面#hint-bar-bg-wrap同樣的道理，這裡也加上「定期十六」的
     排除規則以防萬一——header.top本身在「定期十六」裡已經是
     display:none，這個外層背景包裹層理論上會自然跟著收縮成0
     高度，但保險起見還是明確排除，避免任何潛在的殘留空白。 */
  body.magnifier-mode.recent-only-mode #header-top-bg-wrap{
    display:none;
  }
  body.magnifier-mode #header-top-bg-wrap header.top{
    position:static;
  }
  header.top{ padding:13.52px 0 6px; margin:0 14px 0; }
  /* 使用者曾經要求「整個首頁往下移10%」，加了10vh的margin-top，
     但實測發現最上面出現一大塊空白（螢幕高度10%的空白區域），
     使用者看到實際效果後改口要求拿掉，讓首頁畫面回到緊貼螢幕
     頂端的樣子——這條規則已經移除，不是保留停用。 */
  .brand{ display:flex; align-items:baseline; justify-content:space-between; }
  .brand h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:0.5px; color:var(--gold);}
  /* 4個按鍵（539／六合彩／天天樂／大樂透）同一排、大小一樣、平均
     分配寬度：每個按鍵 flex:1 平分整排寬度，不管文字長短，寬度
     都相等；文字太長時用 ellipsis 省略號收尾，避免擠爆換行。 */
  .game-tabs{ display:flex; gap:5px; width:100%; }
  /* 使用者要求：文字改白色、按鍵高度放大100%（原本上下padding 7px
     改成14px，加倍），但不能影響下面兩個區塊（最新開獎/開獎單）
     的位置、數值、大小——這條CSS規則只作用在.game-tabs button
     這個選擇器範圍內，不會牽動任何其他區塊的樣式，下面兩個區塊
     完全沒有改動任何CSS。按鍵變高之後，因為是正常的文件流排版
     （不是絕對定位），下面的內容在畫面上的視覺位置勢必會跟著往
     下移一點（這是HTML/CSS正常排版的物理結果，沒有辦法讓上面
     的東西變高、下面的東西卻完全不動），但兩個區塊「本身」的
     大小、內部數值、內部排版結構完全沒有被這次改動觸碰到。
     文字顏色（白色）只套用在「未選取」狀態的按鍵上，下面
     .game-tabs button.active 那條「選取中」的規則（金底黑字）
     沒有跟著改成白字——金色底配白字對比度不好、不容易看清楚，
     維持原本的黑字比較好讀，這點沒有使用者明確要求要一起改，
     先保守處理，如果要選取中的按鍵也改白字，需要使用者再確認。 */
  .game-tabs button{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:3px;
    background:#111; border:1.5px solid var(--gold); color:#fff;
    border-radius:8px; padding:14px 4px;
    /* 使用者要求：在按鍵目前的範圍內把字體放到最大——按鍵寬度是
       螢幕寬度平均分給4顆（扣掉gap），用vw依螢幕寬度比例縮放，
       同時設一個上限（22px），確保螢幕夠寬的時候字體不會無限
       放大到超出按鍵本身的寬度，被overflow:hidden／text-overflow:
       ellipsis裁掉。這個上限、比例是抓四個按鍵裡最長的文字內容
       （「六合彩」「天天樂」「大樂透」都是3個字，跟「539」3位數
       字長度相近）抓出來的，四顆按鍵字體大小統一，不會有的放大
       有的沒放大、看起來不一致。 */
    font-size:min(5.5vw, 22px); font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    -webkit-tap-highlight-color:transparent;
  }
  .game-tabs button.active{ background:var(--gold); color:#000; }
  /* 「更新」按鍵拿掉圖示之後，改用淡入淡出的閃爍效果代替原本的圖示
     旋轉動畫，讓使用者還是看得出「正在更新中」。 */
  .game-tabs button.spinning{ animation:pulseFade 0.6s ease-in-out infinite; }
  @keyframes pulseFade{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }
  .coming-soon{
    margin:12px 14px; padding:40px 16px; text-align:center;
    background:#ffffff; border:1.2px solid #000; border-radius:4px;
    color:var(--ink-dim); font-size:13px; line-height:1.8;
  }
  .coming-soon strong{ display:block; font-size:16px; color:var(--ink); margin-bottom:6px; }
  .brand span.tag{
    font-size:10px; color:#000; background:var(--gold); font-weight:700;
    padding:2px 7px; border-radius:4px; letter-spacing:0.5px; white-space:nowrap;
  }
  .sub{ font-size:11px; color:var(--ink-dim); margin-top:4px; line-height:1.5; }

  /* 使用者要求「最新開獎」這整個區塊（.hero）整體上移40%——這裡
     動的是margin-top（區塊外側、上方的留白間距，12px×0.6=7.2px，
     縮小40%），不是border/padding/內部排版這些決定外框大小本身
     的屬性，所以不算違反上面「外框大小鎖定」的規則：外框（含
     border、padding、內部三排控制列）的實際尺寸完全沒有改變，
     只是這個區塊在頁面上的垂直位置往上移了，跟前面「四個彩券
     按鍵」上移用的是同一種手法（margin/padding縮小），不是縮放
     或改變框本身的大小。使用者接著要求「再上移40%」，是疊加在
     目前的7.2px上面再縮小40%（7.2×0.6=4.32px），不是回到原始
     12px重新算一次40%，沿用這份文件裡「再」代表疊加、不是取代
     的既有慣例。後來使用者用長按拖曳工具（第一輪）把這個區塊
     往下拖了約18.15px，加進基準值變成22.47px；第二輪重新啟用
     拖曳工具後，又往下拖了約37.15px，加進基準值變成59.62px；
     第三輪這次往上拖了約156.23px（負值），59.62-156.23≈
     -96.61px——**margin-top變成負值**，使用者確認要的效果就是
     把這個區塊整個拖到畫面看不到的地方（配合頂部按鍵列也往上
     拖，只留開獎單貼齊螢幕最上緣），CSS margin-top支援負值，
     負值會讓元素往上超出原本的文件流位置，達到「整個區塊移出
     視野」的效果，這是預期內、故意如此的設定，不是意外的錯誤
     數值。拖曳工具這次也已經完整拿掉。 */
  /* 使用者要求三個區塊（頂部按鍵列/最新開獎/開獎單）完全連到一起、
     中間零間距——這是第四輪拖曳相關調整，這次直接明確指定margin
     為0，不是用拖曳工具量出來的。margin-top從-96.61px改成0，
     取代第三輪「刻意讓這個區塊移出視野」的負值設定。演變歷程
     （第一輪+18.15px→22.47px、第二輪+37.15px→59.62px、第三輪
     -156.23px→-96.61px，這次直接歸零）保留在這裡當作歷史紀錄。 */
  .hero{
    margin:0 14px 0; background:#ffffff; border:2px solid #000; border-radius:4px;
    padding:10px 12px;
    display:flex; flex-direction:column; gap:10px;
  }
  .hero-label{ font-size:10px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; }
  /* ⚠️ 這個外框（.hero）大小是鎖定的，使用者明確訂過、也強調過
     很多次的規則：裡面任何字體/按鍵/排版的調整，都不能讓外框的
     大小跟著變動。**2026-08-11 使用者提供了一張新的參考截圖，
     要求整個版面改成「日期+球在上，印/調整期數/抓牌三個放大的
     方塊同一列並排在下」，這是全新的版面設計（不是延續舊版的
     左右並排），所以這次重新建立的鎖定基準，就是「這個新版面
     實際渲染出來的自然高度」，不是沿用舊版側排時期的高度。**
     之後任何要再調整這個區塊內部字體/按鍵/排版的請求，都要先
     確保這個新的高度基準不會被悄悄撐大——如果做不到「內容變動
     但外框不變」，要先明確跟使用者說清楚、問過才能繼續，不能
     自己決定放棄鎖定、也不能只寫在文件裡卻不在回覆裡講清楚。 */
  .hero-left{ min-width:0; }
  /* 使用者要求：日期維持在左邊，右邊加一顆「資料更新」按鍵，顏色
     比照「抓」的設定（黑底綠框白字）。用justify-content:
     space-between把日期跟按鍵推到兩端，align-items改成center
     （原本是baseline，日期是純文字用baseline對齊沒問題，但現在
     多了一個有padding/border的按鍵，center能讓按鍵跟日期文字
     視覺上對齊得更好）。 */
  .hero-date-row{ display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between; gap:6px; }
  .hero-date{ font-size:13px; font-weight:600; margin-top:2px; display:inline-block; }
  /* 「資料更新」鍵：手動觸發跟App開啟時同一套雲端檢查邏輯
     （checkCloudUpdates()），查到有更新會跳出首頁既有的黃底提示
     banner，不會自動合併資料進App裡（維持「只檢查、不合併」的
     既有政策，除非是排程檢查在指定時段內找到剛好新一期資料才會
     自動合併，見「首頁初始.md」第五之三節）。配色比照「抓」
     （.catch-card-btn，黑底綠框白字），但尺寸縮小很多，只是
     擠在日期旁邊的小按鍵，不是跟印/抓/調整期數同等級的大按鍵。 */
  .data-update-btn{
    background:#000; border:1.5px solid #33D17A; color:#fff;
    border-radius:6px; font-size:10px; font-weight:700; line-height:1.2;
    padding:3px 8px; white-space:nowrap; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .data-update-btn:disabled{ opacity:0.5; }
  /* 「印」「調整期數(-21+)」「抓」三個方塊，比照使用者提供的參考
     截圖統一放大、同一列並排在日期+球下方。文字精簡成單一個字
     （「印」「抓」，不是「印單」「抓牌」兩個字），字體加大到跟
     截圖裡的視覺份量接近。三個方塊用flex比例分配整排寬度：印
     flex:1、調整期數flex:2（內容比較多，多分配一點寬度）、抓
     flex:1。 */
  .hero-controls-row{
    display:flex; gap:8px; align-items:stretch;
  }

  /* 使用者要求：最新開獎號碼球的基礎樣式（539使用，其他玩法會被

     官方紅/藍/綠三色分類（見下面已經不再使用的
     .ball-red/.ball-blue/.ball-green），後來使用者要求改成所有
     玩法統一固定配色，這條規則直接取代了原本「外圈標記」的做法

  .ball.ball-special{

  body.game-mark6 .ball:not(.ball-special){

  /* 使用者要求三個區塊完全連到一起、中間零間距（第四輪），

  .scroller{

  table.road{ border-collapse:collapse; background:#ffffff; table-layout:fixed; }
  table.road td{
    border-right:1px solid #bbb;
    border-bottom:1px solid #bbb;
    font-size:11px; line-height:1; text-align:left; vertical-align:middle; color:#000;

  table.road td.day{

  }
  table.road tr.future td.day{ color:#aaa; }
  /* 這條粗橫格線，六合彩／大樂透跟539／天天樂，代表的意義不一樣：
     六合彩／大樂透是「月份分隔線」（每個月最後一天跟下個月1號
     中間），539／天天樂是「星期分隔線」（每個星期日跟星期一中間，
     使用者要求把539／天天樂原本的月份分隔線取消，改成這個），
     共用同一個 .month-start class／同一條CSS規則，只是JS加上這個
     class的判斷條件不同（見buildPanels()裡的列產生迴圈）。

     border-collapse:collapse（相鄰格子的框線會合併成一條），跟
     另一條「首頁隱藏標記」的規則（body:not(.magnifier-mode)
     table.road td.num.num-marked，用border-top:none蓋掉標記格子
     的框線）算出來的CSS優先權剛好一樣，被標記過的格子粗線會被
     蓋掉，試過幾種補強寫法都沒有徹底解決。改成用 box-shadow 畫
     這條線——這是完全不同的CSS屬性，不會被border-collapse合併
     機制影響，也不會被任何設定border-top的規則覆蓋（屬性完全

  table.road tr.month-start td{

  table.road td.wd{ width:11.89px; min-width:11.89px; max-width:11.89px; padding:1px; text-align:center; background:#e2e2e2; }
  table.road td.wd .badge{

  table.road tr.future td.wd .badge{ opacity:0.4; }
  /* 目前這套日期／星期／號碼文字位移＋放大效果，是目前設定好的初始
     基準值——之後如果還要再調整，都是從這個基準繼續疊加/修改。 */
  .cell-shift{ display:inline-block; transform:translate(-10%, -10%); }
  table.road td.num .cell-shift{ transform:translate(0%, 10%); }
  table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(0%, 10%); }

  body.recent-only-mode .cell-shift{ transform:translate(-10%, -10%) scale(1.3); }
  body.recent-only-mode table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(-10%, 15%) scale(1.3); }
  body.recent-only-mode table.road td.num .cell-shift{ transform:translate(0%, 10%) scale(1.3); }
  body.recent-only-mode table.road td.wd .badge.mon{ transform:translate(0%, 10%) scale(1.3); }
  body.recent-only-mode table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(0%, 0%) scale(1.3); }
  body.recent-only-mode table.road td.day.first-of-month .fom{ transform:translate(10%, 15%) scale(0.48) scale(1.3); }
  /* 「開獎號碼字體改成等距字型＋放大到15px」這項調整只針對首頁

  /* 使用者要求：進入「定期十六」時，所有開獎號碼縮小20%——這是

  body.recent-only-mode table.road td.num{

  }
  /* 截圖時：雖然只取消了 .panels 本身的縮放，body 上的 recent-only-mode
     這個 class 還在，上面那幾條「定期模式專用」的位移規則優先權比較
     高，還是會生效、蓋掉一般（全域）的位移設定，導致截圖看起來跟
     調整前一樣。這裡用更高優先權的規則，在截圖當下強制蓋回一般
     （全域）的位移設定，確保截圖跟畫面上調整的效果一致。 */
  body.recent-only-mode.capturing-plain .cell-shift{ transform:translate(-10%, -10%); }
  body.recent-only-mode.capturing-plain table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(-20%, -37%); }
  body.recent-only-mode.capturing-plain table.road td.num .cell-shift{ transform:translate(-20%, -35%); }
  body.recent-only-mode.capturing-plain table.road td.wd.mon-cell .badge.mon{ transform:translate(-15%, -14%); }
  body.recent-only-mode.capturing-plain table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(-15%, -20%); }
  /* 使用者要求：「定期十六」存檔擷取前，開獎號碼的字體縮小20%
     再顯示、再截圖——只影響存出來的圖片，不影響畫面上平常瀏覽時

  body.capturing-plain table.road td.num{ font-size:8.168px; }
  body.recent-only-mode.capturing-plain table.road td.day.first-of-month .fom{ transform:translate(5%, -23%) scale(0.48); }

          capturing-plain 規則，完全獨立，見上方）
     目前數值刻意設成跟即時畫面基準值一模一樣（=沒有任何位移），
     之後如果要微調存檔圖的日期/星期/號碼位置或大小，只需要改這個
     區塊裡的數字即可，改了不會牽動其他任何畫面。
     ============================================================ */
  body.capturing-save-only .cell-shift{ transform:translate(-10%, -10%); }
  body.capturing-save-only table.road td.num .cell-shift{ transform:translate(0%, 10%); }
  body.capturing-save-only table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(0%, 10%); }
  body.capturing-save-only table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(-5%, 0%); }
  body.capturing-save-only table.road td.wd.mon-cell .badge.mon{ transform:translate(-5%, 10%); }
  body.capturing-save-only table.road td.day.first-of-month .fom{ transform:translate(5%, 10%) scale(0.432); } /* 0.48 再縮小10% */
  body.capturing-save-only table.road td.num{ font-size:10.71px; } /* 基準 12.6px 縮小15% */
  /* 最上方4個「539」標題（每個區塊的 panel-head），存檔圖片裡文字
     往上微調。原本上下各留白6px，累計調整：20%→30%→這次再+20%，
     三次都是相對原始6px基準，累計70%＝4.2px：上留白 6-4.2=1.8px、
     下留白 6+4.2=10.2px，中線繼續往上移，底色區塊本身大小、位置
     不變。 */
  body.capturing-save-only .panel-head{ padding:1.8px 0 10.2px; }
  /* 一、資料寬度與右邊框對齊：作廢，不修改，維持沒有拉伸的原始寬度。 */
  /* 外框（.scroller 的邊框）本身不變，只把邊框裡面的資料整個往下
     拉長1%。transform-origin 固定在頂部，頂部完全不動，只有下面
     的內容往下多拉一點。transform 只是視覺效果，不會撐開外框本身
     的框線，所以邊框大小不受影響，符合「邊框不變」的要求。 */
  body.capturing-save-only .panels{ transform:scaleY(1.01); transform-origin:top left; }
  /* html2canvas 自己畫文字不可靠（在部分手機瀏覽器上會整段消失或
     變形），一般「存檔」鍵的日期／星期／號碼現在改成 JS 用 Canvas 2D
     fillText 手動補畫（見 saveAsImage() 裡的 drawCellTextOntoCanvas）。
     這裡在擷取當下把原本的文字顏色變透明，只留框線／色塊給
     html2canvas 畫，避免它自己嘗試畫文字失敗、破圖的殘影疊在我們
     手動畫的正確文字下面。擷取一結束這個 class 就會被移除，不影響
     畫面上其他任何顯示。
     —— 這條規則刻意只寫 capturing-save-only、不含 capturing-plain：
     「定期」的截圖必須維持「定期初始.md」記錄的原始行為（html2canvas
     自己畫文字），不能被一般存檔鍵這邊之後的任何調整牽動。 */
  body.capturing-save-only .cell-shift{ color:transparent !important; }
  /* 指定號碼（num-marked）的框色是用 CSS outline 畫的，html2canvas
     對 outline（尤其是負值 outline-offset）支援不穩定，實測會整個
     漏畫，存出來/截出來的圖只剩底色、沒有框色。這個問題「定期」的
     截圖跟一般存檔都會發生，所以這條隱藏規則兩邊都套用；改由 JS
     用 Canvas 2D 手動補畫（見 saveAsImage() 裡的
     drawMarkedFramesOntoCanvas）。注意：只有這個框色是兩邊共用同一套
     手動補畫，日期／星期／號碼文字的部分，「定期」依然維持
     「定期初始.md」記錄的原始行為（純交給 html2canvas 畫），沒有被
     這個修正牽動。 */
  body.capturing-plain table.road td.num.num-marked,
  body.capturing-save-only table.road td.num.num-marked{ outline:none !important; }
  /* 使用者截圖回報：「定期十六」存出來的圖，第一招（圓形標記）的
     號碼呈現破圖、扭曲、疊在一起，跟畫面上實際看到的（清楚的圓形）
     完全不一樣。原因：第一招的圓形是用「絕對定位偽元素＋
     transform:translate(-50%,-50%)置中」畫的（見上面.num-marked-
     click::before），這個偽元素本身的transform，疊加在「定期」
     模式.panels極端、非等比例的transform:scale(4.558, 3.9)裡面
     （x/y縮放比例還不一樣），html2canvas的渲染引擎在這種「transform
     疊transform」又是非等比例縮放的情況下精準度不夠，畫出來的圓形
     位置/大小算錯，才會變成使用者看到的破圖。修法比照上面outline
     的做法：只在「定期」的截圖（capturing-plain）情境下，把原生
     的圓形偽元素隱藏掉，改由JS用Canvas 2D手動補畫（見saveAsImage()
     裡新增的drawCircleMarksOntoCanvas）——這裡故意不動一般存檔
     （capturing-save-only），因為一般存檔沒有這個問題（沒有「定期」
     那種極端非等比例縮放），維持原本已經正常運作的行為不去牽動它。 */
  body.capturing-plain table.road td.num.num-marked.num-marked-click::before{
    background:transparent !important;
    border:none !important;
  }
  /* 存檔（不管是「儲存圖檔」／抓牌浮動存檔鍵的 saveAsImage()，
     還是首頁「開獎單」鍵的 saveCleanSheetImage()，兩者都會加上
     capturing-save-only 這個class）的時候，三種線（開獎單外框、
     月份分隔線、區塊分隔線）都縮小成正常顯示的60%（1.5px×0.6＝
     0.9px）——只有存出來的圖片變細，畫面上平常看到的還是1.5px，
     不受影響。因為兩個存檔函式共用同一個class，這裡只要寫一次，
     兩邊都會生效，不用分開處理。 */
  body.capturing-save-only .scroller{ border-width:0.9px; }
  body.capturing-save-only .panel{ border-right-width:0.54px; }
  body.capturing-save-only table.road tr.month-start td{ box-shadow: inset 0 1.5px 0 0 #000 !important; }
  /* 使用者截圖回報：「定期十六」存出來的圖，星期一（.month-start
     那一列，見上面說明——539/天天樂實際上是星期分隔線）左邊出現
     不正常的黑色陰影。原因跟前面圓形標記破圖是同一類問題：這條
     分隔線是用box-shadow畫的，html2canvas對box-shadow在「定期」
     極端非等比例縮放下算不準，才會變成看起來像陰影的黑色色塊。
     修法一樣：只在「定期」的截圖情境下把原生box-shadow隱藏掉，
     改由JS用Canvas 2D手動補畫（見saveAsImage()裡新增的
     drawWeekStartLinesOntoCanvas）；一般存檔不受影響，維持原本
     box-shadow正常運作（沒有這個問題）。 */
  body.capturing-plain table.road tr.month-start td{ box-shadow:none !important; }
  /* 「開獎單」鍵專用：存出來的圖不能出現任何一~四招的標記結果。
     這個 class 會跟 capturing-save-only 一起加上，共用它那組留白/
     字體/位置的微調，但額外把「指定號碼」（一二招）的底色/框色/
     邊框都蓋掉、恢復成一般格子的樣子（文字本身還是會手動畫出來，
     因為那是真實的歷史開獎數字，只是不再特別標記）；「第四招」
     填的號碼（num-picked）則是連文字都不會畫（見 JS
     saveCleanSheetImage() 蒐集 textJobs 時直接跳過），視覺上恢復
     成空白格。連接線（第三招）本來就是獨立蓋在畫面上的一層，不在
     html2canvas 擷取的範圍內，這裡不用特別處理就不會出現。 */
  body.capturing-clean-sheet table.road td.num.num-marked{
    background:transparent !important;
    border-top:none !important; border-left:none !important;
    border-right:1px solid #bbb !important; border-bottom:1px solid #bbb !important;
  }
  /* 第一招改成用偽元素畫圓形之後，「開獎單」清空存檔也要連這個
     偽元素一起蓋掉，不然圓形色塊還是會被存進去。 */
  body.capturing-clean-sheet table.road td.num.num-marked::before{
    display:none !important;
  }
  body.capturing-clean-sheet table.road td.num.num-picked{
    background:transparent !important;
  }
  /* 「定期」啟動前，先暫時把文字位移效果關掉、回到還沒調整上移左移
     之前的樣子，等回歸初始畫面之後，再恢復位移效果、繼續套用定期。 */
  body.no-cell-shift .cell-shift{ transform:none; }
  body.no-cell-shift table.road td.wd .badge.mon{ transform:none; }
  body.no-cell-shift table.road td.day.first-of-month .fom{ transform:scale(0.48); }
  /* 使用者要求：所有開獎單的號碼縮小10%——這是基礎字體大小，
     影響一般抓牌放大鏡畫面所有玩法（539/天天樂/六合彩/大樂透）
     顯示的號碼字體，原本15px，縮小10%後是15×0.9＝13.5px。 */
  table.road td.num{
    width:28.12px; min-width:28.12px; max-width:28.12px; font-weight:700;
    font-family:"Roboto Mono","DejaVu Sans Mono","Courier New",monospace;
    font-size:13.5px; color:#000; font-variant-numeric:tabular-nums;
    text-align:center; padding:0;
  }
  /* 六合彩／大樂透是7欄號碼（6號碼+特別號），不是5欄，用同樣的
     總寬度（5×28.12≈140.6px）平分成7欄，每欄縮窄成20.09px，不然
     7欄乘上跟539一樣的28.12px會撐出一張寬很多的表格。特別號那欄
     額外用金色系底色跟一般號碼區隔。 */
  body.game-wide table.road td.num{
    width:20.09px; min-width:20.09px; max-width:20.09px;
  }
  table.road td.num.special{ background:#fff8e0; }
  table.road td.num.special.pending{ background:transparent; }
  table.road td.num.pending{ color:#ccc; background:transparent; font-weight:400; }
  table.road td.num.num-picked{ background:#fff !important; color:var(--mark-predict-color, #FF3B3B) !important; font-weight:700; position:relative; }
  /* 第四招同一個號碼在後面的空白格重複出現時，那些比較晚的格子不
     顯示號碼（維持空白樣子），改在「最早出現」那一格的號碼右上方
     疊一個小小的累加數字，用絕對定位疊在td上，不佔版面空間、不會
     撐開格子。字體大小是數字本身的一半（0.5em），比原本設計的1/8
     大小（0.125em）明顯太小、幾乎看不清楚，改大一點。顏色固定用
     紅色，不跟著調色盤的預測色變數走（不管使用者怎麼調色盤，這個
     累加數字永遠是紅色）。 */
  table.road td.num.num-picked .pick-dup-badge{
    position:absolute;
    top:0; right:1px;
    font-size:0.5em;
    line-height:1;
    font-weight:700;
    font-family:Arial, Helvetica, sans-serif;
    color:#FF3B3B !important;
    pointer-events:none;
    z-index:2;
  }
  table.road tr.highlight td.num{ background:#fff2b0; color:#000; }

  footer.legend{
    margin:16px 14px 8px; font-size:10.5px; color:var(--ink-dim);
    display:flex; flex-wrap:wrap; gap:6px 10px;
  }
  footer.legend .lg{ display:flex; align-items:center; gap:4px; }
  footer.legend .dot{ width:9px; height:9px; border-radius:2px; background:var(--wd-gray); }
  footer.legend .dot.mon{ box-shadow:0 0 0 1.5px #FF2020; }

  .banner-note{
    margin:12px 14px 0; padding:8px 12px; border-radius:8px;
    background:#1a1600; border:1px solid #4a3f00; font-size:11px; color:var(--gold); line-height:1.6;
  }

  .img-overlay{
    position:fixed; inset:0; background:transparent; z-index:999;
    display:none; flex-direction:column;
    pointer-events:none;
  }
  /* 使用者回報：九宮鍵框（.hint-bar，白色圓角卡片）左右兩側跟螢幕
     邊緣之間，還是可以看到開獎單透出來。原因：.img-hint是用JS
     直接複製.hero的left/width（見applyImgHintBarConnect()），
     而.hero本身有margin:0 14px，量出來的left本來就不是0（是14px
     起跳），.img-hint卡片左右兩側跟螢幕邊緣之間那段區域，天生就
     沒有任何背景覆蓋，才會透出底下的開獎單。修法比照header.top
     那次的做法：另外加一個「滿版背景包裹層」（#hint-bar-bg-wrap），
     真正從螢幕左緣到右緣、跟.img-hint同樣的上下範圍，鋪一層跟
     頁面一致的背景色，蓋住卡片外側的空隙；.img-hint這張卡片本身
     的圓角/邊框樣式完全不受影響，維持原本「卡片」的視覺效果，
     只是外側多了背景鋪底、不會透出開獎單。z-index比.img-hint低，
     確保卡片本身還是疊在最上面。位置/高度由JS在
     applyImgHintBarConnect()裡跟.img-hint一起同步設定。 */
  #hint-bar-bg-wrap{
    position:fixed;
    left:0; right:0;
    background:#e9e9e9;
    z-index:998;
    display:none;
  }
  body.magnifier-mode #hint-bar-bg-wrap{
    display:block;
  }
  /* 使用者回報：「定期十六」畫面中間出現一塊空白，找出來是這塊
     九宮鍵背景鋪底層（#hint-bar-bg-wrap）——它只判斷body有沒有
     magnifier-mode這個class就顯示，沒有排除「定期十六」
     （recent-only-mode）的情況。實際的九宮鍵內容（.img-hint）
     在「定期十六」裡有被正確隱藏（見applyFullDisplay()），但
     magnifier-mode這個class在「定期十六」期間還是繼續存在的
     （兩者同時生效，不是互斥），所以這塊背景鋪底層依然顯示著，
     只是底下該顯示的九宮鍵內容不見了，才會看起來像一塊莫名其妙
     的空白色塊。這裡用選擇器特異度更高的規則，只要body同時有
     recent-only-mode，就強制隱藏這塊背景層。 */
  body.magnifier-mode.recent-only-mode #hint-bar-bg-wrap{
    display:none;
  }
  /* 使用者要求：在抓牌系統裡，只要有兩指縮放的動作，馬上進入「全頁」
     模式——四顆彩券按鍵、九宮鍵工具列全部隱藏，只留開獎單本身跟
     左上角一顆✕鍵，連點兩下✕鍵立刻恢復成「像剛從首頁進入抓牌
     系統」的初始畫面（縮放回1倍、捲動回最頂端、UI全部恢復顯示）。
     這裡只處理「隱藏原本UI／顯示✕鍵」這個視覺切換，實際觸發
     pinch-fullscreen-mode這個class、以及✕鍵點兩下的還原邏輯，
     都在JS裡（見touchmove的pinch handler、pinch-fullscreen-close-btn
     的dblclick handler）。 */
  #pinch-fullscreen-close-btn{
    display:none;
    position:fixed;
    top:10px; left:10px;
    z-index:1200;
    width:36px; height:36px;
    border-radius:50%;
    background:#8a8a8a; color:#fff;
    border:1.5px solid #33D17A;
    font-size:18px; line-height:1;
    align-items:center; justify-content:center;
  }
  body.pinch-fullscreen-mode #pinch-fullscreen-close-btn{
    display:flex;
  }
  body.pinch-fullscreen-mode #header-top-bg-wrap,
  body.pinch-fullscreen-mode #hint-bar-bg-wrap,
  body.pinch-fullscreen-mode .img-overlay .img-game-tabs,
  body.pinch-fullscreen-mode .img-overlay .hint-bar{
    display:none !important;
  }
  /* 使用者回報：全頁模式裡開獎單上方還是有一大塊空白。真正原因：
     .hero平常是用visibility:hidden隱藏（見下面body.magnifier-mode
     .hero那條規則），visibility:hidden雖然「看不見」，但還是會
     保留原本的版面空間（跟display:none不一樣，display:none才是
     真正把空間收回去）。平常這塊「隱形但還占位置」的空間，剛好
     被固定在頂端的header.top/九宮鍵擋住看不出來，但全頁模式這些
     按鍵/工具列全部被隱藏了（見上面那組規則），這塊空間才會變成
     明顯的空白。這裡在全頁模式下，把.hero改成display:none，
     真正收回這塊空間，開獎單才會直接從最頂端開始顯示。 */
  body.pinch-fullscreen-mode .hero{
    display:none !important;
  }
  .img-overlay.open{ display:flex; }
  .img-overlay .bar,
  .img-overlay-title,
  .img-overlay .hint-bar,
  .img-overlay .draw-toolbar,
  .img-overlay .palette-float,
  .pin-btn{
    pointer-events:auto;
  }
  .img-overlay-title,
  .img-overlay .hint-bar{
    background:#e9e9e9;
  }
  /* 九宮鍵區現在整個搬進 .hint-bar 這個框裡面了（DOM結構也跟著調整，
     見HTML），不再需要自己另外的灰底/padding-bottom——外層.hint-bar
     的白底、padding已經處理好了，這裡如果保留會疊出雙重間距、雙重
     底色，跟外框對不齊。 */
  .img-overlay .draw-toolbar{
    background:transparent;
  }
  /* 放大鏡模式：首頁上除了開獎單以外的東西（更新、放大鏡圖示、
     最新開獎資訊、期數調整）全部隱藏，開獎單本身完全不動、不重繪，
     直接沿用首頁那一份。使用者要求header.top（裡面就是四顆彩券
     名稱按鍵）不要跟著隱藏，進入抓牌畫面時維持正常顯示，所以這裡
     從隱藏清單裡拿掉header.top，只留.hero跟#demo-banner繼續隱藏。 */
  body.magnifier-mode .hero,
  body.magnifier-mode #demo-banner{
    visibility:hidden;
  }
  /* header.top本身的固定定位/背景色，改由外層#header-top-bg-wrap
     負責（見上面該規則的完整說明——解決兩側縫隙透出開獎單的問題），
     這裡不再需要重複設定。header.top改成position:fixed（不管是
     直接設定在它自己身上，還是透過外層包裹）之後，都會脫離原本的
     版面流，導致它原本佔的空間消失、後面的內容（開獎單本身）往上
     貼齊，被固定在頂端的按鍵蓋住。這裡幫#page-zoom-wrap補上等同
     header.top高度的上方留白，讓開獎單內容往下讓出這塊空間，不會
     被蓋住。數值用header.top實際的padding(13.52px+6px)加上按鍵
     本身的高度估算，抓一個安全值。 */
  body.magnifier-mode #page-zoom-wrap{
    padding-top:80px;
  }
  /* 使用者回報：全頁模式（body.pinch-fullscreen-mode）裡，開獎單
     上方多了一大塊空白，跟X鍵之間有明顯間隔——原因是上面那條
     padding-top:80px是為了「幫固定在頂端的四顆按鍵/九宮鍵留出
     空間，避免被蓋住」而加的，但全頁模式裡這些按鍵/工具列全部

     螢幕最頂端開始顯示，緊貼著X鍵，不留空白。選擇器特異度

     只有一個class的規則高，會正確覆蓋過去。 */

  /* 使用者回報：「定期十六」畫面上方也出現了一大塊空白，原因是
     上面body.magnifier-mode那條80px的上方留白規則，沒有排除
     「定期十六」（body.recent-only-mode）的情況——定期十六本身的
     header.top／九宮鍵工具列本來就是整個用display:none隱藏（見
     下面那組規則），沒有固定在頂端的浮動按鍵需要留空間避開，這塊
     80px的留白對定期十六來說完全是多餘的。這裡加一條選擇器特異度
     更高的規則（兩個class），只要body同時有recent-only-mode，就
     強制把padding-top蓋回0，不管當下magnifier-mode/pinch-

  body.recent-only-mode #page-zoom-wrap{

  /* 「定期」模式是專門的精簡結果畫面，不需要保留首頁頭部/最新開獎

     結果往上貼齊，不會留一大截空白在最上面。 */
  body.recent-only-mode header.top,
  body.recent-only-mode .hero,
  body.recent-only-mode #demo-banner{
    display:none;
  }
  /* 使用者要求抓牌系統的開獎單顯示要直接套用首頁的開獎單顯示資料，
     取消上一輪「用opacity:0隱藏開獎單」的設定，改回正常顯示——
     開獎單的實際樣式（zoom:0.59等）由showFullPageImage()裡強制
     套用跟首頁一致的設定負責，這裡不需要額外的CSS規則。 */
  /* 使用者要求「定期」模式下，16期開獎號碼＋5期空白期＋外面的表格
     （合稱「16方塊區」）整個用紅色框起來。.scroller本身的寬高在
     JS（applyRecentOnly()）裡已經精準計算過、補償transform:scale()
     縮放後的實際視覺大小，這裡直接把外框顏色改成紅色即可，不需要
     額外疊加元素——外框本來就已經正確貼齊縮放後的整個16方塊區。 */
  body.recent-only-mode .scroller{ margin-left:0; overflow:visible; border-color:#e02020; }
  /* 使用者要求：「定期十六」存出來的截圖，不要有那圈紅色外框——
     但只有存檔擷取當下要拿掉，平常畫面上瀏覽的時候紅框要繼續維持
     （紅框是特意用來幫使用者一眼看出「16方塊區」邊界的），不能
     兩邊都受影響。這裡用比上面那條規則多一個class（.capturing-
     plain）的選擇器，特異度更高，天然覆蓋掉上面的紅色，只在
     body同時有recent-only-mode跟capturing-plain（也就是html2canvas
     正在擷取畫面的當下）這兩個class時才生效，把顏色改回一般存檔
     沒有定期模式時的黑色（跟.scroller基本CSS裡border:1.5px solid
     #000一致）。擷取結束、capturing-plain這個class被移除之後，
     畫面上就會自動變回紅框，不影響使用者接下來繼續瀏覽。 */
  body.recent-only-mode.capturing-plain .scroller{ border-color:#000; }
  body.recent-only-mode .panel-head{ display:none; }
  /* 使用者要求「16方塊區」（含內容本身）高度不變、寬度向右延伸6%
     ——不是只把外框線拉寬、內容維持原大小留一片空白，是連裡面的
     開獎單內容一起變寬。水平縮放倍率從4.3放大6%（4.3×1.06＝
     4.558），垂直倍率3.9維持不變（對應「高度不變」）。外框
     （.scroller）的寬度是JS量測.panels實際渲染出來的寬度算出來
     的（見applyRecentOnly()），內容變寬之後，量到的寬度自然跟著
     變大，外框會自動跟著撐開，不需要另外幫外框加一個獨立的延伸
     百分比。 */
  body.recent-only-mode .panels{ transform:translateX(-3%) scale(4.558, 3.9); transform-origin:left top; }

  body:not(.game-mark6):not(.game-lotto):not(.game-daily) .img-game-tabs button[data-game="539"]{ display:flex; }

  /* 「彩券名跟開獎單之間的空間」＝這個 .hint-bar（id="img-hint"）

  .draw-row-extra{}

  .draw-toolbar button.draw-blank-btn{

  body.recent-only-mode .draw-toolbar button#draw-period16,

     用position:fixed浮在遮罩最上層、固定顯示在畫面接近開獎單頂端
     的位置，不管開獎單原本捲到哪裡都不會被牽動。 */
  .manual-entry-backdrop{
    display:none; position:fixed; inset:0; z-index:1290;
    background:rgba(0,0,0,0.45);
  }
  .manual-entry-backdrop.open{ display:block; }
  /* 使用者要求：「手動輸入」按鍵本身不能被自己觸發的背景遮罩擋住，
     要一直保持在最上層、可以點——這樣使用者才能「再點兩下取消」，
     不管欄位有沒有填完都能直接放棄、恢復首頁功能。z-index比遮罩
     （1290）更高，同時要有position才會讓z-index生效（按鍵本來是
     一般文件流裡的元素，沒有position的話z-index不會有作用）。 */
  #manual-entry-btn{
    position:relative; z-index:1301;
  }
  .manual-entry-inline{
    display:none;
    align-items:center; gap:4px; flex-wrap:wrap;
    position:fixed; z-index:1300;
    /* 使用者要求：對齊開獎單裡「5 3 9」那種彩券名稱欄位標題
       （.panel-head）的位置，不是螢幕最上面的分頁列。這裡的
       top:14px只是JS還沒執行前的初始/備用值，實際生效的數字由
       openInline()裡即時量測.scroller的位置接管（跟這個檔案裡
       其他類似的位置計算是同一個模式）。 */
    top:14px; left:14px; right:14px;
    background:#1a1a1a; border:1.5px solid var(--gold); border-radius:10px;
    padding:8px 10px;
  }
  .manual-entry-inline.open{ display:flex; }
  /* type="date"這個原生日期輸入元件，本來就是「點開日曆/捲輪選、
     不能用鍵盤亂打數字」的介面，符合「不能自由輸入文字」的精神，
     同時max屬性（JS動態設成今天）直接讓瀏覽器把未來日期整個
     disable掉、選不到，比自己額外寫驗證邏輯更可靠。使用者截圖
     回報縮到100px太窄，日期又被截斷變成「2026/0」看不到月日，
     改回120px這個確認過能完整顯示「年/月/日」的安全寬度，不再
     繼續往下縮。 */
  .manual-entry-date-input{
    width:120px; flex-shrink:0; background:#2a2a2a; color:#fff;
    border:1px solid #555; border-radius:5px; padding:2px 4px; font-size:12px;
    margin-right:8px;
    -webkit-tap-highlight-color:transparent;
  }
  /* 號碼欄位一樣用flex排列（5欄或7欄，視玩法而定），但因為現在是
     擠在.hero-date-row這一整列裡（不是原本獨立一個彈窗框），每一
     顆縮小很多，點了才在下方彈出選號表去選，欄位本身一樣不能
     直接打字輸入。使用者要求號碼欄位之間也不要靠太近，間距從2px
     加大到6px。 */
  .manual-entry-slots{
    display:flex; gap:6px; flex-shrink:1; min-width:0; overflow-x:auto;
  }
  .manual-entry-slot{
    width:20px; height:20px; border-radius:4px; flex-shrink:0;
    border:1px solid #555; background:#2a2a2a; color:#fff;
    font-size:9px; font-weight:700; font-variant-numeric:tabular-nums;
    font-family:"Courier New",Courier,Arial,Helvetica,sans-serif;
    padding:0; -webkit-tap-highlight-color:transparent;
  }
  /* 特別號那一欄（六合彩/大樂透才有）用金色框，跟前面6個一般號碼
     欄位區分開來，視覺上一眼看出哪一欄是特別號。 */
  .manual-entry-slot.special{ border-color:var(--gold); color:var(--gold); }
  .manual-entry-slot.filled{ background:#333; }
  .manual-entry-mini-btn{
    width:20px; height:20px; border-radius:50%; flex-shrink:0;
    font-size:11px; font-weight:700; line-height:1; padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  /* 使用者要求：✓（確認）跟✕（取消）移到這一列的最右邊，而且
     兩個不要靠得太近（一個是存入、一個是放棄，點錯的後果不一樣，
     要有明顯的間距隔開）。margin-left:auto是flex排版裡「把這個
     項目跟它後面的所有項目都推到最右邊」的標準寫法，不管前面
     日期/號碼欄位實際佔用多少寬度，確認/取消都會自動貼齊最右側。 */
  .manual-entry-mini-btn.confirm{
    border:1px solid var(--gold); background:var(--gold); color:#1a1a1a;
    margin-left:auto;
  }
  /* 號碼還沒選滿之前，「確認」鍵鎖住不能點，視覺上明顯變暗，跟
     App裡其他鎖住的按鍵（例如.data-update-btn:disabled）用同一套
     「opacity降低」的表示方式，維持一致的視覺語言。 */
  .manual-entry-mini-btn.confirm:disabled{ opacity:0.4; }
  .manual-entry-mini-btn.cancel{
    border:1px solid #555; background:#2a2a2a; color:#ccc;
    margin-left:10px;
  }
  /* 選號表（原本是全螢幕黑底遮罩的彈窗，改成錨定在.manual-entry-
     inline正下方的小面板，使用者要求「選擇框在這一列下面以彈窗
     樣式顯示」）。抓到前一版的bug：這兩個元素原本沒有巢狀在
     .manual-entry-inline裡面（放在頁面很後面的地方），position:
     absolute的top:100%沒辦法正確以.manual-entry-inline為基準
     定位，現在已經改成HTML裡真的巢狀在裡面，.manual-entry-inline
     本身也加上了position:relative，這個下拉面板的定位才會正確。 */
  .manual-num-picker-dropdown{
    display:none; position:absolute; top:100%; left:0; right:0;
    z-index:1300; margin-top:4px;
    background:#1a1a1a; border:1.5px solid var(--gold); border-radius:10px;
    padding:10px;
  }
  .manual-num-picker-dropdown.open{ display:block; }
  .manual-num-picker-title{ color:var(--gold); font-size:12px; font-weight:700; margin-bottom:6px; text-align:center; }
  .manual-num-picker-grid button{
    font-size:min(5vw, 15px);
  }
  .manual-entry-hint{
    display:none; position:absolute; top:100%; left:0; right:0;
    z-index:1300; margin-top:4px;
    background:#1a1a1a; border:1.5px solid #f66; border-radius:8px;
    color:#f66; font-size:11px; text-align:center; padding:6px 8px;
  }
  .manual-entry-hint.open{ display:block; }
  .save-toast{
    display:none; position:fixed; z-index:1200;
    left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(20,20,20,0.92); color:#fff; font-size:13px; font-weight:600;
    padding:14px 22px; border-radius:10px; text-align:center; white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .save-toast.show{ display:block; }
  .pin-btn{
    position:fixed; z-index:1000;
    width:26px; height:26px; border-radius:7px; border:none;
    background:#8a8a8a; color:#000; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    animation:pinBlink 1.1s ease-in-out infinite;
  }
  @keyframes pinBlink{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .pin-btn.armed{ background:#8a8a8a; color:#3FA9FF; animation:none; opacity:1; }
  /* 大頭釘、清除鍵（原全頁鍵）、存檔／返回浮動鍵，還有「定期」
     浮動鍵（進入「定期十六」時取代大頭釘的位置），這五顆都改成
     不閃爍——原本繼承 .pin-btn 的閃爍動畫，這裡個別覆蓋掉，一般
     狀態下維持固定不動的樣子。顏色也是共用同一套專屬配色：平常
     黑底紅圖示，觸發功能的當下（連點兩下啟動）圖示變成紅底黑
     圖示，跟其他按鍵的金色armed樣式區隔開來，一眼看得出這排是
     「鎖頁」相關的功能鍵。 */
  #pin-btn, #fullpage-btn, #float-save-btn, #float-back-btn{
    animation:none; background:#8a8a8a; color:#e02020;
  }
  #pin-btn.armed, #fullpage-btn.armed, #float-save-btn.armed, #float-back-btn.armed{
    background:#8a8a8a; color:#000;
  }
  /* 「離開」鍵（原「定期」浮動鍵，取代大頭釘的位置，只有「定期
     十六」啟動時才會出現）固定是黑底紅圖示，跟其他三顆平常狀態的
     配色一致，不會像其他三顆那樣觸發時切換成紅底黑——因為這顆
     按鍵本身只要看得到，就代表現在正處於「定期」狀態，不需要用
     顏色切換來額外表示「有沒有觸發」，維持固定的黑底紅圖示。用
     !important 排除任何其他規則造成的顏色疑慮。 */
  #period-btn{ animation:none; background:#8a8a8a !important; color:#e02020 !important; }
  /* 全頁鍵功能已取消，用disabled狀態的樣式跟其他還在正常運作的
     浮動按鍵（大頭釘、定期）區隔開來——不閃爍、變暗，一眼看得出
     這顆目前沒有作用。 */
  #fullpage-btn:disabled{ animation:none; opacity:0.35; }
  /* 浮動的「定期」按鍵功能已取消（使用者要求），同樣的disabled
     樣式處理：不閃爍、變暗，功能改到六大功能下面的「定期十六」
     按鍵上，兩者背後呼叫同一個函式（togglePeriodMode），行為
     完全一致，只是「定期十六」不受這裡的disabled影響。 */
  /* 浮動的「定期」按鍵已經整個取消，直接隱藏不顯示（不只是disabled
     變暗而已）——功能完全由「定期十六」接手，兩者共用同一個函式
     本體 togglePeriodMode()，這裡隱藏不影響「定期十六」正常運作。
     HTML 上的 disabled 屬性保留著（雙重保險，就算哪天不小心把
     display:none 拿掉，按鍵本身還是不會有反應）。 */
  #period-btn{ display:none !important; }
  /* 進入「定期十六」的時候，改成讓這顆最原始的「定期」浮動鍵重新
     出現，取代大頭釘原本的位置（大頭釘這時候整個隱藏，不是只是
     變灰色）——用 body.recent-only-mode 這個 class 蓋過上面那條
     display:none!important，優先權足夠高（class選擇器+id選擇器）。 */
  body.recent-only-mode #period-btn{ display:flex !important; }
  .icon-frame{
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    border:1.2px solid currentColor; border-radius:5px;
    background:rgba(255,255,255,0.14);
    flex-shrink:0;
  }
  /* letter-spacing:37px是「工具列還是滿版寬度」時代的設定，故意用
     誇張字距把2個字的文字撐開、填滿寬按鍵。九宮鍵區現在已經改成
     跟開獎單一樣窄，這個誇張字距在窄按鍵裡會直接爆版（文字被截斷
     或超出按鍵邊界），改成正常字距，搭配justify-content:center
     （見下面.draw-toolbar button那條規則）置中對齊，符合「縮小、
     排列整齊」的要求。 */
  .btn-label{
    font-size:20px; line-height:1.2; letter-spacing:0.5px; white-space:nowrap;
  }
  .draw-toolbar button .icon-frame{ color:#e02020; }
  table.road td.num.num-marked{
    background:transparent !important;
    color:var(--mark-text-color, #000) !important;
    font-weight:700;
    border-radius:0;
    outline:none !important;
    border:none !important;
    position:relative;
  }
  /* 第一招：圓形圈住號碼，用「絕對定位的偽元素」畫在文字後面
     （z-index:0），偽元素不佔版面空間，td本身的寬高不受影響（詳見
     下方說明）。現在改成用獨立的 num-marked-click class 控制要不要
     顯示圓形，不再用:not(.num-marked-drag)排除——一格如果同時成立
     第一招、第二招，兩者要同時顯示、互不干擾：第二招（方形）畫在
     td本身，第一招（圓形）疊在最上層，兩者疊加呈現。
     一開始直接用固定寬高的span做圓形，結果那個span本身變成一個比
     文字還大的方框，撐開了整個td（表格儲存格的高度／寬度是跟著
     格子裡最高/最寬的內容自動撐開的），造成那一整列被撐高、跳動，
     所以才改用偽元素。用em當單位，圓形大小跟著字體大小走，539/
     天天樂跟六合彩/大樂透（字體大小不變，只是欄寬較窄）都適用
     同一套規則。
     外框重新啟用，但改成圓形的外框（跟著圓形的border-radius:50%
     走），不是原本方形td的直角外框——用border而不是outline，因為
     outline是方形的，貼著圓形元素也不會變圓，border才會跟著
     border-radius彎成圓弧。顏色沿用原本第一招的框色變數
     （--mark-frame-color），不佔額外版面空間，一樣是偽元素本身
     的一部分。 */
  /* 使用者最新指示：不分情境（一般抓牌、定期十六等等），第一招的
     圓形直徑一律強制等於「格子高度的100%」，精準壓住上下格線，
     全部系統統一套用同一個規則，不再分別針對某個模式縮小/調整。
     用height:100%（相對於這個td本身的高度，td本身已經有position:
     relative，是這個絕對定位偽元素的基準）取代原本的1.55em寫死
     倍率——1.55em是用字體大小去推算，字體大小、格子高度在不同
     模式下的比例關係不完全一致，用height:100%才能保證圓形高度
     永遠精準等於格子高度本身，不管在哪個模式下都一樣「剛好壓住
     上下格線」。用aspect-ratio:1維持正圓形（寬度自動跟高度一致），
     不再另外寫死width。 */
  table.road td.num.num-marked.num-marked-click::before{
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    height:100%;
    aspect-ratio:1;
    border-radius:50%;
    background:var(--mark-bg-color, #FF3B3B) !important;
    border:1.4px solid var(--mark-frame-color, #2ECC71);
    box-sizing:border-box;
    z-index:0;
    pointer-events:none;
  }
  /* 使用者確認：圓形壓住上下格線的地方，格線真的看不見了——這是
     CSS繪製順序的結構性問題，不是「渲染沒更新」可以用重繪解決的：
     瀏覽器畫一個元素的順序是「先畫這個元素自己的背景/邊框，再畫
     它裡面position:absolute、z-index:0的子元素（含偽元素）」，
     所以td自己的border-bottom/border-right，天生就會被圓形這個
     z-index:0的::before蓋在上面，跟有沒有強制reflow無關。
     修法：加回::after（因為::before已經被圓形佔用），z-index比
     圓形（0）高，用box-shadow的inset寫法重新畫一次跟td原生邊框
     完全一樣的線（1px solid #bbb，比照table.road td{border-right/
     border-bottom}的設定）。這次刻意不加任何超出格子邊界的偏移量
     （inset:0，完全貼齊格子本身的box），box-shadow的inset天生就
     是完全包在元素自己的box裡面，不會有先前bottom:-10%那種因為
     格子overflow:hidden被整個裁掉、變成完全看不見的問題。 */
  /* 使用者堅持要「第一招下面的橫隔線下移5%」的效果——技術上要
     達到這個效果，必須先解決overflow:hidden裁切的問題（見上面
     說明，任何往下的位移都會被裁掉）。這裡改用範圍更小、更安全
     的做法：只針對「有第一招標記的格子」這個很小的子集合，單獨
     解除overflow限制（改成visible），不去動table.road td這條
     影響「所有」格子的基礎規則，把可能的副作用範圍降到最小。
     解除裁切之後，往下的位移終於能真正顯示出來，不會再被吃掉。 */
  table.road td.num.num-marked.num-marked-click{
    overflow:visible;
  }
  table.road td.num.num-marked.num-marked-click::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    box-shadow: inset 0 -1px 0 0 #bbb, inset -1px 0 0 0 #bbb;
    transform:translateY(3%);
  }
  table.road td.num.num-marked.num-marked-click .cell-shift{
    position:relative;
    z-index:2;
  }
  /* 第二招（滑動整列標記）跟第一招（指定號碼）用同一套 pickedPaths
     資料，但顏色要能區分開來：底色用第一招的框色、文字色用第一招
     的底色、框色用第一招的字色，三個角色照這個對應關係走，這樣
     使用者調色盤調整第一招顏色時，第二招會自動跟著換算，不用兩邊
     分開設定。
     選擇器比 table.road td.num.num-marked 多一個class，特異度更高，
     天然覆蓋掉上面那條規則，不需要調整CSS順序。第二招維持整格
     填色＋外框的方形樣式，畫在td本身；第一招的圓形（見上）疊在
     最上層，兩者用不同層次（td本身 vs 偽元素），同時成立時互不
     覆蓋，一起顯示。 */
  table.road td.num.num-marked.num-marked-drag{
    background:var(--mark-frame-color, #2ECC71) !important;
    color:var(--mark-bg-color, #FF3B3B) !important;
    outline:1.4px solid var(--mark-text-color, #000) !important;
    outline-offset:-1.4px;
    border:1px solid var(--mark-text-color, #000) !important;
  }
  /* 兩招同時成立時，號碼文字顏色要以第一招為準，不是第二招的
     文字色。這條選擇器比單獨的num-marked-drag多一個class（四個
     class疊在一起），特異度更高，天然覆蓋掉上面那條規則的color，
     只改文字顏色，底色／外框（方形本身的樣式）維持第二招不變。 */
  table.road td.num.num-marked.num-marked-drag.num-marked-click{
    color:var(--mark-text-color, #000) !important;
  }
  /* 一~四招（指定號碼／連接線／分佈／第四招填的號碼）的顯示結果，
     只能在「抓牌」畫面裡看得到——標記本身的資料（pickedPaths／
     connections／numPickedEntries）不管在不在抓牌模式都照樣正確
     計算/更新（這樣才能保證回到抓牌時內容是對的），只是「要不要
     顯示出來」用這幾條規則卡住：body 沒有 magnifier-mode 這個
     class（也就是不在抓牌模式）的時候，統統蓋掉，恢復成一般格子
     的樣子；回到抓牌，這幾條規則就不生效，原本的樣式重新蓋回來，
     馬上看到全部標記。 */
  body:not(.magnifier-mode) table.road td.num.num-marked{
    background:transparent !important;
    color:#000 !important;
    outline:none !important;
    border-top:none !important; border-left:none !important;
    border-right:1px solid #bbb !important; border-bottom:1px solid #bbb !important;
  }
  body:not(.magnifier-mode) table.road td.num.num-picked{
    background:transparent !important;
    color:transparent !important;
  }
  body:not(.magnifier-mode) #connect-svg{ display:none !important; }
  .img-overlay .view{ display:none; }
  .img-overlay .view img{ display:block; max-width:none; }
  .img-overlay .loading{ color:#555; font-size:12px; padding:20px; }

<div id="header-top-bg-wrap"></div>

<div id="portrait-lock-overlay">
  <div style="font-size:48px; margin-bottom:16px;">📱</div>
  <div>請將手機轉回直向（豎屏）使用</div>
  <div style="font-size:13px; color:#999; margin-top:8px;">這個App設計給直向畫面使用，轉回直向會自動恢復</div>
</div>

<div id="page-zoom-wrap">
<h2 class="sr-only">今彩539 開獎歷史紀錄網站，4個區塊由左至右排列，每區塊由上至下最多60筆，顯示日期、星期與由小到大排序的5個號碼，最後數格為尚未開獎的未來期數並自動跳過星期日，空白期數可自行調整。</h2>

<header class="top" id="header-top">
  <div class="brand">
    <div class="game-tabs" id="game-tabs">
      <button type="button" data-game="539" class="active" aria-pressed="true">539</button>
      <button type="button" data-game="mark6" aria-pressed="false">六合彩</button>
      <button type="button" data-game="daily" aria-pressed="false">天天樂</button>
      <button type="button" data-game="lotto" aria-pressed="false">大樂透</button>
    </div>
  </div>
</header>
<div id="header-top-anchor" style="display:none;"></div>

<div id="game-539-content">
<div class="hero" id="hero">
  <div class="hero-left">
    <div class="hero-date-row">
      <div class="hero-date" id="hero-date">—</div>
      <button type="button" id="manual-entry-btn" class="data-update-btn" aria-label="手動輸入開獎">手動<br>輸入</button>
      <button type="button" id="data-update-btn" class="data-update-btn" aria-label="資料更新">資料<br>更新</button>
    </div>
    <div class="hero-balls" id="hero-balls"></div>
  </div>
  <div class="hero-controls-row">
    <button type="button" id="clean-sheet-btn" class="clean-sheet-btn" aria-label="印單">印</button>
    <div class="blank-stepper">
      <button id="blank-minus" aria-label="減少">－</button>
      <span class="count" id="blank-count">10</span>
      <button id="blank-plus" aria-label="增加">＋</button>
    </div>
    <button type="button" id="img-view-btn" class="catch-card-btn" aria-label="抓牌">抓</button>
  </div>
</div>

<div id="demo-banner"></div>

<!-- 手動輸入的「顯示及工作區域」：使用者最終要求開獎單完全固定
     不能被推動，輸入區改成浮在畫面最上層的覆蓋層，啟動時螢幕上
     其他所有功能按鍵（539/六合彩等分頁、印、抓……）都要失效。
     .manual-entry-backdrop蓋住整個畫面、擋在所有其他元素前面，
     只要它顯示著，底下任何按鍵都碰不到，達到「其他功能都失效」
     的效果，不用一顆一顆手動disable。 -->
<div class="manual-entry-backdrop" id="manual-entry-backdrop"></div>
<div class="manual-entry-inline" id="manual-entry-inline">
  <input type="date" id="manual-entry-date" class="manual-entry-date-input" />
  <div class="manual-entry-slots" id="manual-entry-slots"></div>
  <button type="button" class="manual-entry-mini-btn confirm" id="manual-entry-confirm" aria-label="確認存入">✓</button>
  <button type="button" class="manual-entry-mini-btn cancel" id="manual-entry-cancel" aria-label="取消">✕</button>

       裡面（不能放在頁面其他地方），CSS的position:absolute才會
       正確以.manual-entry-inline為基準定位在它正下方，不會跑到
       頁面上完全不相干的位置去。 -->
  <div class="manual-num-picker-dropdown" id="manual-num-picker-dropdown">
    <div class="manual-num-picker-title" id="manual-num-picker-title">選擇號碼</div>
    <div class="num-picker-grid manual-num-picker-grid" id="manual-num-picker-grid"></div>
  </div>
  <div class="manual-entry-hint" id="manual-entry-hint"></div>
</div>

<div class="scroller">
  <div class="panels" id="panels"></div>
</div>
</div>

// 切換玩法分頁的時候，用手機系統內建的「文字轉語音」引擎唸出玩法
// 名稱（不是下載/播放錄音檔，是即時合成語音）——沒有網路也能用，
// 不吃檔案大小。
//
// 這裡處理兩個常見、容易導致「完全沒聲音」的技術陷阱：
// 1) Chrome的語音清單（getVoices()）是非同步載入的，網頁剛載入的
//    當下第一次呼叫，很可能拿到空陣列——不是真的沒有語音可用，只是
//    清單還沒準備好。要嘛等 voiceschanged 事件觸發、要嘛在真的要
//    講話之前才臨時再查一次清單。
// 2) 之前寫死指定 utter.lang = "zh-TW"，如果手機系統剛好沒有裝
//    zh-TW這個語音（很多Android機型內建的是zh-CN，或者兩者都沒有，
//    只有zh-HK/其他），瀏覽器不一定會自動幫你退而求其次找別的中文
//    語音，可能直接整句話默默不出聲——改成先去查手機實際裝了哪些
//    語音，自己從中找最接近的中文語音（zh-TW優先，找不到退
//    zh-CN，再退zh-HK，再退任何zh開頭的），真的一個中文語音都
//    沒有的話，才完全不指定voice、交給瀏覽器自己決定預設語音
//    （至少還會發出聲音，只是不一定是中文腔調)。
function pickChineseVoice(){
  if(typeof window.speechSynthesis === "undefined") return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if(voices.length === 0) return null;
  const byLang = function(prefix){
    return voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
  };
  return byLang("zh-tw") || byLang("zh-cn") || byLang("zh-hk") || byLang("zh") || null;
}
// 畫面上顯示的文字（GAME_LABELS）不能動，但「唸出來的內容」可以
// 另外指定——「539」這三個數字，TTS引擎很容易當成完整數字唸成
// 「五百三十九」，不是彩券名稱習慣的「五、三、九」分開唸法，所以
// 另外準備一份「唸法對照表」，只有找得到對應項目的才轉換，其他
// 玩法（本身就是中文詞）維持原樣直接唸。
const GAME_SPEECH_LABELS = { "539": "五三九", daily: "天天叻", lotto: "大叻透" };
// 語音功能暫時關閉（使用者要求）——SPEECH_ENABLED 這個開關設成
// false，speakGameName() 一開始就直接return，不會有任何聲音。
// 底下所有邏輯（語音清單選擇、唸法對照表等）都還留著沒刪除，之後
// 要恢復的話，只要把這個常數改回 true 就可以，不用重寫。
const SPEECH_ENABLED = false;
function speakGameName(gameKey){
  if(!SPEECH_ENABLED) return;
  if(typeof window.speechSynthesis === "undefined") return;
  try{
    window.speechSynthesis.cancel(); // 打斷上一個還沒唸完的，避免疊在一起愈排愈長
    const label = GAME_SPEECH_LABELS[gameKey] || GAME_LABELS[gameKey] || gameKey;
    function doSpeak(){
      const utter = new SpeechSynthesisUtterance(label);
      const voice = pickChineseVoice();
      if(voice){
        utter.voice = voice;
        utter.lang = voice.lang;
      } else {
        // 完全找不到中文語音清單（可能清單還沒載入好，也可能手機
        // 真的沒有中文語音），還是設定zh-TW當作意圖標示，讓瀏覽器
        // 自己盡量嘗試，好過完全不設定。
        utter.lang = "zh-TW";
      }
      window.speechSynthesis.speak(utter);
    }
    const voicesNow = window.speechSynthesis.getVoices();
    if(voicesNow && voicesNow.length > 0){
      doSpeak();
    } else {
      // 語音清單還沒載入好，等 voiceschanged 觸發後再講；同時設一個
      // 500毫秒的保險，避免這個事件在某些瀏覽器上完全不觸發，導致
      // 永遠等不到、什麼都不講。
      let spoken = false;
      const onVoicesChanged = function(){
        if(spoken) return;
        spoken = true;
        window.speechSynthesis.removeEventListener("voiceschanged", onVoicesChanged);
        doSpeak();
      };
      window.speechSynthesis.addEventListener("voiceschanged", onVoicesChanged);
      setTimeout(onVoicesChanged, 500);
    }
  }catch(e){
    console.warn("語音播放失敗", e);
  }
}

// 使用者要求：除了程式裡寫死的內嵌資料（EMBEDDED_DATA等），另外
// 在手機本機開一個「獨立在程式之外」的資料庫，可以單獨讀取，而且
// 資料只要更新，這個本機資料庫也要跟著自動更新。IndexedDB是瀏覽器
// 原生支援的正式資料庫技術（不是localStorage那種簡單的key-value
// 暫存，是真正有資料表、可以查詢的資料庫），存在瀏覽器自己的儲存
// 空間裡，獨立於這份HTML檔案本身——就算之後重新整理頁面、甚至
// 這份HTML檔案被替換成新版本，只要瀏覽器沒有清除資料，IndexedDB
// 裡的資料還是會留著，符合「獨立在程式之外」的要求。
//
// 資料庫結構：一個資料庫（LOTTERY_DB_NAME），底下四個資料表
// （object store），分別對應四種玩法，每個資料表用「日期」當
// 唯一主鍵（keyPath: "date"），存的是完整的一筆開獎紀錄物件
// （跟EMBEDDED_DATA裡每一筆的格式一樣：{date, weekday, numbers,
// special?}）。
const LOTTERY_DB_NAME = "539_lottery_local_db";
const LOTTERY_DB_VERSION = 1;
const LOTTERY_DB_STORES = { "539": "game539", "daily": "gameDaily", "mark6": "gameMark6", "lotto": "gameLotto" };
let lotteryDBInstance = null; // 開啟過一次之後快取起來，不用每次都重新開

function openLotteryDB(){
  return new Promise(function(resolve, reject){
    if(lotteryDBInstance){ resolve(lotteryDBInstance); return; }
    if(!window.indexedDB){
      // 極少數瀏覽器/隱私模式可能不支援IndexedDB，這種情況下本機
      // 資料庫功能就安靜地不生效，不影響App其他正常功能（App主要
      // 顯示的資料一直都是直接讀EMBEDDED_DATA這些內嵌陣列，本機
      // 資料庫只是額外多一份鏡像備份，不是本體）。
      reject(new Error("此瀏覽器不支援IndexedDB"));
      return;
    }
    const req = indexedDB.open(LOTTERY_DB_NAME, LOTTERY_DB_VERSION);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      Object.values(LOTTERY_DB_STORES).forEach(function(storeName){
        if(!db.objectStoreNames.contains(storeName)){
          db.createObjectStore(storeName, { keyPath: "date" });
        }
      });
    };
    req.onsuccess = function(e){
      lotteryDBInstance = e.target.result;
      resolve(lotteryDBInstance);
    };
    req.onerror = function(e){
      reject(e.target.error);
    };
  });
}

// 把單一一筆開獎紀錄寫進（或覆蓋更新）本機資料庫對應的資料表裡。
// 用put()不用add()——put()是「有就覆蓋、沒有就新增」，不會因為
// 同一天的資料重複寫入而報錯，這樣同一個函式可以同時處理「新增
// 一筆全新資料」跟「初次啟動時把內嵌資料整批灌進去」這兩種情境。
async function saveDrawRecordToDB(gameKey, record){
  const storeName = LOTTERY_DB_STORES[gameKey];
  if(!storeName) return;
  try{
    const db = await openLotteryDB();
    await new Promise(function(resolve, reject){
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).put(record);
      tx.oncomplete = resolve;
      tx.onerror = function(e){ reject(e.target.error); };
    });
  }catch(e){
    // 本機資料庫寫入失敗（例如隱私模式擋掉IndexedDB），不影響App
    // 主要功能——App畫面顯示一直都是直接讀EMBEDDED_DATA這些內嵌
    // 陣列，不依賴這個本機資料庫，這裡失敗只是「這次的備份鏡像沒
    // 寫成功」，安靜記錄警告、不中斷任何流程。
    console.warn("寫入本機資料庫失敗（不影響App主要功能）：", gameKey, e);
  }
}

// App每次啟動都呼叫一次：把目前EMBEDDED_DATA等內嵌陣列裡的全部
// 資料，整批寫進本機資料庫（用put()覆蓋更新，不會重複），確保
// 本機資料庫的內容跟App目前實際顯示的資料隨時保持一致——不管是
// 內嵌陣列本來就有的舊資料，還是App啟動之後用「資料更新」按鍵
// 或排程自動合併進來的新資料，只要在EMBEDDED_DATA等陣列裡，這裡
// 都會確保本機資料庫也有同一份。
async function syncLotteryLocalDB(){
  const gameDataMap = {
    "539": EMBEDDED_DATA,
    "daily": EMBEDDED_DAILY_DATA,
    "mark6": EMBEDDED_MARK6_DATA,
    "lotto": EMBEDDED_LOTTO_DATA,
  };
  try{
    const db = await openLotteryDB();
    for(const gameKey of Object.keys(gameDataMap)){
      const storeName = LOTTERY_DB_STORES[gameKey];
      const records = gameDataMap[gameKey];
      await new Promise(function(resolve, reject){
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        records.forEach(function(record){ store.put(record); });
        tx.oncomplete = resolve;
        tx.onerror = function(e){ reject(e.target.error); };
      });
    }
  }catch(e){
    console.warn("同步本機資料庫失敗（不影響App主要功能）：", e);
  }
}

// 使用者要求：每次有新資料加進App，自動把整個資料庫重新下載成一份
// JSON檔案（存到手機的下載資料夾），這是「真正的檔案」，不是瀏覽器
// 內部儲存，不受同一來源（origin）限制，任何有讀檔權限的程式理論
// 上都讀得到。**已經跟使用者確認過的技術限制**：手機瀏覽器沒辦法
// 讓網頁自動覆蓋同一個檔案（Android Chrome不支援
// showSaveFilePicker這類進階技術），每次自動觸發下載，檔名都會
// 被系統自動加上編號（例如539資料庫.json→539資料庫(1).json），
// 使用者確認可以接受、會自己手動整理（刪除舊檔、把新檔改回原本
// 檔名），所以這裡只需要單純觸發下載，不用處理檔名衝突。
function exportLotteryDatabaseAsFile(){
  const gameDataMap = {
    "539": EMBEDDED_DATA,
    "daily": EMBEDDED_DAILY_DATA,
    "mark6": EMBEDDED_MARK6_DATA,
    "lotto": EMBEDDED_LOTTO_DATA,
  };
  const json = JSON.stringify(gameDataMap, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "539資料庫.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

// 電腦螢幕（寬度≥900px）上，把「最新開獎」外框、頂部按鍵列、開獎單
// 外框的寬度都收緊貼齊 #panels 實際內容寬度，不再滿版跟著瀏覽器
// 視窗寬度走（手機完全不受影響，這整個函式在手機寬度下直接跳過）。
// 抽成獨立函式，不寫在 buildPanels() 內部就好——因為除了
// buildPanels() 重畫畫面會需要重新套用之外，「關閉抓牌回到首頁」
// 這個情境（見 closeBtn 的click handler／applyRecentOnly()）也會
// 把 .scroller 的 style.width 重設成空字串，如果沒有在關閉的當下
// 也呼叫這個函式重新套用一次，電腦版使用者關閉抓牌回到首頁時，
// 開獎單外框會掉回CSS預設的滿版寬度、變成一大片異常空白邊框
// （使用者實測回報過這個bug：圖1剛進首頁邊框正常，圖2點抓再關閉
// 後邊框變超寬，就是這個原因——當時只有buildPanels()自己內部的
// requestAnimationFrame會套用這個寬度收緊邏輯，關閉抓牌的流程
// 沒有重新觸發到，所以掉回錯誤的寬度）。
// 首頁整個畫面（#page-zoom-wrap）置中：試過CSS margin:auto、也試過
// JS量測視窗寬度精準置中，實測後使用者反映兩種都沒有達到預期效果，
// 改回最單純直接的做法——固定往左平移1%，不再用「自動置中」的
// 演算法（前面幾次的自動置中邏輯可能有量測時機或計算前提上的
// 落差沒有抓到，既然直接指定固定比例才是使用者實測有效的方式，
// 就用這個最簡單、結果最可預期的寫法）。
function centerHomepageWrap(){
  if(document.body.classList.contains("magnifier-mode")) return;
  const wrap = document.getElementById("page-zoom-wrap");
  if(!wrap) return;
  wrap.style.marginRight = "";
  wrap.style.marginLeft = "-1%";
}

function applyDesktopScrollerWidth(retryCount){
  retryCount = retryCount || 0;
  // 這個函式是首頁專屬的版面對齊邏輯（header.top／.hero／.scroller
  // 三者寬度互相對齊），但因為buildPanels()裡是用requestAnimationFrame
  // 延遲呼叫這個函式，如果剛好在抓牌畫面裡遇到資料自動重新整理
  // （buildPanels()重畫），這個延遲執行的時機點會排在
  // __reapplyMagnifierState()（負責重新套用抓牌畫面該有的
  // panels.style.zoom）之後，等於這個函式才是最後執行、最終覆蓋掉
  // 抓牌畫面正確設定的那一個——開獎單的zoom會被這裡的邏輯重新
  // 動過，「內容往左縮」的問題會在抓牌畫面裡重新出現。這裡直接
  // 加一個判斷：偵測到目前是抓牌畫面（body有magnifier-mode這個
  // class）就整個跳過、什麼都不做，這個函式只在首頁生效。
  if(document.body.classList.contains("magnifier-mode")) return;
  const panelsElForWidth = document.getElementById("panels");
  if(!panelsElForWidth) return;
  const headerTopEl = document.querySelector("header.top");
  const heroEl = document.getElementById("hero");
  const brandEl = document.querySelector(".brand");
  const scrollerEl = document.querySelector(".scroller");
  // **在做任何量測之前，先把這個函式會設定的每一個元素的行內樣式
  // 全部重設回空字串／none**——這個函式會在「首頁初次載入」跟
  // 「關閉抓牌回到首頁」這兩種完全不同的情境下被呼叫，之前只重設
  // 了.panels的transform，使用者實測回報「進首頁點抓再關閉，尺寸
  // 還是不一致」，代表殘留的舊行內樣式不只.panels一個地方。現在
  // 全面重設header.top／.hero／.scroller／.brand／.panels五個
  // 元素的相關樣式，確保不管這個函式被呼叫幾次、在哪個情境下被
  // 呼叫，每一次都是從瀏覽器原生CSS算出來的、完全乾淨的初始狀態
  // 開始重新量測、重新計算，不會有任何一個環節是「延續上一次算出
  // 來的舊數字」，徹底排除累積/複合計算誤差的可能性。
  if(headerTopEl) headerTopEl.style.width = "";
  if(heroEl) heroEl.style.width = "";
  if(brandEl) brandEl.style.width = "";
  if(scrollerEl) scrollerEl.style.width = "";
  // 用zoom（不是transform）重設回基礎值0.59，理由見下方「四區
  // 平均分配寬度」那段的完整說明——transform只影響視覺呈現、不
  // 影響瀏覽器計算的版面空間，曾經造成往上滑動開獎單會卡住/彈回
  // 的異常，已經全面改用zoom。
  panelsElForWidth.style.zoom = "0.59";
  const panelsW = panelsElForWidth.getBoundingClientRect().width;
  // 使用者對照截圖比對出真正的原因：首頁「初次載入」時，這個函式
  // 量到的panelsW有時候是0（開獎單裡上千個儲存格才剛用innerHTML
  // 塞進去，瀏覽器還沒排版完成，量測時機太早），導致這裡提早
  // return、整個縮小/貼齊邏輯完全沒有套用，畫面維持CSS原始的
  // 滿版寬度；等到後來使用者點「抓」再關閉，DOM這時候早就穩定
  // 排版完成了，這次量測才第一次成功套用縮小邏輯——不是「越縮
  // 越誇張」的問題，是「初次載入時根本沒套用、之後才第一次套用」
  // 的問題，兩次呈現的畫面當然不一樣。**修法：量不到寬度的時候
  // 不要放棄，改成用requestAnimationFrame重試，最多重試5次**
  // （每次都是下一個影格才重試，理論上1-2次之內DOM就會排版好，
  // 5次是留寬裕的安全上限，避免極端情況下無窮迴圈重試）。
  if(panelsW <= 0){
    if(retryCount < 5){
      requestAnimationFrame(function(){ applyDesktopScrollerWidth(retryCount + 1); });
    }
    return;
  }
  // 使用者要求「以開獎單（.scroller）的寬度為標準，上面兩區都跟
  // 它一致」——不是三個區塊各自獨立算出同一個公式的數字（理論上
  // 應該相同，但為了徹底排除任何潛在的瀏覽器渲染/四捨五入誤差），
  // 改成**先讓.scroller自己套用寬度，量出它實際渲染出來的寬度，
  // 再把這個「真正量到的數字」明確套用到header.top／.hero**，
  // 確保後兩者是照著開獎單量出來的實際結果去對齊，不是各自平行
  // 計算出來、理論上相同但沒有真的互相參照的數字。這次全平台
  // （手機/電腦）都套用同一套「量測.scroller、套用給另外兩個」
  // 的邏輯，不再分desktop/mobile兩條不同的路徑。
  if(window.matchMedia && window.matchMedia("(min-width: 900px)").matches){
    // 電腦上：.scroller先收緊成跟開獎單內容一樣寬（+8px border-box
    // 緩衝，避免冒出不必要的橫向捲軸，原因見下方舊有說明）。
    if(scrollerEl) scrollerEl.style.width = (Math.ceil(panelsW) + 8) + "px";
  }
  // 手機上：上面已經統一重設過，.scroller維持CSS margin:0 14px
  // 自然寬度，不用再另外處理。
  // 不管電腦或手機，套用完.scroller自己的寬度之後，都立刻用
  // getBoundingClientRect()量出它「實際渲染出來」的寬度，這個
  // 數字才是「標準」——header.top／.hero照這個實測數字對齊，
  // 不是拿計算值（panelsW+8）或CSS margin理論上該有的結果直接
  // 當標準，確保三者是真的以開獎單量到的結果為依據。
  const scrollerActualWidth = scrollerEl ? scrollerEl.getBoundingClientRect().width : 0;
  // 使用者確認：首頁目前算出來的0.600802才是標準顯示，不是bug、
  // 不需要「修正」掉——拿掉剛才加的matchMedia限制，讓首頁維持
  // 原本這套動態計算邏輯，不分電腦手機都套用。改成讓抓牌系統去
  // 配合首頁算出來的實際數值，而不是反過來讓首頁遷就抓牌畫面的
  // 固定0.59（見showFullPageImage()裡的對應修改）。
  if(scrollerActualWidth > 0){
    // 使用者要求：這個寬度也不能超過手機螢幕本身的寬度——.scroller
    // 有overflow-x:auto，內容（.panels）比螢幕寬的時候是在.scroller
    // 內部產生捲軸，.scroller自己的外框理論上不會被撐寬過螢幕，但
    // 為了保險（避免任何瀏覽器渲染細節、flex/table版面計算上的
    // 特殊情況，讓量到的寬度不小心超出視窗），套用給header.top／
    // .hero之前，先跟目前的可視寬度（visualViewport優先，比較能
    // 反映手機工具列等因素造成的實際可用寬度）取最小值，確保這兩個
    // 區塊「無論如何」都不會比手機螢幕本身還寬、跑出畫面外側。
    const vv = window.visualViewport;
    const viewportWidthForCap = vv ? vv.width : window.innerWidth;
    const cappedWidth = Math.min(scrollerActualWidth, viewportWidthForCap);
    // 使用者要求三個區塊都要縮小（不是只有header.top／.hero跟著
    // .scroller對齊，連.scroller自己也要一起縮小），所以縮減發生
    // 在算出standardWidthPx「之前」，同一個縮小後的數字最後會
    // 套用給三個區塊，確保三者維持「寬度互相一致」的同時、整體
    // 一起縮小，不是各自分別縮小、可能因為捨入誤差出現落差。
    // 縮減比例原本是10%（0.9），使用者後來改口要求改成5%
    // （0.95）——「改成」是取代，不是疊加在10%上面再縮5%。
    const reducedWidth = cappedWidth * 0.95;
    const standardWidthPx = Math.ceil(reducedWidth) + "px";
    if(headerTopEl) headerTopEl.style.width = standardWidthPx;
    if(heroEl) heroEl.style.width = standardWidthPx;
    if(scrollerEl) scrollerEl.style.width = standardWidthPx;
    if(brandEl) brandEl.style.width = "100%";
    // 使用者要求：開獎單裡的四個區塊，要平均分配「現在（縮小5%後）
    // 的寬度」去顯示資料——.scroller縮小之後，裡面的.panels（4個
    // 區塊組成，各自欄寬都是寫死的px值）維持原本的自然寬度不變，
    // 會比縮小後的.scroller還寬，靠.scroller既有的overflow-x:auto
    // 產生橫向捲軸來看，不是「四個區塊一起等比例縮小、平均塞進
    // 目前的寬度」。這裡額外算一個縮放比例，讓.panels整體再縮小
    // 一次，剛好塞滿.scroller縮小後的可視寬度，不需要橫向捲動，
    // 四個區塊平均分配這個寬度顯示。
    //
    // 算法：量出.panels在目前zoom:0.59之下的自然渲染寬度，跟
    // .scroller縮小後「扣掉左右border之後」的可視內容寬度相除，
    // 算出還要再縮小多少比例，用zoom疊乘在原本的zoom:0.59上面
    // （不是transform:scale()）。
    //
    // ⚠️ 重要教訓：原本用transform:scale()，實測發現往上滑動
    // 開獎單會在開獎單標題那一列「卡住/彈回」，不能繼續往上滑。
    // 原因是transform這個CSS屬性**只影響畫面上看起來的樣子，
    // 不會影響瀏覽器計算的實際版面空間（layout/reflow）**——
    // .panels套用transform:scale()縮小之後，視覺上變小了，但
    // .scroller（父層）還是照.panels「縮放前」的完整高度去
    // 計算自己該有多高，等於在畫面上留下一塊「看不見、但仍然
    // 佔用可捲動空間」的區域，滑動到這塊區域的邊界就會出現
    // 卡住/彈回的異常。**改用zoom縮放（不是transform）**，
    // zoom會真正影響版面計算，.panels縮小多少，.scroller自己
    // 的高度也會跟著等比例縮小，兩者完全一致，不會有「看不見的
    // 空白區域」。
    requestAnimationFrame(function(){
      // 重要：量測.panels自然寬度之前，先把上一次可能殘留的
      // zoom重設回基礎值0.59——不然如果這個函式被重複呼叫（例如
      // 每次buildPanels()重畫都會呼叫一次），量到的會是「上一次
      // 已經縮放過」的寬度，不是真正的自然寬度，會讓縮放比例越
      // 算越誇張、越縮越小（跟先前拖曳功能踩過的同一種bug）。
      panelsElForWidth.style.zoom = "0.59";
      const scrollerBorderWidth = 1.5 * 2; // .scroller的border是1.5px，左右兩側共3px，border-box模式下這3px要從可視寬度裡扣掉才是真正能放內容的空間
      const availableInnerWidth = reducedWidth - scrollerBorderWidth;
      const panelsNaturalWidth = panelsElForWidth.getBoundingClientRect().width;
      if(panelsNaturalWidth > 0 && availableInnerWidth > 0){
        const extraScale = availableInnerWidth / panelsNaturalWidth;
        panelsElForWidth.style.zoom = String(0.59 * extraScale);
      }
    });
  } else {
    // 量不到（極端情況，例如.scroller還沒渲染出來）就清掉行內
    // 樣式，讓CSS原本的margin規則生效，不要留著錯誤的舊數值。
    if(headerTopEl) headerTopEl.style.width = "";
    if(heroEl) heroEl.style.width = "";
    if(brandEl) brandEl.style.width = "";
  }
}

// 使用者截圖回報：電腦上（Google瀏覽器寬螢幕）點「抓」進入抓牌
// 全頁畫面，最上面的九顆工具列按鍵（返回首頁/儲存圖檔/個性調色/
// 分佈/返回/清除/分佈機率/九宮陣列/定期十六）撐滿整個瀏覽器視窗
// 寬度，跟下面貼齊內容寬度的開獎單完全對不齊，右邊多出一大片
// 空白——因為 .draw-toolbar（工具列容器）本身沒有寬度限制，是
// 跟著 .img-overlay（position:fixed; inset:0，滿版覆蓋整個
// 視窗）的寬度走，裡面九顆按鍵用flex:1平分空間，容器多寬按鍵就
// 撐多寬。**這個修正只在電腦螢幕（寬度≥900px）才會執行，手機
// 完全不受影響**，跟 applyDesktopScrollerWidth() 用同一個
// window.matchMedia("(min-width: 900px)") 判斷式、同一組防呆
// 邏輯，維持風格一致。使用者明確要求「跟首頁一樣寬就好」，直接
// 沿用跟首頁 .scroller 同一個目標寬度（#panels 內容寬度＋8px
// 緩衝），用 margin:0 auto 讓工具列在視窗裡置中對齊，不是貼左
// 或貼右。
function applyDesktopMagnifierToolbarWidth(){
  const toolbarEl = document.querySelector(".draw-toolbar");
  if(!toolbarEl) return;
  // 使用者明確要求「不可影響手機上的顯示跟設定」——螢幕寬度低於
  // 900px（含：本來就是手機、或電腦瀏覽器視窗被縮小到900px以下）
  // 的時候，一定要把這裡設定過的行內樣式清乾淨（改回空字串，讓
  // CSS原本的規則生效），不能留著上一次在寬螢幕算出來的寬度值，
  // 不然使用者拿電腦瀏覽器視窗縮小、或手機橫向等窄螢幕情境測試
  // 的時候，會被殘留的舊寬度值錯誤地限制住。
  if(!(window.matchMedia && window.matchMedia("(min-width: 900px)").matches)){
    toolbarEl.style.width = "";
    toolbarEl.style.marginLeft = "";
    toolbarEl.style.marginRight = "";
    return;
  }
  const panelsElForWidth = document.getElementById("panels");
  if(!panelsElForWidth) return;
  const panelsW = panelsElForWidth.getBoundingClientRect().width;
  if(panelsW <= 0) return;
  const targetWidth = Math.ceil(panelsW) + 8;
  toolbarEl.style.width = targetWidth + "px";
  toolbarEl.style.marginLeft = "auto";
  toolbarEl.style.marginRight = "auto";
}

// 抓牌最上面那顆「目前彩券」按鍵（.img-game-tabs）的寬度，原本想用
// JS量測#panels寬度、套用行內樣式去對齊——後來發現真正的bug其實是
// 抓牌第一區「彩券名稱顯示」（.img-game-tabs）的寬度要跟開獎單
// （#panels）一樣寬，高度／位置則要比照首頁「第一區」跟「第二區」
// （header.top跟.hero）之間的實際距離——首頁那邊header.top的
// margin-bottom跟.hero的margin-top都是0，兩者是零間距直接相連的
// （見CSS裡header.top、.hero的margin設定），所以正確的高度不是
// 單獨去量#game-tabs這顆按鍵本身多高，而是「從螢幕最上緣量到
// .hero實際渲染出來的頂部座標」這一整段距離——這段距離天生就等於
// header.top在首頁實際佔用的高度（因為.hero的起始位置本來就是被
// header.top撐出來的），套用這個算法，彩券名稱跟九宮鍵區外框
// （.hint-bar，本身位置也是量.hero算出來的，見applyImgHintBarConnect()）
// 之間會自動變成零間距，不會再「太高、離第二區太遠」。
// .hero在放大鏡模式下用visibility:hidden隱藏（不是display:none），
// 版面位置還在，量得到正確數字；只有「定期」模式才會真的收起版面
// 空間，量不到的話維持原狀，不硬套0進去。
function applyImgGameTabsWidth(retryCount){
  retryCount = retryCount || 0;
  const tabsEl = document.querySelector(".img-game-tabs");
  const panelsElForWidth = document.getElementById("panels");
  const heroElForTabs = document.getElementById("hero");
  if(!tabsEl) return;
  if(!panelsElForWidth || !heroElForTabs) return;
  const panelsRect = panelsElForWidth.getBoundingClientRect();
  const heroRectForTabs = heroElForTabs.getBoundingClientRect();
  if(panelsRect.width <= 0 || heroRectForTabs.top <= 0){
    if(retryCount < 5){
      requestAnimationFrame(function(){ applyImgGameTabsWidth(retryCount + 1); });
    }
    return;
  }
  tabsEl.style.setProperty("position", "fixed", "important");
  tabsEl.style.setProperty("left", Math.round(panelsRect.left) + "px", "important");
  tabsEl.style.setProperty("top", "0px", "important");
  tabsEl.style.setProperty("width", Math.round(panelsRect.width) + "px", "important");
  tabsEl.style.setProperty("height", Math.round(heroRectForTabs.top) + "px", "important");
  tabsEl.style.setProperty("margin", "0", "important");
}

// 九宮鍵區外框（.hint-bar）也要跟開獎單一樣寬，而且「上面不動、
// 底部延伸向下跟開獎單連接在一起」——跟首頁.hero／.scroller零間距
// 緊貼的做法（margin:0 14px 0，中間完全沒有間距）不同的地方是：
// 首頁那三個區塊都在同一份正常文件流裡，零margin天生就會貼在一起；
// 但抓牌畫面的.hint-bar是在position:fixed的.img-overlay裡面，
// #panels本身是首頁原本那份、不在.img-overlay裡，兩者不是同一個
// 文件流的相鄰元素，光靠CSS margin:0沒辦法讓它們真的貼齊——要用
// JS實際量出兩者在螢幕上的座標，把.hint-bar的高度動態撐到「剛好
// 讓它的下邊界對齊#panels的上邊界」，才會是真正無縫連接、不是
// 兩個各自獨立、剛好看起來靠近的區塊。
// .hint-bar上面的.img-game-tabs（彩券按鍵）維持原本位置不動，只
// 動.hint-bar自己的高度（往下撐），符合「上面不動、底部往下延伸」
// 的要求。
// 九宮鍵區外框（.hint-bar）左邊界不動，右邊界要延伸到跟開獎單的
// 右邊界切齊，而且底部要延伸向下跟開獎單無縫連接——這兩件事都要
// 用JS實際量出螢幕座標才能做到，光靠CSS margin/width算不出來：
// 1) 左邊界維持CSS原本margin-left:14px !important算出來的位置，
//    不去動它；
// 2) 右邊界＝量出#panels目前實際的右邊界screen座標（getBoundingClient
//    Rect().right），減掉.hint-bar左邊界座標，算出需要的寬度，讓
//    右邊界剛好落在#panels右邊界上；
// 3) .hint-bar是在position:fixed的.img-overlay裡面，#panels是
//    首頁原本那份、不在.img-overlay裡，兩者不是同一個文件流的
//    相鄰元素，所以底部連接跟寬度一樣都要用JS量座標算，不能只
//    靠CSS margin/width。
// 這裡改用 style.setProperty(prop, value, "important") 而不是
// 單純的 style.width = ... ——因為CSS那邊.img-overlay .hint-bar
// 的width/margin-right已經寫了!important，普通的行內樣式（沒有
// important）贏不過帶!important的stylesheet規則，之前就是卡在
// 這裡，套用了也沒生效。用setProperty的第三個參數強制加上
// important，行內樣式的important天生比stylesheet的important
// 優先權更高，這樣才能真的覆蓋過去。
// .hint-bar上面的.img-game-tabs（彩券按鍵）維持原本位置不動，只
// 動.hint-bar自己的寬度／高度，符合「上面不動」的要求。
// 九宮鍵區外框（.hint-bar）的位置跟大小，直接抓首頁「第二區」
// 最新開獎號碼區（.hero，id="hero"）目前真正渲染出來的座標/尺寸，
// 原封不動套用過去——不再自己重新計算/推算。之前試過很多種算法
// （量開獎單寬度、算連接高度……）都沒有達到預期效果，既然.hero
// 本身在首頁已經確認顯示正確，直接複製它的座標最可靠、不會再有
// 計算過程中的落差。
// 關鍵前提：.hero在放大鏡模式下用visibility:hidden（不是
// display:none）隱藏，visibility:hidden的元素還是保有版面位置，
// getBoundingClientRect()量得到正確數字；只有「定期」模式
// （body.recent-only-mode）才會把.hero改成display:none真的收起
// 版面空間，這種情況量到的寬高會是0，量不到的時候維持原本
// （不去改動)，不會硬套一個0進去。
// .hint-bar本身不是position:fixed（是.img-overlay這個fixed容器
// 底下、flex排版出來的一個區塊），這裡改成直接用position:fixed
// 搭配量到的left/top/width/height，讓它的座標跟.hero完全一致，
// 不再受.img-overlay自己的flex排版邏輯影響。
// 使用者要求：進入抓牌系統時，開獎單外框（.scroller）維持固定
// 不動，裡面所有內容（含文字表格）由左向右寬度增加，增加到「第四
// 排（第四區塊）第五號（最後一欄號碼）」的右邊格線，剛好緊貼外框
// 內側為準——「第四區塊最後一欄號碼」本來就是.panels整體內容的
// 最右緣（.panels是display:flex排列4個區塊，最後一欄號碼理所
// 當然就是整個.panels的右邊界），改成直接用.panels整體的
// getBoundingClientRect()右邊界去對齊，不用另外找特定的表格
// 儲存格——第一版曾經去找「第四區塊最後一欄的那個td.num」，實測
// 算出來的縮放比例誇張過頭（內容整個爆版），懷疑是選擇器選到
// 不如預期的格子、量出異常小的距離，導致除出來的比例失真；改用
// .panels本身的右邊界，量測對象單純、不依賴巢狀選擇器，結果更
// 穩定可靠：
// 1. 先把.panels的zoom重設回基礎值0.59，量出.panels目前的左／
//    右邊界screen座標（zoom是從左上角開始擴張，左邊界是不動的
//    錨點）。
// 2. 量出.scroller的右邊界，扣掉border寬度算出「內側」的座標，
//    這是我們要讓內容右邊界貼齊的目標位置。
// 3. 用「目標內側座標」跟「.panels目前右邊界」相對於左邊界的
//    距離比例，反推出需要多少縮放倍率，才能讓右邊界剛好落在
//    目標位置上。
function applyMagnifierContentZoomToFrame(retryCount){
  retryCount = retryCount || 0;
  if(!panels || !scrollerEl) return;
  panels.style.zoom = "0.59";
  const panelsRect = panels.getBoundingClientRect();
  const scrollerRect = scrollerEl.getBoundingClientRect();
  // 排版時機問題：量不到（寬度是0）的時候用requestAnimationFrame
  // 重試，最多5次，不要直接放棄。
  if(panelsRect.width <= 0 || scrollerRect.width <= 0){
    if(retryCount < 5){
      requestAnimationFrame(function(){ applyMagnifierContentZoomToFrame(retryCount + 1); });
    }
    return;
  }
  // .scroller的border是1.5px，內側邊界要扣掉這一段厚度。
  const scrollerInnerRight = scrollerRect.right - 1.5;
  const panelsLeft = panelsRect.left;
  const currentRight = panelsRect.right;
  const targetSpan = scrollerInnerRight - panelsLeft; // 目標：從.panels左邊界到外框內側的距離
  const currentSpan = currentRight - panelsLeft; // 目前：從.panels左邊界到.panels自己右邊界的距離
  if(currentSpan > 0 && targetSpan > 0){
    const neededZoom = 0.59 * (targetSpan / currentSpan);
    panels.style.zoom = String(neededZoom);
  }
}


function applyImgHintBarConnect(retryCount){
  retryCount = retryCount || 0;
  const hintEl = document.getElementById("img-hint");
  const heroEl = document.getElementById("hero");
  if(!hintEl) return;
  if(!heroEl) return;
  const heroRect = heroEl.getBoundingClientRect();
  // 排版時機問題，或「定期」模式下.hero是display:none量不到寬度：
  // 這兩種情況都不要硬套0進去，維持目前的樣子，一般情況下用
  // requestAnimationFrame重試，最多5次。
  if(heroRect.width <= 0 || heroRect.height <= 0){
    if(retryCount < 5){
      requestAnimationFrame(function(){ applyImgHintBarConnect(retryCount + 1); });
    }
    return;
  }
  // 使用者回報：放大後開獎單右邊緣還是會從九宮鍵背後透出來。原因：
  // 上面這段一直沒被套用的舊註解，描述的是「右邊界要延伸到跟
  // #panels實際右邊界切齊」，但下面實際的程式碼一直只是原封不動
  // 複製.hero自己的寬度（Math.round(heroRect.width)），從來沒有
  // 真的做這個延伸計算——.hero本身的寬度沒有涵蓋到開獎單完整內容
  // 的最右邊，導致.hint-bar的右邊界跟著也不夠寬，右側才會透出
  // 底下的開獎單。這裡補上缺失的延伸邏輯：量出#panels目前實際的
  // 右邊界screen座標，跟.hero左邊界的距離，取兩者之間較大的寬度
  // （避免.panels量不到或比.hero還窄的極端情況，回退成用.hero
  // 寬度，不會比原本更差）。
  const panelsElForHint = document.getElementById("panels");
  let hintWidth = heroRect.width;
  if(panelsElForHint){
    const panelsRectForHint = panelsElForHint.getBoundingClientRect();
    if(panelsRectForHint.width > 0){
      const extendedWidth = panelsRectForHint.right - heroRect.left;
      if(extendedWidth > hintWidth) hintWidth = extendedWidth;
    }
  }
  hintEl.style.setProperty("position", "fixed", "important");
  hintEl.style.setProperty("left", Math.round(heroRect.left) + "px", "important");
  hintEl.style.setProperty("top", Math.round(heroRect.top) + "px", "important");
  // 使用者回報：九宮鍵框不該跟著兩指縮放一起放大——.hero本身在
  // #page-zoom-wrap裡面，會被pageZoom這個transform:scale()放大，
  // getBoundingClientRect()量到的heroRect.width/height，本來就是
  // 「已經被pageZoom放大過」的螢幕像素值。.img-hint不在
  // #page-zoom-wrap裡面（不受transform影響），如果直接把這個已經
  // 放大過的數字設成.img-hint自己的CSS width/height，等於是又把
  // 這個放大的尺寸「烙印」進去，造成.img-hint看起來也跟著放大了
  // ——跟其他浮動的釘選按鍵（.pin-btn，維持固定大小不隨縮放變動）
  // 的預期行為不一致。修法：最後設定CSS width/height之前，除以
  // 目前的pageZoom倍率，換算回「原始、未被放大過」的自然尺寸，
  // 這樣.img-hint的實際渲染大小才會維持固定，不會跟著兩指縮放
  // 變大。（left/top不用做這個換算——位置本來就應該跟著
  // .hero目前實際的螢幕座標走，只有「大小」不該被放大。）
  const hintWidthNormalized = hintWidth / pageZoom;
  const hintHeightNormalized = heroRect.height / pageZoom;
  hintEl.style.setProperty("width", Math.round(hintWidthNormalized) + "px", "important");
  hintEl.style.setProperty("height", Math.round(hintHeightNormalized) + "px", "important");
  hintEl.style.setProperty("margin", "0", "important");
  // 背景包裹層跟.img-hint同步上下範圍（top/height一致），左右則是
  // 固定的0/right:0（CSS已經寫死，這裡不用再設），確保卡片外側
  // 兩側都有背景鋪底、不會透出開獎單。
  const hintBgWrapEl = document.getElementById("hint-bar-bg-wrap");
  if(hintBgWrapEl){
    hintBgWrapEl.style.top = Math.round(heroRect.top) + "px";
    hintBgWrapEl.style.height = Math.round(hintHeightNormalized) + "px";
  }
}

// 六合彩官方的號碼顏色分類（紅/藍/綠三色），49個號碼固定分組，
// 每次攪珠這個對應關係都不會變（不是隨開獎結果變動的東西，是
// 香港賽馬會官方定義好的固定規則）。使用者要求「六合彩跟大樂透
// 比照六合彩官方」，兩種玩法的最新開獎號碼球都套用這個規則——
// 539/天天樂經查證沒有找到官方顏色分類規則，使用者確認維持
// 現在統一的綠圈紅字樣式，不套用這個函式。
// 分組依據（官方公開資料）：
//   紅色（17個）：1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46
//   藍色（16個）：3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48
//   綠色（16個）：5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49
const MARK_SIX_RED_SET = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
const MARK_SIX_BLUE_SET = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
function getMarkSixBallColor(n){
  if(MARK_SIX_RED_SET.has(n)) return "ball-red";
  if(MARK_SIX_BLUE_SET.has(n)) return "ball-blue";
  return "ball-green"; // 剩下的都是綠色，不用另外存一份綠色清單
}

function buildPanels(all, blanksCount){
  const sortedAsc = all.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  const shownCount = TOTAL_CELLS - blanksCount;
  const shown = sortedAsc.slice(-shownCount);
  const lastDate = shown.length ? shown[shown.length-1].date : new Date().toISOString().slice(0,10);
  // 539不開獎星期日，空白列要跳過星期日；天天樂每天都開獎（含星期日），
  // 空白列不用跳過；六合彩固定星期二四六開獎，大樂透固定星期二五
  // 開獎，空白列照各自實際的開獎星期去預留，不是每天都算一格。
  let allowedWeekdays = null; // null代表不限制（天天樂：每天都算）
  if(currentGameKey === "539") allowedWeekdays = [1,2,3,4,5,6]; // 跳過星期日(0)
  else if(currentGameKey === "mark6") allowedWeekdays = [2,4,6]; // 二四六
  else if(currentGameKey === "lotto") allowedWeekdays = [2,5]; // 二五
  const future = futureSlots(lastDate, blanksCount, allowedWeekdays);
  const slots = shown.concat(future);
  dateOrdinalMap = {};
  slots.forEach(function(r, i){ dateOrdinalMap[r.date] = i; });

  const panelsEl = document.getElementById("panels");
  panelsEl.innerHTML = "";
  const gameLabel = GAME_LABELS[currentGameKey] || currentGameKey;
  const overlayTitleEl = document.querySelector(".img-overlay-title");
  if(overlayTitleEl) overlayTitleEl.textContent = gameLabel;
  // 六合彩／大樂透是7欄（6號碼+特別號），這個class驅動對應的欄寬
  // 縮窄規則（見CSS的 body.game-wide table.road td.num），跟
  // body.game-daily 是同樣的模式——一個開關、對應一組CSS覆蓋規則。
  document.body.classList.toggle("game-wide", isWideGame());
  // 使用者要求最新開獎號碼球的顏色四種玩法各自不同（六合彩藍球紅
  // 特別號、大樂透綠球、天天樂綠球、539維持原本紅球），game-wide
  // 這個class沒辦法區分六合彩跟大樂透兩者，額外加 game-mark6／
  // game-lotto 這兩個各自獨立的class，讓CSS可以個別覆蓋每種玩法
  // 的球體顏色，不會互相影響。
  document.body.classList.toggle("game-mark6", currentGameKey === "mark6");
  document.body.classList.toggle("game-lotto", currentGameKey === "lotto");

  // 月份分隔線是不是要畫，改成用「這一列的月份，跟上一列的月份
  // 是不是不一樣」來判斷，不是單純看「這一列的日期是不是1號」——
  // 六合彩／大樂透不是每天開獎，月初1號那天不一定剛好是開獎日，
  // 原本只看「日期是1號」的寫法，會導致有些月份交界完全沒有1號
  // 這一列、抓不到，分隔線就沒有出現。用「跟前一列比較月份」
  // 的寫法，不管1號有沒有開獎，只要月份真的換了，就找得到那條
  // 分界線該畫在哪一列。這個變數要跨越4個區塊（PANELS迴圈）一路
  // 累計比對，不能每個區塊各自歸零重新算，不然區塊之間銜接的地方
  // 會判斷錯誤。
  let prevMonthKey = null;

  for(let p=0; p<PANELS; p++){
    const chunk = slots.slice(p*ROWS_PER_PANEL, (p+1)*ROWS_PER_PANEL);

    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = '<div class="panel-head">' + gameLabel + '</div>';

    const table = document.createElement("table");
    table.className = "road";
    table.innerHTML = isWideGame()
      ? '<colgroup>' +
          '<col style="width:16.22px">' +
          '<col style="width:11.89px">' +
          '<col style="width:20.09px"><col style="width:20.09px"><col style="width:20.09px"><col style="width:20.09px"><col style="width:20.09px"><col style="width:20.09px">' +
          '<col style="width:20.09px; background:#fff8e0;">' +
        '</colgroup>'
      : '<colgroup>' +
          '<col style="width:16.22px">' +
          '<col style="width:11.89px">' +
          '<col style="width:28.12px"><col style="width:28.12px"><col style="width:28.12px"><col style="width:28.12px"><col style="width:28.12px">' +
        '</colgroup>';

    chunk.forEach(function(r){
      const tr = document.createElement("tr");
      tr.dataset.date = r.date;
      const wdNum = WD_INDEX[r.weekday];
      // 六合彩／大樂透的星期一不需要特殊顯示，跟星期二用同一套普通
      // 樣式（不特別標記），所以這裡多加 !isWideGame() 這個條件——
      // 539／天天樂維持原樣不受影響。
      const isMon = wdNum === 1 && !isWideGame();
      const isFuture = r.numbers === null;
      if(isFuture) tr.classList.add("future");

      const dayNum = parseInt(dayOf(r.date), 10);
      // 粗分隔線的判斷邏輯，六合彩／大樂透跟539／天天樂是兩套不同
      // 規則：
      // - 六合彩／大樂透（isWideGame()）：維持「月份分隔線」，跟上
      //   一列比較月份是否換了（不是單純看這一列是不是1號，避免
      //   「1號剛好不開獎」的月份分隔線消失的問題）
      // - 539／天天樂：使用者要求改成「星期分隔線」，每個星期一
      //   那一列標記——直接看這一列的星期是不是「一」，不用比較
      //   上一列（539不開獎星期日，星期一前面銜接的是星期六，沒有
      //   「星期日」這一列可以比較，所以不用「跟上一列比較」這種
      //   寫法，單純看目前這一列是不是星期一最直接可靠）
      if(isWideGame()){
        const monthKey = r.date.slice(0, 7); // "YYYY-MM"
        if(prevMonthKey !== null && monthKey !== prevMonthKey){
          tr.classList.add("month-start");
        }
        prevMonthKey = monthKey;
      } else if(r.weekday === "一"){
        tr.classList.add("month-start");
      }
      let dayHtml;
      if(dayNum === 1){
        dayHtml = '<td class="day first-of-month"><span class="fom cell-shift">' + monthOf(r.date) + '/' + (monthOf(r.date) >= 10 ? '1' : '01') + '</span></td>';
      } else {
        dayHtml = '<td class="day"><span class="cell-shift">' + dayOf(r.date) + '</span></td>';
      }

      let numsHtml;
      if(isWideGame()){
        // 6號碼＋1特別號：跟539／天天樂的5號碼格子共用同一套
        // .num／.cell-shift樣式，特別號那格另外加一個 .special
        // class 做顏色區隔（金色系底色，跟六大功能/浮動鍵的配色
        // 呼應），不是另外做一套全新樣式。
        if(isFuture){
          numsHtml = '<td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending special">&nbsp;</td>';
        } else {
          numsHtml = r.numbers.map(function(n){ return '<td class="num"><span class="cell-shift">' + String(n).padStart(2,"0") + '</span></td>'; }).join("")
            + '<td class="num special"><span class="cell-shift">' + String(r.special).padStart(2,"0") + '</span></td>';
        }
      } else {
        numsHtml = isFuture
          ? '<td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td><td class="num pending">&nbsp;</td>'
          : r.numbers.map(function(n){ return '<td class="num"><span class="cell-shift">' + String(n).padStart(2,"0") + '</span></td>'; }).join("");
      }

      if(!isFuture) tr.dataset.numbers = r.numbers.join(",") + (isWideGame() ? ("," + r.special) : "");

      tr.innerHTML = dayHtml +
        '<td class="wd' + (isMon?' mon-cell':'') + '"><div class="badge cell-shift' + (isMon?' mon':'') + '">' + r.weekday + '</div></td>' +
        numsHtml;

      table.appendChild(tr);
    });

    panel.appendChild(table);
    panelsEl.appendChild(panel);
  }

  const latest = shown.length ? shown[shown.length-1] : null;
  const heroDateEl = document.getElementById("hero-date");
  const heroBallsEl = document.getElementById("hero-balls");
  heroDateEl.textContent = latest ? (latest.date.replace(/-/g,"/") + " (星期" + latest.weekday + ")") : "—";
  if(latest && isWideGame()){
    // 使用者最新要求：所有玩法的最新開獎號碼球，通通固定套用同一套
    // 配色，不再依照號碼分類——一般號碼固定紅色彩球+綠色數字
    // （`.ball`基礎樣式），特別號固定藍色彩球+紅色數字
    // （`.ball-special`）。原本比照六合彩官方紅/藍/綠三色分類的
    // getMarkSixBallColor()邏輯已經不再使用（函式還留著沒刪，只是
    // 這裡不再呼叫，因為不再需要依號碼判斷顏色）。
    heroBallsEl.innerHTML = latest.numbers.map(function(n){
      return '<div class="ball">' + String(n).padStart(2,"0") + '</div>';
    }).join("")
      + '<div class="ball ball-special">' + String(latest.special).padStart(2,"0") + '</div>';
  } else {
    heroBallsEl.innerHTML = latest
      ? latest.numbers.map(function(n){ return '<div class="ball">' + String(n).padStart(2,"0") + '</div>'; }).join("")
      : "";
  }
  // 上面日期星期那排的總寬度，要跟下面最新開獎號碼那排的總寬度一樣
  // 寬。號碼球有固定的直徑（要維持辨識度，不能為了對齊寬度就縮小），
  // 所以反過來做：量出號碼球那排實際佔的寬度（5顆球+間距，不受這裡
  // 影響，維持原本大小），把日期文字的容器寬度設成跟它一樣，日期
  // 文字本身靠左顯示在這個寬度裡——這樣兩排的「總寬度」（外框寬度）
  // 會一致，又不會把號碼球擠壓變形或換行。
  // 頂部4個按鍵那排（.brand）跟「最新開獎」外框（.hero）本來是跟著
  // 螢幕寬度走的（滿版），現在改成量出開獎單本身（#panels）實際
  // 渲染出來的寬度，把這兩個外框的寬度都縮到跟開獎單一樣寬，不再
  // 滿版——這樣首頁最上面兩塊區域的寬度會跟下面表格的寬度對齊一致。
  requestAnimationFrame(function(){
    if(latest) heroDateEl.style.width = heroBallsEl.offsetWidth + "px";
    // 2026-08-11：整個「印/調整期數/抓」的版面改成新設計（日期+球
    // 在上，三個放大方塊同一列並排在下，比照使用者提供的參考
    // 截圖），舊版「左右並排＋JS動態鎖高」那一整套機制
    // （heroLeftEl/heroRightEl/heroScaleEl的reset、
    // HERO_PAD_BOOST_RATIO的padding-bottom加成）已經不再適用，
    // 一併移除。新版面完全用固定寫死的CSS數值（字體/padding/
    // border都是固定px值，不是JS動態計算），.hero本身用
    // flex-direction:column讓兩個區塊（日期+球、控制列）自然堆疊，
    // 高度由內容自然決定、穩定固定，不需要額外的JS介入去鎖定或
    // 縮放——這個新版面實際渲染出來的高度，就是之後要遵守的鎖定
    // 基準（見上方CSS裡 .hero 開頭的警示註解）。
    applyDesktopScrollerWidth();
    // 首頁整個畫面置中，跟上面的邏輯用同一個觸發時機（初次載入、
    // 切換玩法之後版面重新排好的時候）。
    requestAnimationFrame(function(){ centerHomepageWrap(); });
    // 使用者要求：開獎單下方的空白留白，縮減到開獎單本身高度的2%
    // ——不分電腦/手機，全平台都套用（跟上面只在電腦生效的
    // applyDesktopScrollerWidth()不一樣，這個沒有window.matchMedia
    // 的判斷式）。原本body的padding-bottom是寫死的24.7px固定值，
    // 改成動態量出#panels（開獎單內容）目前的實際高度，乘上2%，
    // 取代寫死的固定值——開獎單越高，底部留白也會跟著等比例微調，
    // 不會是一個跟內容高度脫鉤、可能顯得太多或太少的固定數字。
    const panelsHeightForBottomGap = panelsEl.getBoundingClientRect().height;
    if(panelsHeightForBottomGap > 0){
      document.body.style.paddingBottom = Math.round(panelsHeightForBottomGap * 0.02) + "px";
    }
  });

  document.getElementById("blank-count").textContent = blanksCount;
  document.getElementById("blank-minus").disabled = blanksCount <= BLANK_MIN;
  document.getElementById("blank-plus").disabled = blanksCount >= BLANK_MAX;
}

function setupGameTabs(){
  const tabs = document.getElementById("game-tabs");
  if(!tabs) return;
  const content539 = document.getElementById("game-539-content");
  const comingSoon = document.getElementById("game-coming-soon");
  const comingSoonTitle = document.getElementById("game-coming-soon-title");

  tabs.addEventListener("click", function(e){
    const btn = e.target.closest("button[data-game]");
    if(!btn) return;
    const game = btn.dataset.game;
    speakGameName(game);

    tabs.querySelectorAll("button[data-game]").forEach(function(b){
      const isActive = b === btn;
      b.classList.toggle("active", isActive);
      b.setAttribute("aria-pressed", isActive ? "true" : "false");
    });

    if(game === "539" || game === "daily" || game === "mark6" || game === "lotto"){
      // 天天樂、六合彩、大樂透都是整套從539複製過去的，共用同一套
      // 表格/hero/預留期數/抓牌畫面，只是切換「現在讀哪一份資料、
      // 標題顯示哪個名字」（六合彩、大樂透還多一欄特別號，見
      // isWideGame() 那組判斷）。標記（一~四招）是各玩法各自獨立
      // 的，切換分頁不可以沿用對方的標記：先把「現在正要離開」的
      // 玩法的標記狀態存起來，再把「現在正要切過去」的玩法上次存
      // 的標記狀態讀回來。
      if(typeof window.__saveGameMarkState === "function") window.__saveGameMarkState(currentGameKey);
      // 「調整期數」也是各玩法各自獨立的，切換分頁不可以沿用對方
      // 的期數：先把「現在正要離開」的玩法目前的期數存起來，再把
      // 「現在正要切過去」的玩法上次存的期數讀回來（第一次切過去
      // 還沒存過的話用 BLANK_DEFAULT）。
      gameBlanksStash[currentGameKey] = currentBlanks;
      currentGameKey = game;
      currentBlanks = (gameBlanksStash[currentGameKey] !== undefined) ? gameBlanksStash[currentGameKey] : BLANK_DEFAULT;
      if(typeof window.__loadGameMarkState === "function") window.__loadGameMarkState(currentGameKey);
      // body 加減 game-daily 這個 class，目前已經沒有對應的 CSS
      // 覆蓋規則了（天天樂號碼球顯示改成跟539一致，不再用顏色區分），
      // 保留這個切換只是留著一個掛勾，之後如果想再用 class 做其他
      // 玩法區隔可以直接用，不影響現在的顯示。
      document.body.classList.toggle("game-daily", game === "daily");
      content539.style.display = "";
      comingSoon.style.display = "none";
      if(game === "539"){
        currentAllData = data539Cache || EMBEDDED_DATA;
      } else if(game === "daily"){
        currentAllData = EMBEDDED_DAILY_DATA;
      } else if(game === "mark6"){
        currentAllData = EMBEDDED_MARK6_DATA;
      } else {
        currentAllData = EMBEDDED_LOTTO_DATA;
      }
      buildPanels(currentAllData, currentBlanks);
      if(typeof window.__reapplyNumPicked === "function") window.__reapplyNumPicked();
      if(typeof window.__reapplyMagnifierState === "function") window.__reapplyMagnifierState();
    } else {
      content539.style.display = "none";
      comingSoonTitle.textContent = (GAME_LABELS[game] || game) + " 開發中";
      comingSoon.style.display = "block";
    }
  });
}

function setupStepper(){
  const minusBtn = document.getElementById("blank-minus");
  const plusBtn = document.getElementById("blank-plus");
  minusBtn.addEventListener("click", function(){
