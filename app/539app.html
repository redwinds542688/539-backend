    if(currentBlanks > BLANK_MIN){ currentBlanks--; if(currentAllData) buildPanels(currentAllData, currentBlanks); }
  });
  plusBtn.addEventListener("click", function(){
    if(currentBlanks < BLANK_MAX){ currentBlanks++; if(currentAllData) buildPanels(currentAllData, currentBlanks); }
  });
}

function setupImageView(){
  const btn = document.getElementById("img-view-btn");
  const overlay = document.getElementById("img-overlay");
  const view = document.getElementById("img-view");
  const closeBtn = document.getElementById("img-close");
  const hintBar = document.getElementById("img-hint");
  const panels = document.getElementById("panels");
  const broadBtn = document.getElementById("draw-broad");
  const backBtn = document.getElementById("draw-back");
  const saveBtn = document.getElementById("draw-save");
  const clearBtn = document.getElementById("draw-clear");
  const paletteBtn = document.getElementById("draw-palette");
  const palettePanel = document.getElementById("palette-panel");

  const DEFAULT_HINT = "連續點選同一個號碼兩下即可指定號碼，再按「廣泛」標記整張開獎單裡相同的號碼。";

  // pickedPaths：每次「連點兩下」指定的那一格，用「第幾區塊/第幾列/第幾欄」記錄位置，
  // 而不是直接存 DOM 節點，因為 clone 每次重繪（開啟放大鏡、resize）都是全新節點。
  // broadened 為 true 之後，改成用「號碼數值」比對，讓全頁面所有相同號碼都亮起。
  let pickedPaths = [];     // [{number, date, cellIndex}]
  let broadened = false;    // 是否已按過「廣泛」
  let historyStack = [];    // 每個動作前的狀態快照，供「返回」還原

  function normalizedNum(el){
    return (el.textContent || "").replace(/\u00A0/g, "").trim();
  }

  function pathOf(td){
    const tr = td.closest("tr");
    return {
      date: tr ? (tr.dataset.date || "") : "",
      cellIndex: Array.prototype.indexOf.call(tr.children, td),
    };
  }

  function cellAtPath(clone, path){
    if(!path || !path.date) return null;
    // 直接用日期去找那一排，不管這個日期現在畫面上實際落在哪個
    // 區塊/第幾排（會隨預留期數變動），用 querySelector 動態找，
    // 永遠找得到目前正確的位置。
    const tr = clone.querySelector('tr[data-date="' + path.date + '"]');
    if(!tr) return null;
    return tr.children[path.cellIndex] || null;
  }

  let connections = []; // 標記第三招：已建立的連接線 [{aPath,bPath,aKey,bKey}]

  function snapshot(){
    return { pickedPaths: pickedPaths.slice(), broadened: broadened, connections: connections.slice() };
  }

  function pushHistory(){
    historyStack.push(snapshot());
  }

  // 把目前的標記狀態套用到畫面上：還沒按「廣泛」之前，只標記實際被點過的那幾格；
  // 按過「廣泛」之後，改成標記全頁面所有相同號碼的格子。
  // 現在直接套用在首頁那份真正的開獎單（panels）上，不再是另外複製出來的節點。
  function applyMarksToClone(){
    const clone = panels;
    if(!clone) return;

    clone.querySelectorAll("td.num.num-marked").forEach(function(td){
      td.classList.remove("num-marked", "num-marked-drag", "num-marked-click");
    });

    if(broadened){
      // 「廣泛」是依號碼比對，不是依格子，所以顏色也要依號碼決定：
      // 一、二招現在是各自獨立的紀錄，同一個號碼可能同時有第一招、
      // 第二招兩筆——兩者要同時顯示、互不干擾，所以分開判斷各自
      // 是否成立，各自加上對應的class（不是互斥、可以同時存在）。
      const dragNumbers = {};
      const clickNumbers = {};
      pickedPaths.forEach(function(p){
        if(p.via === "drag") dragNumbers[p.number] = true;
        else clickNumbers[p.number] = true;
      });
      const numbers = {};
      pickedPaths.forEach(function(p){ numbers[p.number] = true; });
      clone.querySelectorAll("td.num").forEach(function(td){
        if(td.classList.contains("pending")) return;
        const n = normalizedNum(td);
        if(numbers[n]){
          td.classList.add("num-marked");
          if(dragNumbers[n]) td.classList.add("num-marked-drag");
          if(clickNumbers[n]) td.classList.add("num-marked-click");
        }
      });
    } else {
      // 不廣泛時依「格子」比對：同一格可能同時有第一招、第二招兩筆
      // 各自獨立的紀錄，用pathKey去重只套用一次num-marked，但
      // num-marked-click／num-marked-drag分開判斷、各自加上，兩者
      // 同時成立時會同時顯示（圓形＋方形疊加），互不覆蓋。
      const dragKeys = {};
      const clickKeys = {};
      pickedPaths.forEach(function(p){
        const k = pathKey(p);
        if(p.via === "drag") dragKeys[k] = true;
        else clickKeys[k] = true;
      });
      const appliedKeys = {};
      pickedPaths.forEach(function(p){
        const k = pathKey(p);
        if(appliedKeys[k]) return;
        appliedKeys[k] = true;
        const td = cellAtPath(clone, p);
        if(td){
          td.classList.add("num-marked");
          if(dragKeys[k]) td.classList.add("num-marked-drag");
          if(clickKeys[k]) td.classList.add("num-marked-click");
        }
      });
    }

    renderConnections();
  }

  // 標記第三招：兩個「已經是指定號碼」的格子之間畫一條連接線，用調色盤的
  // 線色。只要A或B其中一個不再是指定號碼，連接線就跟著自動消失
  // （每次 applyMarksToClone 都會重新檢查、清掉失效的連接線）。
  const CONNECT_SVG_NS = "http://www.w3.org/2000/svg";

  // 直接用「手指實際觸控到的螢幕座標」畫線，不用换算開獎單本身疊了
  // 幾層縮放（首頁的 zoom:0.59、放大鏡兩指縮放、「定期」模式的
  // transform 縮放…）——getBoundingClientRect() 量到的一律都是螢幕上
  // 最終、真正看到的位置，不管疊了幾層縮放都一樣準，不需要再自己
  // 反推任何倍率。
  function cellScreenRect(td){
    const r = td.getBoundingClientRect();
    return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, halfW: r.width / 2, halfH: r.height / 2 };
  }

  // 從矩形中心往 (dx,dy) 方向射出一條線，算出這條線碰到矩形外框的那個點——
  // 讓連接線只畫到格子邊緣，不會整條線壓在號碼文字上面。
  function rectEdgePoint(rect, dx, dy){
    if(dx === 0 && dy === 0) return { x: rect.cx, y: rect.cy };
    const scaleX = dx !== 0 ? Math.abs(rect.halfW / dx) : Infinity;
    const scaleY = dy !== 0 ? Math.abs(rect.halfH / dy) : Infinity;
    const scale = Math.min(scaleX, scaleY);
    return { x: rect.cx + dx * scale, y: rect.cy + dy * scale };
  }

  function renderConnections(){
    const clone = panels;
    if(!clone) return;

    // 先過濾掉A或B已經不再是指定號碼的連接線
    connections = connections.filter(function(c){
      const tdA = cellAtPath(clone, c.aPath);
      const tdB = cellAtPath(clone, c.bPath);
      return tdA && tdB && tdA.classList.contains("num-marked") && tdB.classList.contains("num-marked");
    });

    // SVG 蓋在整個螢幕上面（position:fixed，不是跟著開獎單縮放），
    // 掛在 body 上、不是掛在 panels 底下，才不會被任何縮放/裁切影響。
    let svg = document.getElementById("connect-svg");
    if(!svg){
      svg = document.createElementNS(CONNECT_SVG_NS, "svg");
      svg.id = "connect-svg";
      svg.style.position = "fixed";
      svg.style.top = "0";
      svg.style.left = "0";
      svg.style.width = "100vw";
      svg.style.height = "100vh";
      svg.style.overflow = "visible";
      svg.style.pointerEvents = "none";
      svg.style.zIndex = "998"; // 比放大鏡工具列（999）低一點，但蓋在開獎單上面
      document.body.appendChild(svg);
    }
    svg.innerHTML = "";

    // 連接線粗細要跟著螢幕上實際的縮放程度同步縮放，不能是固定死的
    // 像素值——不然開獎單縮小的時候，線的粗細沒有跟著變小，看起來
    // 反而變得不成比例的粗。做法：拿 td.num 目前實際渲染出來的寬度，
    // 跟它在 CSS 裡定義、完全沒有縮放（scale=1）時的寬度（28.12px）
    // 比較，算出「現在畫面上到底放大/縮小了多少倍」，再用這個倍率
    // 去換算粗細。4.5 這個原本寫死的粗細值，是在目前預設的縮放狀態
    // （首頁 .panels 的 zoom:0.59，沒有另外疊加放大鏡兩指縮放或
     // 「定期」模式的縮放）下調出來的，所以先換算成「完全沒有縮放時
    // 應該多粗」當基準（4.5 / 0.59），再乘上當下量到的實際縮放倍率。
    const NATURAL_CELL_WIDTH = 28.12; // table.road td.num 在 CSS 裡定義的原始寬度
    const BASE_STROKE_AT_SCALE1 = (4.5 / 0.59) * 0.25; // 粗細累計減少50%→再50%，共75%

    connections.forEach(function(c){
      const tdA = cellAtPath(clone, c.aPath);
      const tdB = cellAtPath(clone, c.bPath);
      if(!tdA || !tdB) return;
      const sameRowDates = c.aPath.date === c.bPath.date;
      // 同排的連接線，如果這一排已經有第二招（滑動）標記的紀錄，
      // 直接整條線都不畫、不做任何動作（不退回直線，單純跳過），
      // 避免線疊在整排的方形底色上，視覺互相干擾。跨排的連接線
      // 不受這條限制，維持原本畫法。
      if(sameRowDates){
        const rowIsDragMarked = pickedPaths.some(function(p){ return p.date === c.aPath.date && p.via === "drag"; });
        if(rowIsDragMarked) return;
      }
      const rectA = cellScreenRect(tdA);
      const rectB = cellScreenRect(tdB);
      const sameRow = sameRowDates;
      const path = document.createElementNS(CONNECT_SVG_NS, "path");

      if(sameRow){
        // 同一排：用弧線連接，弧線頂點往上拱一點。
        // 起點/終點的方向改成「中心指向弧線控制點」的方向，
        // 這樣線離開/進入格子的角度會跟弧線本身一致，不是直直穿過文字。
        const midX = (rectA.cx + rectB.cx) / 2;
        const dist = Math.abs(rectB.cx - rectA.cx);
        // 弧線至少要拱起兩排格子的高度，距離較遠時才用比例公式讓弧線
        // 更高，但不會小於這個下限——在滿足下限的前提下，取剛好夠用、
        // 最短的弧線，不會多拱高。
        const rowH = Math.max(rectA.halfH, rectB.halfH) * 2;
        const arcHeight = Math.max(rowH * 2, dist * 0.25);
        const midY = Math.min(rectA.cy, rectB.cy) - arcHeight;
        const startEdge = rectEdgePoint(rectA, midX - rectA.cx, midY - rectA.cy);
        const endEdge = rectEdgePoint(rectB, midX - rectB.cx, midY - rectB.cy);
        path.setAttribute("d", "M " + startEdge.x + " " + startEdge.y + " Q " + midX + " " + midY + " " + endEdge.x + " " + endEdge.y);
      } else {
        const startEdge = rectEdgePoint(rectA, rectB.cx - rectA.cx, rectB.cy - rectA.cy);
        const endEdge = rectEdgePoint(rectB, rectA.cx - rectB.cx, rectA.cy - rectB.cy);
        path.setAttribute("d", "M " + startEdge.x + " " + startEdge.y + " L " + endEdge.x + " " + endEdge.y);
      }
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "var(--mark-line-color, #3B82F6)");
      // 兩個端點的縮放比例理論上會一樣（同一份開獎單），保險起見取
      // 兩者平均，避免極少數狀況下量到的寬度有些微差異。
      const cellScaleA = (rectA.halfW * 2) / NATURAL_CELL_WIDTH;
      const cellScaleB = (rectB.halfW * 2) / NATURAL_CELL_WIDTH;
      const cellScale = (cellScaleA + cellScaleB) / 2;
      const strokeWidth = Math.max(0.6, BASE_STROKE_AT_SCALE1 * cellScale);
      path.setAttribute("stroke-width", strokeWidth.toFixed(2));
      svg.appendChild(path);
    });

    // 強制瀏覽器重繪：在「定期」模式（.panels 被大幅 transform 縮放）
    // 下，實測發現直接改動這個被縮放元素底下的 SVG 內容，畫面不會
    // 馬上重繪出來，要等其他會觸發版面重排的動作才會補畫——這裡故意
    // 讀一次 offsetHeight（強迫瀏覽器立刻重新計算版面），逼它把剛剛
    // 畫的線立即畫到螢幕上。
    void svg.offsetHeight;
  }

  // 兩個格子在「期數」上的絕對距離（不分區塊，把整份資料當同一條
  // 時間軸算）：0代表同一期（同一排、不同欄，例如同一期的不同號碼)，
  // 1代表緊鄰的上下兩期，2以上代表中間至少隔了一期。改用
  // dateOrdinalMap（日期在目前畫面排列順序裡是第幾個）算，不再用
  // 畫面位置換算——這樣不管預留期數怎麼調整，只要日期本身在資料
  // 順序上是不是緊鄰，判斷結果都一樣，不會因為畫面重新排列就跑掉。
  function absoluteRowIndex(p){
    const ord = dateOrdinalMap[p.date];
    return typeof ord === "number" ? ord : 0;
  }

  function addConnection(pathA, pathB){
    const keyA = pathKey(pathA), keyB = pathKey(pathB);
    if(keyA === keyB) return; // 同一格，不能自己連自己
    // 只有「緊鄰的上下兩期」（中間沒有隔任何一期）才擋掉，因為那樣
    // 連線沒有意義；同一期不同號碼（絕對距離0）不受這條限制，那不是
    // 「上下期」的情況。
    const rowGap = Math.abs(absoluteRowIndex(pathA) - absoluteRowIndex(pathB));
    if(rowGap === 1) return;
    const already = connections.some(function(c){
      return (c.aKey === keyA && c.bKey === keyB) || (c.aKey === keyB && c.bKey === keyA);
    });
    if(already) return;
    pushHistory();
    connections.push({ aPath: pathA, bPath: pathB, aKey: keyA, bKey: keyB });
    renderConnections();
    // 保險：畫完的當下量到的尺寸可能還沒穩定（尤其在用 JavaScript
    // 動態設定外框大小的「定期」模式下），導致線條位置一開始算錯。
    // 改成接下來一段時間內多次重新計算，提高抓到「版面終於穩定下來」
    // 那個時機點的機會，不要只補畫一次就算了。
    [0, 100, 300, 600, 1000, 2000].forEach(function(delay){
      setTimeout(renderConnections, delay);
    });
    updateToolbarState();
  }

  function updateToolbarState(){
    // 使用者要求：「C式概率」的功能整個拿掉，變成一顆空的功能鍵——
    // 這裡不再同步它的disabled/armed狀態（原本是跟broadened這個
    // 變數連動，但broadened的值現在只由「分佈機率」的點擊來改變，
    // C式概率自己已經沒有任何點擊邏輯，不應該再顯示armed/disabled
    // 這些暗示「可以互動、有狀態變化」的視覺效果，避免讓人誤以為
    // 這顆鍵還有作用）。
    // 使用者要求：「分佈機率」已經有實際功能了，不需要再像之前那樣
    // 用disabled屬性顯示成半透明的「未啟用」樣子，改成跟「返回首頁」
    // 一樣一直維持正常亮度——這裡拿掉distProbBtn.disabled的同步，
    // 只保留armed狀態的同步（這是「目前有沒有被按下啟用」的視覺
    // 反映，跟「能不能點」是兩回事，繼續保留）。
    const distProbBtn = document.getElementById("draw-dist-prob");
    if(distProbBtn){
      distProbBtn.classList.toggle("armed", broadened);
    }
    backBtn.disabled = historyStack.length === 0;
    backBtn.classList.toggle("armed", historyStack.length > 0);
    // 使用者要求：「E式概率」的功能整個拿掉，變成一顆空的功能鍵——
    // 這裡不再同步它的disabled/armed狀態。clearAll()函式本體
    // 不動（fullBtn那顆「定期」專屬的浮動按鍵還是靠它運作，只是
    // clearBtn自己這顆九宮鍵不再綁定點擊事件去呼叫它，見下面
    // addEventListener那行的異動）。
    saveBtn.disabled = false; // 儲存不需要先指定號碼，隨時都能存
  }

  // 使用者要求：第一招的標記出現／消失時，立刻強制重畫整張表格的
  // 格子線。原理：短暫把表格從版面上移除（display:none）再放回來，
  // 強制瀏覽器整個重新排版、重繪一次——用來處理「圓形偽元素的
  // class變動之後，跟相鄰儲存格共用的格線偶爾沒有正確重繪」這類
  // 瀏覽器渲染細節問題（尤其在Android WebView環境下較容易出現）。
  // 用offsetHeight強制觸發同步reflow，確保display:none跟恢復
  // 之間瀏覽器真的有跑完一次完整的版面計算，不是兩行連續指令被
  // 瀏覽器最佳化、直接跳過中間狀態。
  function forceRedrawAllGridLines(){
    const tables = Array.prototype.slice.call(panels.querySelectorAll("table.road"));
    if(!tables.length) return;
    tables.forEach(function(table){
      table.style.display = "none";
      void table.offsetHeight;
      table.style.display = "";
    });
  }

  function pickCell(td){
    // 判斷「第一招是否已經成立」要看這一格／這個號碼有沒有「第一招
    // 自己的」紀錄（via==='click'），不能只看格子有沒有顯示標記——
    // 因為現在一格可能同時有第一招、第二招兩筆各自獨立的紀錄，格子
    // 顯示標記不代表第一招真的成立過（有可能只是第二招標記的）。
    const num = normalizedNum(td);
    const key = pathKey(pathOf(td));
    const hasClickMark = broadened
      ? pickedPaths.some(function(p){ return p.number === num && p.via === "click"; })
      : pickedPaths.some(function(p){ return pathKey(p) === key && p.via === "click"; });
    pushHistory();
    if(hasClickMark){
      // 第一招已成立：再點兩下＝只取消第一招自己的紀錄，第二招
      // （via==='drag'）的紀錄完全不受影響、繼續保留、繼續顯示。
      // 廣泛模式下標記是用「號碼」比對顯示的，所以要整個號碼一起取消；
      // 還沒廣泛時每一格是各自獨立的，只取消被點的這一格就好，
      // 不會影響其他手動指定過的相同號碼。
      if(broadened){
        pickedPaths = pickedPaths.filter(function(p){ return !(p.number === num && p.via === "click"); });
      }else{
        pickedPaths = pickedPaths.filter(function(p){ return !(pathKey(p) === key && p.via === "click"); });
      }
    }else{
      // 第一招還沒成立：不管這一格有沒有已經被第二招標記過，都額外
      // 新增一筆第一招自己的紀錄——兩招各自獨立，互不影響。
      pickedPaths.push(Object.assign({ number: num, via: "click" }, pathOf(td)));
      // 新指定一個號碼後，若先前已經廣泛過，維持廣泛狀態一併套用到新號碼；
      // 若還沒廣泛過，維持「只標記被點過的格子」的狀態，不影響其他已指定的格子。
    }
    applyMarksToClone();
    updateToolbarState();
    // 使用者要求：點兩下第一招讓標記出現、或點兩下讓標記消失，
    // 這兩種情況都要「立刻重劃所有格子線」——這個if-else上面兩個
    // 分支最後都會流到這裡，剛好同時涵蓋「出現」跟「消失」兩種
    // 情況，不用另外分開處理。
    forceRedrawAllGridLines();
  }

  // 標記第二招：左右滑動經過開獎號碼區時，滑過的每一格（包含尚未開獎的空白格）
  // 都直接標記起來，不像連點兩下只認得有號碼的格子。回傳true/false
  // 代表這次呼叫有沒有真的改動資料，讓呼叫端能正確計算dragCommittedCount
  // （撤銷手勢時要用goBack()撤銷的步數，必須跟實際pushHistory()的次數
  // 對得上，不能把「什麼都沒做的呼叫」也算進去，不然撤銷會多撤到
  // 不相關的歷史紀錄）。
  function markCellForDrag(td){
    const key = pathKey(pathOf(td));
    const already = pickedPaths.some(function(p){ return pathKey(p) === key && p.via === "drag"; });
    if(already) return false;
    pushHistory();
    pickedPaths.push(Object.assign({ number: normalizedNum(td), via: "drag" }, pathOf(td)));
    applyMarksToClone();
    updateToolbarState();
    return true;
  }

  // 第二招再滑一次＝取消：只移除這一格「第二招」自己的紀錄
  // （via==='drag'），第一招（via==='click'）的紀錄完全不受影響，
  // 兩招各自獨立、互不干擾的原則在這裡一樣要維持。同樣回傳
  // true/false代表這次呼叫有沒有真的改動資料。
  function unmarkCellForDrag(td){
    const key = pathKey(pathOf(td));
    const has = pickedPaths.some(function(p){ return pathKey(p) === key && p.via === "drag"; });
    if(!has) return false;
    pushHistory();
    pickedPaths = pickedPaths.filter(function(p){ return !(pathKey(p) === key && p.via === "drag"); });
    applyMarksToClone();
    updateToolbarState();
    return true;
  }

  function toggleBroad(){
    if(pickedPaths.length === 0) return;
    pushHistory();
    broadened = !broadened;
    applyMarksToClone();
    updateToolbarState();
  }

  function goBack(){
    if(historyStack.length === 0) return;
    const prev = historyStack.pop();
    pickedPaths = prev.pickedPaths;
    broadened = prev.broadened;
    connections = prev.connections || [];
    applyMarksToClone();
    updateToolbarState();
  }

  function clearAll(){
    if(pickedPaths.length === 0 && historyStack.length === 0) return;
    // 清除＝直接跳回第0步，連歷史紀錄一起清空（不是可被「返回」復原的一個步驟），
    // 這樣清除完之後「返回」和「清除」會一起回到最初的關閉狀態。
    // 「返回」「清除」只對第一、二、三招（指定號碼、整列標記、連接線）
    // 生效，不會動到第四招（長按空白格選的號碼），兩者是分開管理的。
    pickedPaths = [];
    broadened = false;
    connections = [];
    historyStack = [];
    applyMarksToClone();
    updateToolbarState();
  }

  // html2canvas 現在是直接內嵌在檔案裡（見 <head> 那段），不再需要從
  // 外部CDN動態載入，理論上 typeof html2canvas 一定是 "function"。
  // 這個函式維持原本的名稱／回傳型別（回傳一個resolve成布林值的
  // Promise）給其他呼叫的地方沿用，不用跟著改，但內部邏輯簡化成
  // 直接檢查一次就好，不再需要動態插入 <script> 標籤重試那一套。
  function ensureHtml2Canvas(){
    return Promise.resolve(typeof html2canvas !== "undefined");
  }

  // 存檔圖片的微調參數，跟「定期」模式截圖的參數完全分開兩組常數，
  // 改其中一組（例如下面 SAVE_IMG_TUNE 的留白、連接線粗細）絕對不會
  // 影響到另一組（PERIOD_SHOT_TUNE），也不會影響畫面上任何即時顯示——
  // 這兩組都只有在 saveAsImage() 執行截圖的當下才會被讀取一次。
  //
  // padRatio 曾經從0.005調高到0.079，想法是讓內容的寬高比預先貼近
  // A3的0.7071，減少塞進A3時的留白——但這個數字是照六合彩（7欄，
  // 版面較寬）反推算出來的，套到539（5欄，版面本身天生就比較窄長）
  // 上完全不合用，使用者實測539存檔幾乎整張都是白邊，跟六合彩的
  // 情況正好相反。**改回接近原本的極小留白（0.01），不再刻意調整
  // 寬高比去貼合A3**——使用者要求「不影響開獎單比例，把圖放大到
  // 接近A3邊界」，這代表留白要盡量小，讓等比例縮放（contain）自然
  // 決定要貼齊哪個方向的邊界，另一個方向會有多少留白就是多少，不用
  // 額外加留白去「配合」A3比例。不同玩法（539/天天樂5欄 vs 六合彩/
  // 大樂透7欄）版面天生寬高比不同，留白多寡本來就會不一樣，這是
  // 版面本身的差異，不是留白比例的問題，不需要用同一個padRatio去
  // 強行「校正」成同一種留白分布。
  const SAVE_IMG_TUNE = {
    padRatio: 0.01,    // 一般「存檔」鍵：圖片四周留白比例
    lineWidthScale: 1.35 // 一般「存檔」鍵：連接線粗細（乘上截圖倍率 captureScale）
  };
  // 使用者要求：「定期十六」存出來的圖要是滿版全螢幕，跟畫面上看到
  // 的一樣，不要有左右/上下的留白邊界——padRatio改成0，四周完全
  // 不加留白。這個調整只影響「定期」自己這組設定，不會牽動到一般
  // 存檔（SAVE_IMG_TUNE）那邊，一般存檔依然維持原本1%留白的效果。
  const PERIOD_SHOT_TUNE = {
    padRatio: 0,    // 「定期」模式「截圖」鍵：滿版全螢幕，不留白
    lineWidthScale: 1.35 // 「定期」模式「截圖」鍵：連接線粗細（乘上截圖倍率 captureScale）
  };

  async function saveAsImage(){
    // 存檔預覽功能已經取消，不管是一般放大鏡的「存檔」鍵還是「定期」
    // 模式的「截圖」鍵，現在都走同一條路：處理完直接下載。
    const outer = scrollerEl;
    const toast = document.getElementById("save-toast");
    if(!outer) return;

    saveBtn.disabled = true;
    saveBtn.classList.add("saving");
    saveBtn.classList.add("armed"); // 儲存中，跟返回鍵一樣亮黃燈

    // 截圖過程中會暫時關掉「定期」的放大效果、量測、重新排版，這些
    // 動作都是直接在畫面上真的發生的，使用者會看到中間過程一閃一閃
    // 的畫面變化。這裡蓋一層不透明遮罩擋住，全部處理完、畫面恢復
    // 正常之後才拿掉，使用者只會看到「按下去→稍等→完成」，不會看到
    // 中間過程。
    let captureMask = document.getElementById("capture-mask");
    if(!captureMask){
      captureMask = document.createElement("div");
      captureMask.id = "capture-mask";
      captureMask.style.cssText = "position:fixed; inset:0; background:#fff; z-index:1000; display:flex; align-items:center; justify-content:center; font-size:14px; color:#666;";
      captureMask.textContent = "處理中…";
      document.body.appendChild(captureMask);
    }
    captureMask.style.display = "flex";

    const ready = await ensureHtml2Canvas();
    if(!ready){
      toast.textContent = "無法載入儲存功能，請檢查網路連線";
      toast.classList.add("show");
      setTimeout(function(){
        toast.classList.remove("show");
        saveBtn.classList.remove("armed");
        saveBtn.classList.remove("saving");
        saveBtn.disabled = false;
      }, 2200);
      return;
    }

    // 「定期」模式的畫面是特地放大4.3×3.9倍方便瀏覽的，但截圖不需要
    // 照搬這個誇張的放大比例——截圖前先暫時把這個放大效果關掉（只
    // 關掉放大，JS另外用display:none控制的「只留16期+4期空白」篩選
    // 不受影響，還是只會截到篩選後的內容），改成正常大小截圖，截完
    // 再把放大效果恢復回來。宣告在 try 外面，這樣不管中途有沒有出錯，
    // finally 都能保證把畫面恢復回去，不會卡在「暫時被關掉放大」的
    // 不正常狀態。
    const wasRecentOnlyMode = document.body.classList.contains("recent-only-mode");
    const prevScrollerStyle = {
      width: scrollerEl.style.width, height: scrollerEl.style.height,
      marginLeft: scrollerEl.style.marginLeft, marginTop: scrollerEl.style.marginTop,
    };
    const prevPanelsTransform = panels.style.transform;
    // 存檔擷取的畫布大小是「截圖倍率(6倍) × 當下畫面實際縮放程度」
    // 疊乘出來的。放大鏡自己的兩指縮放（pageZoom，最高5倍）如果在
    // 按存檔之前還停留在放大狀態，兩者疊乘起來，擷取出來的圖片會
    // 大到不成比例（實際遇到過：先兩指放大開獎單、直接按存檔，圖片
    // 大到下載失敗，跳出「無法完成下載作業」）。存檔前先把兩指縮放
    // 暫時歸零到1倍，只留下「截圖倍率」這一層，確保不管使用者存檔
    // 當下畫面被放大到多少倍，存出來的圖片大小都是固定、可預期的，
    // 擷取完再把兩指縮放還原回使用者原本看到的倍率。
    const prevPageZoom = pageZoom;
    // 縮放倍率改變的當下，捲動位置也要一起記住、一起還原——單純只
    // 復原倍率、沒有連捲動位置一起復原的話，畫面看起來會像是「跳」
    // 到放大後畫面的其他角落（實際遇到過：存檔完回到抓牌畫面，開獎單
    // 整個跑掉，變成一個被放大到不知道哪個角落的畫面），因為縮放倍率
    // 改變時，捲動位置對應的畫面內容也跟著變了，兩者要綁在一起復原
    // 才會回到使用者存檔前原本看到的那個畫面。
    const prevScrollX = window.scrollX, prevScrollY = window.scrollY;
    // 「定期」模式截圖前一定會經過「關閉→重新打開」的重設流程，
    // pageZoom 本來就一定是1，這裡的還原邏輯兩種模式都安全套用，
    // 不需要另外區分。
    // 「存檔」鍵微調專用的 class，只在「非定期模式」按下存檔鍵時加上，
    // 跟「定期」模式截圖用的 capturing-plain 是兩個完全獨立的 class，
    // 兩邊的 CSS 規則互不重疊，互相不會影響。
    const tune = wasRecentOnlyMode ? PERIOD_SHOT_TUNE : SAVE_IMG_TUNE;
    function restoreRecentOnlyZoom(){
      document.body.classList.remove("capturing-save-only");
      // 兩種模式（一般存檔／定期）都可能在下面把外框寬度收緊過，
      // 這裡統一還原，不管哪個分支跑過都要復原回原本的寬度。
      scrollerEl.style.width = prevScrollerStyle.width;
      if(pageZoom !== prevPageZoom){
        pageZoom = prevPageZoom;
        applyPageZoom();
        window.scrollTo(prevScrollX, prevScrollY);
      }
      if(!wasRecentOnlyMode) return;
      panels.style.transform = prevPanelsTransform;
      document.body.classList.remove("capturing-plain");
      scrollerEl.style.height = prevScrollerStyle.height;
      scrollerEl.style.marginLeft = prevScrollerStyle.marginLeft;
      scrollerEl.style.marginTop = prevScrollerStyle.marginTop;
    }

    try{
      // 只有一般放大鏡的「存檔」鍵（非「定期」）才需要自己手動畫文字，
      // 「定期」的截圖必須維持「定期初始.md」記錄的原始行為——原封
      // 不動交給 html2canvas 自己畫，不能被這裡的任何調整牽動。
      // 顏色要趁現在（還沒套用下面讓文字隱形的擷取用CSS）讀，不然
      // 讀到的會是隱形後的 transparent。字體大小/粗細/字型不能在這裡
      // 讀：要等下面套用完 capturing-save-only 這個 class 之後才能讀到
      // 正確數值，見下面第二段。位置也留到那之後才真正去量（DOM 節點
      // 參照不變，稍後量到的才是最終畫面位置）。
      const textJobs = wasRecentOnlyMode ? [] : Array.prototype.map.call(outer.querySelectorAll(".cell-shift"), function(el){
        const cs = getComputedStyle(el);
        return {
          el: el,
          text: (el.textContent || "").trim(),
          color: cs.color,
          align: el.closest("td.day.first-of-month") ? "left" : "center"
        };
      }).filter(function(job){ return job.text; });

      // 指定號碼（num-marked）的框色也要趁現在讀——這是套在 :root 上
      // 的同一個 CSS 變數，全部格子共用同一個顏色，讀一次就好，不用
      // 每格分開讀。位置一樣留到版面定案後才量。
      // 這裡「定期」跟一般存檔都會蒐集（不像上面的 textJobs 只有一般
      // 存檔才蒐集）——框色漏畫是兩邊共通的 html2canvas 限制，兩邊都
      // 需要這個補救，不是「定期」專屬調整，不違反維持「定期初始」
      // 原始行為的原則（日期/星期/號碼文字那部分完全沒被動到）。
      // 第一招改成圓形之後不再有外框，只剩第二招（滑動標記）還有外框，
      // 這裡只需要讀第二招的框色（現在的配色規則：第二招框色＝
      // 第一招字色）。
      const markFrameColorDrag = getComputedStyle(document.documentElement).getPropertyValue("--mark-text-color").trim() || "#000";
      // 使用者截圖回報：「定期十六」存出來的圖，第一招（圓形標記）
      // 破圖扭曲，這裡額外讀第一招圓形本身的底色／框色，供稍後
      // drawCircleMarksOntoCanvas() 手動補畫用（只在「定期」情境下
      // 才會真的用到，一般存檔沒有這個問題，見下面該函式內的判斷）。
      const markBgColorClick = getComputedStyle(document.documentElement).getPropertyValue("--mark-bg-color").trim() || "#FF3B3B";
      const markFrameColorClick = getComputedStyle(document.documentElement).getPropertyValue("--mark-frame-color").trim() || "#2ECC71";
      const markedCells = Array.prototype.slice.call(outer.querySelectorAll("td.num.num-marked"));

      if(!wasRecentOnlyMode){
        // 存檔前先把兩指縮放（pageZoom）歸零到1倍，避免跟截圖倍率疊乘
        // 出過大的圖片（見上面 prevPageZoom 的說明）。
        if(pageZoom !== 1){
          pageZoom = 1;
          applyPageZoom();
          await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
        }
        // 一般放大鏡的「存檔」鍵：不需要關放大，但需要修正一個問題——
        // .scroller（被擷取的外框）本身寬度是跟著當下瀏覽器/手機螢幕
        // 的可用寬度走的，不是貼齊開獎單內容算出來的，導致在不同螢幕
        // 寬度下存出來的圖片，寬度會不一致（內容本身沒變，但外框寬度
        // 跟著螢幕跑）。這裡量出開獎單內容實際需要的寬度，把外框收緊
        // 貼齊，確保不管在哪支手機、哪個瀏覽器視窗寬度下存，圖片尺寸
        // 都固定一致。
        document.body.classList.add("capturing-save-only");
        await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
        const naturalW = panels.getBoundingClientRect().width;
        if(naturalW > 0) scrollerEl.style.width = Math.ceil(naturalW) + "px";
        await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
      }
      if(wasRecentOnlyMode){
        // 只關掉「放大」這一個效果本身（用行內樣式蓋掉 CSS 的 transform），
        // class 本身繼續保留，外框緊貼內容大小、標題列隱藏等其他設定
        // 都不受影響。關掉放大之後，內容變小了，外框的寬高也要跟著
        // 重新量一次、縮小回去貼合，不然外框會維持舊的（放大後的）
        // 尺寸，變成一大片空白。
        panels.style.transform = "none";
        document.body.classList.add("capturing-plain");
        await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
        const w = panels.getBoundingClientRect().width;
        const h = panels.getBoundingClientRect().height;
        if(w > 0){
          scrollerEl.style.marginLeft = "0px";
          scrollerEl.style.marginTop = "0px";
          scrollerEl.style.width = Math.ceil(w) + "px";
          scrollerEl.style.height = Math.ceil(h) + "px";
        }
        await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
      }

      // 現在 capturing-save-only 這個 class 已經套用、版面也定案了，
      // 這時候讀每格文字的字體大小/粗細/字型才會是「擷取當下實際會
      // 用到」的正確數值。（textJobs 在「定期」模式下是空陣列，這裡
      // 對它 forEach 不會做任何事，「定期」不受影響。）
      // getComputedStyle().fontSize 讀到的是「沒有套用 CSS transform
      // scale 之前」的原始字體大小——每月1號（.fom）用 transform:
      // scale(0.48) 把文字整個縮小顯示，但 fontSize 本身讀出來還是
      // 縮小前的 9px，如果直接拿去畫，畫出來的字會比格子裡實際看到
      // 的大超過兩倍、爆出格子。這裡額外量出該元素身上 transform 實際
      // 的縮放倍率，乘回字體大小，畫出來的字才會跟畫面上看到的大小
      // 一致。
      function getTransformScale(el){
        const t = getComputedStyle(el).transform;
        if(!t || t === "none") return 1;
        const m = t.match(/matrix\(([^)]+)\)/);
        if(!m) return 1;
        const p = m[1].split(",").map(function(s){ return parseFloat(s.trim()); });
        if(p.length < 4) return 1;
        const scaleX = Math.sqrt(p[0] * p[0] + p[1] * p[1]);
        const scaleY = Math.sqrt(p[2] * p[2] + p[3] * p[3]);
        return (scaleX + scaleY) / 2;
      }
      textJobs.forEach(function(job){
        const cs = getComputedStyle(job.el);
        job.fontWeight = cs.fontWeight;
        job.fontSize = parseFloat(cs.fontSize) * getTransformScale(job.el);
        job.fontFamily = cs.fontFamily;
        // 六合彩／大樂透（7欄版面）存檔時，開獎號碼／特別號的文字
        // 額外處理——只影響 .num 格子（一般號碼＋特別號都是這個
        // class），日期／星期文字不受影響。539／天天樂不受影響。
        // 1) 字體強制改成等距字體＋粗體（不是單純沿用畫面上量到的
        //    computed style，直接指定，確保存檔出來的文字一定是這個
        //    樣子）；2) 在原本縮小10%的基礎上，再縮小10%（等於
        //    0.9×0.9＝0.81，總共縮小成原本的81%）。
        if(isWideGame() && job.el.closest("td.num")){
          job.fontFamily = '"Roboto Mono","DejaVu Sans Mono","Courier New",monospace';
          job.fontWeight = "700";
          job.fontSize *= 0.9;
          job.fontSize *= 0.9;
        }
      });

      // 截圖倍率固定用一個合理的清晰度就好（不用再根據放大倍率反推），
      // 因為現在截圖時內容已經是正常大小，不會再有疊乘過度的問題。
      // 部分手機瀏覽器上，html2canvas 自己那套「手動重畫文字」引擎
      // 遇到位移(transform)疊加特殊字型（Courier New / DejaVu Sans
      // Mono，手機上通常沒安裝，要靠字型後援）時會整個放棄畫文字，
      // 甚至改用 foreignObjectRendering 也一樣不可靠（試過了，反而
      // 連框線都一起不見）。徹底解法（只套用在「一般存檔」，不動
      // 「定期」）：一般存檔的日期／星期／號碼改成我們自己用
      // Canvas 2D 的 fillText 手動畫上去（跟下面「連接線」用的是同
      // 一招——手動畫、不假手 html2canvas），只讓 html2canvas 負責
      // 畫框線、格線、色塊背景這些它畫得穩的東西。上面 CSS 裡新增的
      // body.capturing-save-only .cell-shift{ color:transparent } 會
      // 在一般存檔擷取當下讓原本的文字隱形，避免 html2canvas 自己
      // 嘗試畫出來的破圖字疊在我們手動畫的正確文字下面。「定期」
      // 完全不套用這一段（textJobs 在定期模式下是空陣列），維持
      // 「定期初始.md」記錄的原始行為不被牽動。
      if(document.fonts && document.fonts.ready){
        try{ await document.fonts.ready; }catch(e){}
      }
      const rawCanvas = await html2canvas(outer, { backgroundColor: "#ffffff", scale: 6 });
      const captureScale = 6;

      // 直接存 rawCanvas 的話，開獎單的邊框會緊貼著圖片邊界，看起來很擠。
      // 這裡另外開一張更大的白底畫布，把抓好的內容貼在中間、四周留白，
      // 讓存出來的圖片有呼吸空間。padding 用內容尺寸的比例算，不管
      // 開獎單本身多大/多小，留白比例都一致。
      const pad = Math.round(Math.max(rawCanvas.width, rawCanvas.height) * tune.padRatio);
      const canvas = document.createElement("canvas");
      canvas.width = rawCanvas.width + pad * 2;
      canvas.height = rawCanvas.height + pad * 2;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCanvas, pad, pad);

      // html2canvas 自己畫文字不可靠（見上面說明），改成這裡自己用
      // fillText 把日期／星期／號碼手動畫上去。用跟連接線一樣的座標
      // 換算方式：量每個文字節點目前（版面已經定案）的螢幕位置，減掉
      // 開獎單外框左上角、乘上截圖倍率、加上留白，得到畫布座標。
      (function drawCellTextOntoCanvas(){
        const outerRect = outer.getBoundingClientRect();
        textJobs.forEach(function(job){
          const r = job.el.getBoundingClientRect();
          if(r.width <= 0 || r.height <= 0) return;
          const fontPx = Math.max(1, job.fontSize * captureScale);
          ctx.font = job.fontWeight + " " + fontPx + "px " + job.fontFamily;
          ctx.fillStyle = job.color;
          ctx.textBaseline = "middle";
          const cy = (r.top + r.height / 2 - outerRect.top) * captureScale + pad;
          if(job.align === "left"){
            ctx.textAlign = "left";
            const cx = (r.left - outerRect.left) * captureScale + pad;
            ctx.fillText(job.text, cx, cy);
          } else {
            ctx.textAlign = "center";
            const cx = (r.left + r.width / 2 - outerRect.left) * captureScale + pad;
            ctx.fillText(job.text, cx, cy);
          }
        });
      })();

      // 指定號碼（num-marked）的框色（outline）改成手動畫，理由跟上面
      // 文字一樣：html2canvas 對 outline 支援不穩定，實測會整個漏畫。
      // 用跟 outline-offset:-1.4px 一樣的概念，框線畫在格子邊界「往內
      // 縮一點」的地方，不畫在最外緣，效果才會跟畫面上看到的一致。
      // 第一招改成圓形（不用外框）之後，這裡只剩第二招（num-marked-drag）
      // 還需要補畫外框，第一招的格子直接跳過。
      (function drawMarkedFramesOntoCanvas(){
        if(!markedCells.length) return;
        const outerRect = outer.getBoundingClientRect();
        // 框線粗細不能直接拿 CSS 寫的 1.4px 乘上截圖倍率就好——畫面上
        // 的格子本身已經先被 .panels 的 zoom:0.59（可能還疊加其他縮放）
        // 縮小過一次，1.4px 的 outline 也是照這個縮小後的比例顯示，
        // 不是原始的 1.4px。之前沒把這層縮放算進去，畫出來的框線比
        // 畫面上實際看到的粗了大概 1/0.59 倍。這裡改成跟連接線一樣的
        // 做法：量格子目前實際渲染出來的寬度，跟 CSS 定義的原始寬度
        // （28.12px）比較，算出真正的縮放比例，粗細照這個比例換算，
        // 才會跟畫面上看到的粗細一致。
        const NATURAL_CELL_WIDTH = 28.12; // table.road td.num 在 CSS 裡定義的原始寬度
        markedCells.forEach(function(td){
          if(!td.classList.contains("num-marked-drag")) return; // 第一招沒有框線了
          const r = td.getBoundingClientRect();
          if(r.width <= 0 || r.height <= 0) return;
          ctx.strokeStyle = markFrameColorDrag;
          const cellScale = r.width / NATURAL_CELL_WIDTH;
          const lineW = Math.max(1, 1.4 * cellScale * captureScale);
          ctx.lineWidth = lineW;
          const x = (r.left - outerRect.left) * captureScale + pad + lineW / 2;
          const y = (r.top - outerRect.top) * captureScale + pad + lineW / 2;
          const w = r.width * captureScale - lineW;
          const h = r.height * captureScale - lineW;
          if(w <= 0 || h <= 0) return;
          ctx.strokeRect(x, y, w, h);
        });
      })();

      // 使用者截圖回報：「定期十六」存出來的圖，第一招（圓形標記）
      // 破圖扭曲。原因見上面CSS規則的說明（偽元素transform疊在定期
      // 極端非等比例的transform:scale裡，html2canvas精準度不夠）。
      // 這裡只在wasRecentOnlyMode（「定期」）情境下才手動補畫圓形，
      // 一般存檔完全不受影響（維持原本html2canvas原生渲染，沒有
      // 這個問題，不需要、也不去牽動它）。用跟上面文字/框線一樣的
      // 座標換算方式：量格子目前實際渲染位置，換算成畫布座標；圓形
      // 直徑用「格子文字大小」的1.55倍（跟CSS的1.55em一致），字體
      // 大小則從num-marked-click這個td本身的computedStyle讀出來。
      (function drawCircleMarksOntoCanvas(){
        if(!wasRecentOnlyMode) return;
        if(!markedCells.length) return;
        const outerRect = outer.getBoundingClientRect();
        // 「定期」的文字是交給html2canvas原生畫的（跟一般存檔不同，
        // 一般存檔全部文字都手動補畫），這裡先用一般的疊放順序把
        // 圓形畫上去（會蓋住html2canvas已經畫好的數字），畫完圓形
        // 之後緊接著把「這幾格」的數字文字重新手動補畫一次蓋在
        // 圓形上面——效果等同畫面上原本「圓形在z-index:0、文字在
        // z-index:1」的正確疊放順序，只是換成用Canvas 2D的繪圖順序
        // （先畫圓、後畫字）達成同樣的視覺結果，不會有文字被蓋住的
        // 問題。（曾經試過用globalCompositeOperation="destination-over"
        // 讓圓形畫到「現有內容後面」，但這樣圓形也會被表格本身的
        // 儲存格背景擋住、變成完全看不見，不是正確做法，改回這個
        // 「先畫圓、再補畫字」的方式。）
        markedCells.forEach(function(td){
          if(!td.classList.contains("num-marked-click")) return; // 只有第一招才有圓形
          const r = td.getBoundingClientRect();
          if(r.width <= 0 || r.height <= 0) return;
          const fontSizePx = parseFloat(getComputedStyle(td).fontSize) || 10;
          // 使用者最新指示：不要再用留白/安全上限去讓圓形「刻意縮小
          // 避開格線」，改成反過來——強制圓形一定要碰到上格線下緣、
          // 下格線上緣（也就是撐滿整個格子高度），圓形畫完之後，
          // 再把格線重新補畫一次蓋在最上層，確保格線不會被圓形蓋住、
          // 依然清楚可見。這樣不用再猜測留白比例多少才夠，直接讓
          // 圓形跟格子等高，格線用「後畫蓋上去」的方式保證看得到。
          const borderW = Math.max(1, 1.4 * captureScale * (r.width / 28.12));
          const diameter = r.height * captureScale;
          const cx = (r.left + r.width / 2 - outerRect.left) * captureScale + pad;
          const cy = (r.top + r.height / 2 - outerRect.top) * captureScale + pad;
          const radius = diameter / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fillStyle = markBgColorClick;
          ctx.fill();
          ctx.lineWidth = borderW;
          ctx.strokeStyle = markFrameColorClick;
          ctx.stroke();
          // 圓形畫完，緊接著把這一格的數字文字補畫在上面，確保文字
          // 不會被剛剛畫的圓形蓋住看不見。使用者截圖回報數字偏高：
          // 原因是文字用了.cell-shift自己的getBoundingClientRect()
          // 位置去算，但這個元素本身有transform:translate(0%,10%)
          // 這類位移（本來是為了配合一般格子的視覺對齊用的），跟
          // 圓形以「整個格子置中」為基準不是同一個參考點，兩者疊在
          // 一起就會對不齊。修正成文字也用跟圓形完全一樣的基準點
          // （格子本身的中心cx、cy），不要另外去讀.cell-shift的位置，
          // 確保文字永遠精準置中在圓形正中央。
          const textEl = td.querySelector(".cell-shift");
          if(textEl){
            const cs = getComputedStyle(textEl);
            const fontPx = Math.max(1, fontSizePx * captureScale);
            ctx.font = cs.fontWeight + " " + fontPx + "px " + cs.fontFamily;
            ctx.fillStyle = cs.color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            // 使用者截圖比對「畫面實際看到的」跟「存出來的圖」，
            // 發現數字還是偏高一點點——Canvas 2D的textBaseline:
            // "middle"，是用整個字體（含英文字母上下伸出的部分）
            // 的中線去算「置中」，不是單純數字字符（沒有下伸筆畫）
            // 本身的視覺中心，兩者本來就會有一點落差，數字類字符
            // 用這個屬性置中，畫出來普遍會偏高。這裡加一個經驗值
            // 的向下修正，讓最終視覺效果貼近數字本身真正的中心點，
            // 跟畫面上實際看到的一致。使用者後來要求「全部號碼」
            // （不管有沒有被圈起來）再往上移動5%——這裡同步把原本
            // 8%的向下修正減少5%，變成3%，讓圈起來的數字（JS手動
            // 補畫這部分）跟一般數字（上面CSS transform那條，也同步
            // 從-30%改成-35%）的移動幅度一致，兩邊步調吻合。
            const baselineCorrection = fontPx * 0.03;
            ctx.fillText((textEl.textContent || "").trim(), cx, cy + baselineCorrection);
          }
        });
      })();

      // 使用者要求：截圖存檔前，順序是「先畫第一招圓形（上面那段
      // drawCircleMarksOntoCanvas）→ 再重畫整張表格的格子線 → 才
      // 截圖存檔」。把之前拿掉的redrawAllGridLinesOntoCanvas加回來，
      // 位置維持在圓形畫完之後、星期分隔線/連接線之前，符合這個
      // 順序要求。用strokeRect()一次畫出每個格子的矩形框線，四邊
      // 一次到位。
      (function redrawAllGridLinesOntoCanvas(){
        if(!wasRecentOnlyMode) return;
        const allCells = Array.prototype.slice.call(outer.querySelectorAll("table.road td"));
        if(!allCells.length) return;
        const outerRect = outer.getBoundingClientRect();
        const gridLineW = Math.max(1, 0.6 * captureScale);
        ctx.strokeStyle = "#bbb";
        ctx.lineWidth = gridLineW;
        allCells.forEach(function(td){
          const r = td.getBoundingClientRect();
          if(r.width <= 0 || r.height <= 0) return;
          const x = (r.left - outerRect.left) * captureScale + pad;
          const y = (r.top - outerRect.top) * captureScale + pad;
          const w = r.width * captureScale;
          const h = r.height * captureScale;
          ctx.strokeRect(x, y, w, h);
        });
      })();

      // 使用者截圖回報：「定期十六」存出來的圖，星期分隔線（見上面
      // CSS的說明）出現不正常的黑色陰影，改成這裡手動用Canvas 2D
      // 補畫一條細橫線，取代原生的box-shadow（原生的在「定期」極端
      // 縮放下算不準）。跟框線/圓形一樣的座標換算方式：量每一列
      // 第一格、最後一格目前實際渲染的位置，換算成畫布座標，橫線
      // 從最左畫到最右，粗細比照CSS原本寫的0.6px（乘上目前這個
      // row相對於原始尺寸的縮放比例、再乘上截圖倍率）。只在
      // wasRecentOnlyMode（「定期」）情境下才畫，一般存檔不受影響
      // （維持原生box-shadow正常運作，沒有這個問題）。
      (function drawWeekStartLinesOntoCanvas(){
        if(!wasRecentOnlyMode) return;
        const monthStartRows = Array.prototype.slice.call(outer.querySelectorAll("table.road tr.month-start"));
        if(!monthStartRows.length) return;
        const outerRect = outer.getBoundingClientRect();
        const NATURAL_CELL_WIDTH = 28.12; // 跟drawMarkedFramesOntoCanvas同一個基準，用來換算目前的縮放比例
        monthStartRows.forEach(function(tr){
          const cells = Array.prototype.slice.call(tr.querySelectorAll("td"));
          if(!cells.length) return;
          const firstCell = cells[0];
          const lastCell = cells[cells.length - 1];
          const firstRect = firstCell.getBoundingClientRect();
          const lastRect = lastCell.getBoundingClientRect();
          if(firstRect.width <= 0 || lastRect.width <= 0) return;
          const x1 = (firstRect.left - outerRect.left) * captureScale + pad;
          const x2 = (lastRect.left + lastRect.width - outerRect.left) * captureScale + pad;
          const y = (firstRect.top - outerRect.top) * captureScale + pad;
          const cellScale = firstRect.width / NATURAL_CELL_WIDTH;
          const lineW = Math.max(1, 0.6 * cellScale * captureScale);
          ctx.strokeStyle = "#000";
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(x1, y + lineW / 2);
          ctx.lineTo(x2, y + lineW / 2);
          ctx.stroke();
        });
      })();

      // 連接線現在是獨立蓋在整個畫面上的一層（position:fixed 在
      // document.body，不在開獎單裡面），html2canvas 只截到開獎單本身
      // 那一層，線不會自動被截進去。這裡改成直接用畫布的 2D 繪圖指令，
      // 把目前畫好的連接線手動補畫上去——用跟畫面上完全一樣的座標
      // 換算方式（螢幕座標→畫布座標：先減掉開獎單左上角的位置，再乘上
      // 這次的截圖倍率），確保補畫的線精準對齊。
      (function drawConnectionsOntoCanvas(){
        if(!connections || !connections.length) return;
        const outerRect = outer.getBoundingClientRect();
        function toCanvasRect(td){
          const r = td.getBoundingClientRect();
          const cx = (r.left + r.width / 2 - outerRect.left) * captureScale + pad;
          const cy = (r.top + r.height / 2 - outerRect.top) * captureScale + pad;
          const halfW = (r.width / 2) * captureScale;
          const halfH = (r.height / 2) * captureScale;
          return { cx: cx, cy: cy, halfW: halfW, halfH: halfH };
        }
        const lineColor = getComputedStyle(document.documentElement).getPropertyValue("--mark-line-color").trim() || "#3B82F6";
        ctx.strokeStyle = lineColor;
        // 使用者要求：「定期十六」存檔擷取前，連接線（第三招）的粗細
        // 縮減40%再截圖（不是縮短長度，單純線條粗細變細），只影響
        // 「定期」的截圖，不影響一般存檔／畫面上實際看到的連接線。
        const lineWidthMultiplier = wasRecentOnlyMode ? 0.6 : 1;
        ctx.lineWidth = tune.lineWidthScale * captureScale * lineWidthMultiplier;
        ctx.fillStyle = "none";
        connections.forEach(function(c){
          const tdA = cellAtPath(panels, c.aPath);
          const tdB = cellAtPath(panels, c.bPath);
          if(!tdA || !tdB) return;
          const sameRowDates = c.aPath.date === c.bPath.date;
          // 跟畫面上的邏輯一致：這一排如果已經有第二招（滑動）標記的
          // 紀錄，同排的連接線直接不畫、跳過，不退回直線，存檔圖片
          // 才會跟畫面上看到的一致。
          if(sameRowDates){
            const rowIsDragMarked = pickedPaths.some(function(p){ return p.date === c.aPath.date && p.via === "drag"; });
            if(rowIsDragMarked) return;
          }
          const rectA = toCanvasRect(tdA);
          const rectB = toCanvasRect(tdB);
          const sameRow = sameRowDates;
          ctx.beginPath();
          if(sameRow){
            const midX = (rectA.cx + rectB.cx) / 2;
            const dist = Math.abs(rectB.cx - rectA.cx);
            const rowH = Math.max(rectA.halfH, rectB.halfH) * 2;
            const arcHeight = Math.max(rowH * 2, dist * 0.25);
            const midY = Math.min(rectA.cy, rectB.cy) - arcHeight;
            const startEdge = rectEdgePoint(rectA, midX - rectA.cx, midY - rectA.cy);
            const endEdge = rectEdgePoint(rectB, midX - rectB.cx, midY - rectB.cy);
            ctx.moveTo(startEdge.x, startEdge.y);
            ctx.quadraticCurveTo(midX, midY, endEdge.x, endEdge.y);
          } else {
            const startEdge = rectEdgePoint(rectA, rectB.cx - rectA.cx, rectB.cy - rectA.cy);
            const endEdge = rectEdgePoint(rectB, rectA.cx - rectB.cx, rectA.cy - rectB.cy);
            ctx.moveTo(startEdge.x, startEdge.y);
            ctx.lineTo(endEdge.x, endEdge.y);
          }
          ctx.stroke();
        });
      })();

      // 現在畫布上該畫的（開獎單截圖＋連接線）都畫完了，把「定期」模式
      // 的放大效果恢復回來，不影響使用者接下來繼續瀏覽/操作。
      restoreRecentOnlyZoom();

      const now = new Date();
      const dateTag = now.toISOString().slice(0,10).replace(/-/g,"");
      const timeTag = now.toTimeString().slice(0,8).replace(/:/g,"");
      const filename = (GAME_LABELS[currentGameKey] || currentGameKey) + "資料庫_" + dateTag + "_" + timeTag + ".png";

      // 使用者要求：「定期十六」存出來的圖要是滿版全螢幕，跟畫面上
      // 看到的一樣，不要有任何留白邊界——這裡的第三個參數告訴
      // triggerPngDownload()跳過A3/A4紙張尺寸的「等比例縮放置中、
      // 補白邊」那段邏輯（那段邏輯是造成使用者截圖回報「上下留黑、
      // 左右留白」的真正原因，不是先前調整的padRatio），直接輸出
      // 畫布本身的原始尺寸。一般存檔（saveCleanSheetImage()那邊）
      // 完全不受影響，繼續維持原本的A3/A4紙張輸出。
      triggerPngDownload(canvas, filename, wasRecentOnlyMode);
      toast.textContent = "已下載完成";
    }catch(e){
      console.error("儲存圖片失敗", e);
      toast.textContent = "儲存失敗，請再試一次";
      restoreRecentOnlyZoom(); // 保險：中途出錯也要確保畫面恢復正常，不會卡住
    }finally{
      if(captureMask) captureMask.style.display = "none";
      saveBtn.classList.remove("armed");
      saveBtn.classList.remove("saving");
      saveBtn.disabled = false;
      // 存檔前後，「抓牌」模式該有的原生瀏覽器縮放設定（關閉原生縮放，
      // 換成抓牌自己的兩指縮放）要維持一致，不能因為存檔擷取過程中
      // 的任何動作跑掉。這裡強制重新套用一次viewport meta，確保不管
      // 擷取過程中發生什麼，存檔前後原生縮放的行為都是一樣的。只在
      // 還在抓牌模式時套用，離開抓牌之後不受影響。
      if(document.body.classList.contains("magnifier-mode")){
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        if(viewportMeta) viewportMeta.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
      }
      toast.classList.add("show");
      setTimeout(function(){
        toast.classList.remove("show");
      }, 1800);
    }
  }

  // 「開獎單」鍵：複製「存檔」的擷取邏輯，但存出來的圖不能出現任何
  // 一~四招的標記結果（指定號碼、連接線、第四招填的號碼），純粹是
  // 乾淨的原始開獎單。永遠是「一般存檔」的邏輯（不會有「定期」模式
  // 那個分支），因為這顆按鍵本來就只會在首頁被按到。
  async function saveCleanSheetImage(){
    const outer = scrollerEl;
    const toast = document.getElementById("save-toast");
    const cleanBtn = document.getElementById("clean-sheet-btn");
    if(!outer || !cleanBtn) return;

    cleanBtn.disabled = true;
    cleanBtn.classList.add("saving");

    let captureMask = document.getElementById("capture-mask");
    if(!captureMask){
      captureMask = document.createElement("div");
      captureMask.id = "capture-mask";
      captureMask.style.cssText = "position:fixed; inset:0; background:#fff; z-index:1000; display:flex; align-items:center; justify-content:center; font-size:14px; color:#666;";
      captureMask.textContent = "處理中…";
      document.body.appendChild(captureMask);
    }
    captureMask.style.display = "flex";

    const ready = await ensureHtml2Canvas();
    if(!ready){
      toast.textContent = "無法載入儲存功能，請檢查網路連線";
      toast.classList.add("show");
      setTimeout(function(){
        toast.classList.remove("show");
        cleanBtn.classList.remove("saving");
        cleanBtn.disabled = false;
      }, 2200);
      return;
    }

    const prevScrollerStyle = { width: scrollerEl.style.width };
    const prevPageZoom = pageZoom;
    const prevScrollX = window.scrollX, prevScrollY = window.scrollY;

    function restoreAfterCapture(){
      document.body.classList.remove("capturing-save-only", "capturing-clean-sheet");
      scrollerEl.style.width = prevScrollerStyle.width;
      if(pageZoom !== prevPageZoom){
        pageZoom = prevPageZoom;
        applyPageZoom();
        window.scrollTo(prevScrollX, prevScrollY);
      }
    }

    try{
      // 蒐集文字內容跟顏色，比照 saveAsImage() 的做法，但故意跳過
      // 「第四招」填的號碼（num-picked 底下的 cell-shift）——這些是
      // 使用者自己猜的號碼，不是真正的開獎資料，「開獎單」不該出現。
      // 指定號碼（num-marked）底下的文字正常蒐集，因為那是真實的
      // 歷史開獎數字，只是不特別標記樣式，數字本身還是要畫出來。
      const textJobs = Array.prototype.map.call(outer.querySelectorAll(".cell-shift"), function(el){
        if(el.closest("td.num.num-picked")) return null;
        const cs = getComputedStyle(el);
        return {
          el: el,
          text: (el.textContent || "").trim(),
          color: cs.color,
          align: el.closest("td.day.first-of-month") ? "left" : "center"
        };
      }).filter(function(job){ return job && job.text; });

      if(pageZoom !== 1){
        pageZoom = 1;
        applyPageZoom();
        await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
      }
      document.body.classList.add("capturing-save-only");
      document.body.classList.add("capturing-clean-sheet");
      await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });
      const naturalW = panels.getBoundingClientRect().width;
      if(naturalW > 0) scrollerEl.style.width = Math.ceil(naturalW) + "px";
      await new Promise(function(resolve){ requestAnimationFrame(function(){ requestAnimationFrame(resolve); }); });

      function getTransformScale(el){
        const t = getComputedStyle(el).transform;
        if(!t || t === "none") return 1;
        const m = t.match(/matrix\(([^)]+)\)/);
        if(!m) return 1;
        const p = m[1].split(",").map(function(s){ return parseFloat(s.trim()); });
        if(p.length < 4) return 1;
        const scaleX = Math.sqrt(p[0] * p[0] + p[1] * p[1]);
        const scaleY = Math.sqrt(p[2] * p[2] + p[3] * p[3]);
        return (scaleX + scaleY) / 2;
      }
      textJobs.forEach(function(job){
        const cs = getComputedStyle(job.el);
        job.fontWeight = cs.fontWeight;
        job.fontSize = parseFloat(cs.fontSize) * getTransformScale(job.el);
        job.fontFamily = cs.fontFamily;
        // 六合彩／大樂透（7欄版面）存檔時，開獎號碼／特別號的文字
        // 額外處理——只影響 .num 格子（一般號碼＋特別號都是這個
        // class），日期／星期文字不受影響。539／天天樂不受影響。
        // 1) 字體強制改成等距字體＋粗體（不是單純沿用畫面上量到的
        //    computed style，直接指定，確保存檔出來的文字一定是這個
        //    樣子）；2) 在原本縮小10%的基礎上，再縮小10%（等於
        //    0.9×0.9＝0.81，總共縮小成原本的81%）。
        if(isWideGame() && job.el.closest("td.num")){
          job.fontFamily = '"Roboto Mono","DejaVu Sans Mono","Courier New",monospace';
          job.fontWeight = "700";
          job.fontSize *= 0.9;
          job.fontSize *= 0.9;
        }
      });

      if(document.fonts && document.fonts.ready){
        try{ await document.fonts.ready; }catch(e){}
      }
      const rawCanvas = await html2canvas(outer, { backgroundColor: "#ffffff", scale: 6 });
      const captureScale = 6;

      const pad = Math.round(Math.max(rawCanvas.width, rawCanvas.height) * SAVE_IMG_TUNE.padRatio);
      const canvas = document.createElement("canvas");
      canvas.width = rawCanvas.width + pad * 2;
      canvas.height = rawCanvas.height + pad * 2;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCanvas, pad, pad);

      // 日期／星期／號碼手動畫上去（理由跟一般存檔一樣：html2canvas
      // 自己畫文字不可靠）。不畫框色（指定號碼的標記外框）、不畫
      // 連接線——這兩樣本來就是要排除在外的標記結果。
      (function drawCellTextOntoCanvas(){
        const outerRect = outer.getBoundingClientRect();
        textJobs.forEach(function(job){
          const r = job.el.getBoundingClientRect();
          if(r.width <= 0 || r.height <= 0) return;
          const fontPx = Math.max(1, job.fontSize * captureScale);
          ctx.font = job.fontWeight + " " + fontPx + "px " + job.fontFamily;
          ctx.fillStyle = job.color;
          ctx.textBaseline = "middle";
          const cy = (r.top + r.height / 2 - outerRect.top) * captureScale + pad;
          if(job.align === "left"){
            ctx.textAlign = "left";
            const cx = (r.left - outerRect.left) * captureScale + pad;
            ctx.fillText(job.text, cx, cy);
          } else {
            ctx.textAlign = "center";
            const cx = (r.left + r.width / 2 - outerRect.left) * captureScale + pad;
            ctx.fillText(job.text, cx, cy);
          }
        });
      })();

      restoreAfterCapture();

      const now = new Date();
      const dateTag = now.toISOString().slice(0,10).replace(/-/g,"");
      const timeTag = now.toTimeString().slice(0,8).replace(/:/g,"");
      const filename = (GAME_LABELS[currentGameKey] || currentGameKey) + "開獎單_" + dateTag + "_" + timeTag + ".png";

      triggerPngDownload(canvas, filename);
      toast.textContent = "已下載完成";
    }catch(e){
      console.error("儲存開獎單失敗", e);
      toast.textContent = "儲存失敗，請再試一次";
      restoreAfterCapture();
    }finally{
      if(captureMask) captureMask.style.display = "none";
      cleanBtn.classList.remove("saving");
      cleanBtn.disabled = false;
      toast.classList.add("show");
      setTimeout(function(){
        toast.classList.remove("show");
      }, 1800);
    }
  }

  // 把畫布真正轉成 PNG 並觸發瀏覽器下載。
  // skipPaperFit：使用者要求「定期十六」存出來的圖要是滿版全螢幕，
  // 跟畫面上看到的一樣，不要有任何留白邊界——傳true的時候完全跳過
  // 下面「加寬5%」跟「等比例縮放置中塞進A3/A4、補白邊」這兩段邏輯，
  // 直接拿傳進來的canvas原始尺寸去下載，不做任何額外處理。一般
  // 存檔（saveCleanSheetImage()呼叫這裡時不傳這個參數，預設false）
  // 完全不受影響，繼續維持原本的A3/A4紙張輸出。
  function triggerPngDownload(canvas, filename, skipPaperFit){
    // 存檔的圖片比照紙張尺寸（A3或A4，使用者可以透過「印單」鍵
    // 長按選擇，見下方 setupPaperSizeLongPress()）——這裡只影響
    // 「存出來的檔案」本身的最終畫布尺寸，不影響任何畫面顯示
    // （首頁、抓牌都完全不受影響，這段邏輯只在真正要下載檔案的
    // 最後一步才執行）。直向、300dpi（一般印刷品質）換算成像素：
    // mm數值換算英吋（÷25.4）再乘300。內容（開獎單本身，不管有
    // 沒有加白邊留白）等比例縮放塞進這個尺寸裡置中顯示（contain，
    // 不裁切、不變形），多出來的空間補白色，畫面比例跟紙張尺寸
    // 對不上的部分就是留白，不會硬拉伸內容改變原本的長寬比。
    if(!skipPaperFit){
      // 使用者要求：存檔前讓開獎單整體寬度增加5%，但最終輸出還是要
      // 維持A3/A4的邊界尺寸不變——這裡先把傳進來的canvas「只加寬
      // 5%、高度不變」畫到一張新的中繼畫布上（這一步會讓內容本身的
      // 寬高比改變，等於是輕微拉寬），再拿這張變寬過的畫布去跟平常
      // 一樣做「等比例縮放置中塞進A3/A4」這件事。最終輸出的紙張尺寸
      // （3508×4961或2480×3508）完全不受影響，只有「餵給contain縮放
      // 的內容本身」先被拉寬了5%，效果上等同讓開獎單在最後的紙張裡
      // 佔比更寬一點。
      const WIDTH_BOOST_RATIO = 1.06;
      const widenedCanvas = document.createElement("canvas");
      widenedCanvas.width = Math.round(canvas.width * WIDTH_BOOST_RATIO);
      widenedCanvas.height = canvas.height;
      const widenedCtx = widenedCanvas.getContext("2d");
      widenedCtx.fillStyle = "#ffffff";
      widenedCtx.fillRect(0, 0, widenedCanvas.width, widenedCanvas.height);
      widenedCtx.drawImage(canvas, 0, 0, widenedCanvas.width, widenedCanvas.height);
      canvas = widenedCanvas;

      const paperSize = getPaperSizeSetting();
      const PAPER_SIZES_PX = {
        A3: { width: 3508, height: 4961 },
        A4: { width: 2480, height: 3508 },
      };
      const targetSize = PAPER_SIZES_PX[paperSize] || PAPER_SIZES_PX.A3;
      const paperCanvas = document.createElement("canvas");
      paperCanvas.width = targetSize.width;
      paperCanvas.height = targetSize.height;
      const paperCtx = paperCanvas.getContext("2d");
      paperCtx.fillStyle = "#ffffff";
      paperCtx.fillRect(0, 0, targetSize.width, targetSize.height);
      const scale = Math.min(targetSize.width / canvas.width, targetSize.height / canvas.height);
      const drawW = canvas.width * scale;
      const drawH = canvas.height * scale;
      const offsetX = (targetSize.width - drawW) / 2;
      const offsetY = (targetSize.height - drawH) / 2;
      paperCtx.drawImage(canvas, offsetX, offsetY, drawW, drawH);
      canvas = paperCanvas;
    }

    // 圖片是 6 倍解析度擷取的，資料量偏大（列數多的時候更明顯）。
    // 原本固定用 data URL（把整張圖轉成 base64 塞進網址字串）在小圖
    // 沒問題，但圖片一大，字串長度暴增，部分手機瀏覽器（實際遇到過
    // Android）的下載管理員處理不了這麼長的 data URL，會跳出系統
    // 通知「無法完成下載作業」，下載失敗。
    // 改成優先用 Blob + URL.createObjectURL 觸發下載：Blob 是直接處理
    // 二進位資料，不用先編碼成又臭又長的 base64 字串，檔案再大都比較
    // 穩定，是瀏覽器原生就支援、專門為了這種情境設計的方式。如果當下
    // 瀏覽器不支援 canvas.toBlob 或建立失敗，才退回用原本的 data URL
    // 方式，確保至少還能存到圖，不會兩種都失敗、什麼都存不了。
    function downloadWithLink(href, revokeAfter){
      const link = document.createElement("a");
      link.download = filename;
      link.href = href;
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      setTimeout(function(){
        document.body.removeChild(link);
        if(revokeAfter) URL.revokeObjectURL(href);
      }, 1000);
    }
    function downloadWithDataUrl(){
      downloadWithLink(canvas.toDataURL("image/png"), false);
    }
    if(canvas.toBlob){
      canvas.toBlob(function(blob){
        if(!blob){
          console.warn("canvas.toBlob 沒有產生內容，改用 data URL");
          downloadWithDataUrl();
          return;
        }
        try{
          downloadWithLink(URL.createObjectURL(blob), true);
        }catch(e){
          console.warn("Blob 下載失敗，改用 data URL", e);
          downloadWithDataUrl();
        }
      }, "image/png");
    } else {
      downloadWithDataUrl();
    }
  }

  function showFullPageImage(){
    overlay.classList.add("open");
    document.body.classList.add("magnifier-mode");
    // 使用者回報：header.top加了position:fixed之後，抓牌畫面捲動時
    // 四顆按鍵還是會跟著移動。根本原因：header.top的父層
    // #page-zoom-wrap會被JS動態套用transform:scale()（兩指縮放
    // 用），CSS規則是「祖先元素只要有transform，子元素的position:
    // fixed就會失效，變成只是相對於那個祖先固定，不是真正相對於
    // 整個螢幕視窗」。修法：進入抓牌模式時，把header.top從
    // #page-zoom-wrap裡搬出來，脫離受transform影響的範圍。
    // 使用者後來又回報：放大後開獎單還是會從九宮鍵/四彩券鍵背後的
    // 縫隙透出來——header.top自己用margin:0 14px做左右間距（不是
    // padding），margin是外框本身縮進去，兩側各留了14px沒有背景
    // 覆蓋。改成搬進#header-top-bg-wrap這個外層滿版背景包裹層
    // 裡面（不是直接搬進<body>），這個外層本身沒有margin、真正
    // 滿版整個螢幕寬度，負責蓋住兩側縫隙；header.top維持原本的
    // margin邏輯放在裡面，寬度對齊機制不受影響。離開抓牌模式時
    // 再搬回原本的位置（用#header-top-anchor這個空的佔位元素
    // 標記原本的插入點）。
    const headerTopEl = document.getElementById("header-top");
    const headerTopBgWrap = document.getElementById("header-top-bg-wrap");
    if(headerTopEl && headerTopBgWrap && headerTopEl.parentElement !== headerTopBgWrap){
      headerTopBgWrap.appendChild(headerTopEl);
    }
    // 使用者回報：抓牌畫面裡四顆按鍵的大小/位置跟首頁不一致。原因：
    // 首頁有一個applyDesktopScrollerWidth()函式，會把header.top的
    // 寬度用行內樣式(style.width)明確設成跟開獎單量測結果一致的
    // 特定px值，這個行內樣式在把header.top搬到<body>底下時會
    // 一起被帶過來，殘留在header.top身上——但抓牌畫面這裡用的是
    // position:fixed搭配left:0/right:0（讓它自然撐滿整個螢幕寬度），
    // 殘留的舊行內寬度值會跟這個「自然撐滿」的邏輯互相衝突，導致
    // 寬度算錯、看起來跟首頁不一致。這裡明確清空這個行內樣式，
    // 確保進入抓牌畫面後完全交給fixed+left:0/right:0這組CSS決定
    // 寬度，不受首頁殘留數值干擾。
    if(headerTopEl) headerTopEl.style.width = "";
    // 使用者最終要求：抓牌畫面要用App自己的transform:scale()縮放
    // （不是原生縮放），才能讓下面四顆浮動按鍵維持固定大小不跟著
    // 縮放（原生縮放沒辦法排除特定元素，詳見setupPageZoom()的
    // 說明）。進入抓牌畫面時把viewport改成maximum-scale=1、
    // user-scalable=no，禁止原生縮放介入、避免跟App自己的縮放
    // 同時生效互相打架。首頁維持原本「不限制原生縮放」的設定
    // （見resetViewToDefault()、closeBtn的click handler，離開
    // 抓牌畫面會改回去）。
    const meta = document.querySelector('meta[name="viewport"]');
    if(meta) meta.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
    // 首頁的centerHomepageWrap()會用JS直接設定#page-zoom-wrap的
    // margin-left（目前是固定-1%平移），這是行內樣式，不會因為
    // body加上magnifier-mode這個class就自動消失，會一路殘留到
    // 抓牌畫面裡，害開獎單內容跟著偏左（使用者截圖回報過這個現象）。
    // 進入抓牌畫面時明確清掉，確保是乾淨的初始狀態。
    const pageZoomWrapEl = document.getElementById("page-zoom-wrap");
    if(pageZoomWrapEl){
      pageZoomWrapEl.style.marginLeft = "";
      pageZoomWrapEl.style.marginRight = "";
    }
    pageZoom = 1;
    applyPageZoom();
    positionPinOnScreen();
    pinBtn.style.visibility = "visible";
    pinBtn.style.display = "";
    pinBtn.disabled = false;
    pinBtn.classList.remove("period-locked");
    fullBtn.style.display = "";
    floatSaveBtn.style.display = "";
    floatBackBtn.style.display = "";
    recentClearBtn.style.display = "none";
    recentShotBtn.style.display = "none";
    // 一開啟預設是「大頭釘閃爍/關閉」狀態，畫面可以正常滑動/縮放移動；
    // 按下大頭釘之後才會鎖定畫面——不管上次關閉時是什麼狀態，這裡都重設。
    setPinned(false);
    recentOnly = false;
    periodBtn.classList.remove("armed");
    if(typeof applyRecentOnly === "function") applyRecentOnly();
    // 使用者最終要求：直接套用固定常數MAGNIFIER_ZOOM（0.600802），
    // 不再動態抓取首頁當下的實際數值，不管首頁那邊之後有沒有變動，
    // 抓牌系統一律固定顯示這個數字。
    panels.style.zoom = MAGNIFIER_ZOOM;
    fullDisplay = false;
    applyFullDisplay();
    applyMarksToClone(); // 開獎單本來就在畫面上，重新套用一次目前的標記狀態
    updateButtonOverlapGuard();
    // 電腦上（寬度≥900px）把工具列九顆按鍵的寬度收緊貼齊開獎單
    // 內容寬度，跟首頁的.scroller對齊，不要滿版撐開；手機不受
    // 影響（applyDesktopMagnifierToolbarWidth()內部自己會判斷）。
    // 用 requestAnimationFrame 等 magnifier-mode 這個class真的
    // 套用、.view從display:none變成可見、版面重新排好之後再量，
    // 量到的 #panels 寬度才會是正確的。
    requestAnimationFrame(applyDesktopMagnifierToolbarWidth);
    // 最上面「目前彩券」按鍵的寬度，跟工具列一樣要等版面重新排好
    // 之後才量，用同一個requestAnimationFrame時機。
    requestAnimationFrame(applyImgGameTabsWidth);
    // 九宮鍵區外框跟開獎單無縫連接，同樣要等版面重新排好才量。
    requestAnimationFrame(applyImgHintBarConnect);
    // 保險：部分手機瀏覽器排版完成的時機可能比requestAnimationFrame
    // 預期的還晚（尤其效能較差的裝置），光靠rAF重試可能還是量到0
    // 或量到還沒定案的中間值。這裡額外加一個300毫秒之後的延遲呼叫，
    // 確保就算rAF那條路線失敗，還有這一道保險再校正一次寬度／高度。
    setTimeout(function(){
      applyImgGameTabsWidth();
      applyImgHintBarConnect();
    }, 300);
  }

  // 連續點兩下同一個號碼格＝指定號碼。用事件代理綁在首頁那份真正的
  // 開獎單（panels）上，只有放大鏡模式開著的時候才生效。
  panels.addEventListener("dblclick", function(e){
    if(!document.body.classList.contains("magnifier-mode")) return;
    const td = e.target.closest("td.num");
    if(!td) return;
    // 如果這格是第四招填進去的號碼，連點兩下＝在這個號碼的累加數上
    // 減1，不是把「這一格自己的」紀錄整個刪掉。因為會顯示號碼的
    // 這一格，一定是這個號碼「目前最新選」的那一筆（renderAllNumPicked
    // 只讓每組的最後一筆顯示），如果直接刪掉它自己，下一新的那筆
    // 會遞補上來、換到別的位置顯示，變成「這格消失、換另一格出現」，
    // 不是使用者要的「原地累加數-1」。正確做法是刪掉這個號碼裡
    // 「最舊」的那一筆（反正那筆本來就是隱藏、看不到的空白格，刪掉
    // 不影響畫面），這樣目前顯示的這一格位置完全不動，只是累加數
    // 少1；一路刪到只剩這一筆自己（沒有累加數了）時，再點一次才會
    // 真的把這一筆也刪掉，格子才變回空白。
    if(td.classList.contains("num-picked")){
      const clickedPath = pathOf(td);
      // 「重新確認同一個號碼」的情況下，同一個path可能疊了好幾筆
      // 紀錄（都是同一個value），這裡find()找到的不一定是最新那筆，
      // 但沒關係——我們只需要它的value去判斷屬於哪一組，不需要精準
      // 對到哪一個物件，下面的group判斷跟刪除邏輯用的是value分組、
      // 不是靠這個clickedEntry本身的身分。
      const clickedEntry = numPickedEntries.find(function(entry){ return pathKey(entry.path) === pathKey(clickedPath); });
      if(clickedEntry){
        const group = numPickedEntries.filter(function(entry){ return entry.value === clickedEntry.value; });
        if(group.length <= 1){
          // 只剩這一筆了，沒有其他重複可以扣，整個刪掉，格子變空白。
          numPickedEntries = numPickedEntries.filter(function(entry){ return entry !== clickedEntry; });
        } else {
          // group陣列本身是照選填順序累加的，group[0]就是「最舊」那筆
          // ——不管它的path是不是也剛好等於目前顯示格自己的path（同一
          // 格重複確認過的情況），刪掉最舊的那筆，目前顯示的格子跟
          // 累加數的變化都會正確反映（詳見上面applyNumPickerChoice的
          // 說明）。
          const oldest = group[0];
          numPickedEntries = numPickedEntries.filter(function(entry){ return entry !== oldest; });
        }
      }
      renderAllNumPicked();
      return;
    }
    // 還沒開獎的空白格（pending，還沒被第四招填過號碼）不能用第一招
    // 指定——這種格子本來就沒有真正的號碼，指定它沒有意義，直接擋掉。
    if(td.classList.contains("pending")) return;
    pickCell(td);
  });

  // 標記第二招：在開獎號碼欄位上左右滑動（或右左滑動），滑過的每一格
  // （包含空白未開獎格）都直接標記。用「移動超過一點點距離才算滑動」
  // 來跟單純的點擊/連點兩下區分開，避免互相干擾。
  let dragStartX = null, dragStartY = null, dragActive = false, dragTouchedKeys = null, dragPathCells = null;
  let dragStartRowKey = null; // 記錄起始那一格是「哪一區塊/哪一列」，滑過其他列就整段作廢
  let dragRowCells = null, dragRowLeftEdge = 0, dragRowRightEdge = 0;
  let dragSweptKeys = null; // 這次手勢實際滑過（偵測到手指壓在上面）的號碼格
  let dragTouchedLeftEdge = false, dragTouchedRightEdge = false;
  let dragCommittedCount = 0; // 這次手勢已經標記出去的格數，作廢時要用「返回」全部撤銷
  let dragLastX = null, dragMaxX = null, dragMinX = null, dragConfirmed = false;
  const DRAG_THRESHOLD = 2;
  const DIRECTION_DECIDE_DISTANCE = 3; // 移動超過這個距離才判斷是左右滑還是上下滑
  const REVERSAL_DISTANCE = 3; // 往右、往左都至少要移動這麼多才算「確認反轉」，避免手抖誤觸
  const MAX_SWIPE_CELLS = 5; // 一次滑動最多標記5個號碼
  const MIN_SWIPE_CELLS = 2; // 一次滑動至少要標記2個號碼才算數

  function pathKey(p){ return p.date + "-" + p.cellIndex; }

  // 放大鏡不再自己實作雙指縮放——開獎單現在就是首頁那份真正的表格，
  // 縮放直接交給首頁本來就有的整頁自訂縮放（pageZoom）處理，兩邊共用
  // 同一套縮放機制，不會有兩套縮放互相打架的問題。

  let connectStartPath = null;

  panels.addEventListener("pointerdown", function(e){
    if(!document.body.classList.contains("magnifier-mode")) return;
    if(!viewPinned) return; // 第二招、第三招都要先固定畫面才能用
    const startTd = e.target.closest("td.num");
    // 標記第三招：如果一開始按下的格子已經是指定號碼，記錄起來，
    // 放開時如果落在「另一個」指定號碼上，就畫連接線。
    // 起點一樣用「附近最近的指定號碼」去抓，不用手指剛好壓在正中央。
    let startMarked = (startTd && startTd.classList.contains("num-marked")) ? startTd : null;
    if(!startMarked){
      startMarked = findNearestMarkedCell(e.clientX, e.clientY, null);
    }
    connectStartPath = startMarked ? pathOf(startMarked) : null;

    const td = e.target.closest("td.num");
    if(!td) return;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragActive = false;
    dragTouchedKeys = new Set();
    dragPathCells = [];
    dragMaxX = e.clientX;
    dragMinX = e.clientX;
    dragConfirmed = false;
    dragCommittedCount = 0;
    const startPath = pathOf(td);
    dragStartRowKey = startPath.date;
    // 規則：一定要從最左邊界（第1格）開始，依序滑過中間號碼，滑到
    // 最右邊界（最後1格）為止，才算條件成立；反過來從最後1格開始滑到
    // 第1格也算。所以起點一定要是第1格或最後1格，不是從中間開始——
    // 不是從中間格子開始的滑動，不啟動第二招（但還是可以用來畫第三招
    // 的連接線，兩者是分開判斷的）。
    // 這裡的「一列有幾格」是動態抓的（下面 rowCells），不是寫死5格：
    // 539／天天樂每列5個號碼格，滑過5格才算成立；六合彩／大樂透每列
    // 是6號碼＋1特別號共7格（特別號格子雖多了.special這個class，但
    // 本質上仍是td.num，一樣會被算進rowCells裡），所以在這兩個玩法裡
    // 要滑過全部7格（含特別號那格）才算成立。
    const rowTr = td.closest("tr");
    const rowCells = rowTr ? Array.prototype.slice.call(rowTr.querySelectorAll("td.num")) : [td];
    const isEdgeStart = rowCells.length > 0 && (td === rowCells[0] || td === rowCells[rowCells.length - 1]);
    dragTouchedLeftEdge = false;
    dragTouchedRightEdge = false;
    if(!isEdgeStart){
      dragRowCells = null;
      return;
    }
    dragRowCells = rowCells;
    dragTouchedLeftEdge = (td === rowCells[0]);
    dragTouchedRightEdge = (td === rowCells[rowCells.length - 1]);
    dragSweptKeys = new Set();
    dragSweptKeys.add(pathKey(startPath));
  });

  // 固定畫面時格子本身很小（539/天天樂約28px、六合彩/大樂透約20px，
  // 還疊加首頁本身的zoom:0.59縮小，實際可觸控範圍更小），滑動時手指
  // 很容易滑出格子跟格子間的縫隙，導致document.elementFromPoint()那
  // 一瞬間抓不到任何td.num，那個點就直接被略過、沒有記進dragSweptKeys
  // 裡，導致「整列都要滑過一輪」的條件湊不齊，滑動看起來完全沒反應。
  // 「定期」模式格子被放大到4.3倍寬，觸控範圍夠大，不會遇到這個問題，
  // 這就是「定期16可以、固定畫面不行」的差異所在。
  // 用這個容錯：elementFromPoint沒有精準命中的時候，改成直接在「目前
  // 這一列已知的格子」（dragRowCells）裡，用座標找最接近的一格，只要
  // 縱向大致還在這一列範圍內（用格高的1.5倍當容差）就採用，不用
  // 像素級精準壓在格子正中央才算數。
  function nearestRowCell(rowCells, clientX, clientY){
    if(!rowCells) return null;
    let best = null, bestDist = Infinity;
    rowCells.forEach(function(c){
      const r = c.getBoundingClientRect();
      if(r.width === 0 && r.height === 0) return; // 「定期」隱藏的格子跳過
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dy = clientY - cy;
      const vTolerance = r.height * 1.5;
      if(Math.abs(dy) > vTolerance) return; // 縱向差太多，大概是滑到別列去了，不硬吸過來
      const dist = Math.abs(clientX - cx);
      if(dist < bestDist){ bestDist = dist; best = c; }
    });
    return best;
  }

  panels.addEventListener("pointermove", function(e){
    if(!document.body.classList.contains("magnifier-mode")) return;
    if(dragStartX === null) return;

    // 手指滑得快的時候，瀏覽器會把好幾個中間點「合併」成一個事件才送出
    // （event coalescing），如果只看最後這個座標，滑動途中真正滑到最右
    // /最左邊的那個瞬間就會被吃掉，導致「明明滑得夠遠，卻偵測不到反轉」
    // ——這就是手機上要滑很多次才有效果的主因。改成把這次事件裡合併的
    // 每一個中間點都處理過一輪，不會漏掉滑動路徑上的最高點/最低點。
    const points = (typeof e.getCoalescedEvents === "function" && e.getCoalescedEvents().length)
      ? e.getCoalescedEvents()
      : [e];

    for(const pt of points){
      const dx = pt.clientX - dragStartX, dy = pt.clientY - dragStartY;
      if(!dragActive){
        const dist = Math.hypot(dx, dy);
        if(dist < DRAG_THRESHOLD) continue;
        // 只有左右滑動才算數。一開始只移動一點點的時候，方向判斷還不穩定
        // （手抖幾 px 就可能誤判成垂直），所以先繼續觀察，等移動距離夠大
        // 了才判斷方向；不夠大之前既不放棄、也不啟動，讓使用者的手指
        // 有機會把意圖表現出來。
        if(dist < DIRECTION_DECIDE_DISTANCE) continue;
        if(Math.abs(dx) <= Math.abs(dy)){
          // 只放棄第二招（滑動標記）自己的狀態；第三招（連接線）用
          // connectStartPath 獨立判斷起訖點，不受第二招「只認左右滑」
          // 這條規則限制，所以這裡不能連 connectStartPath 也一起清掉，
          // 不然兩個指定號碼之間上下拉線就會失效。
          dragStartX = null; dragStartY = null;
          return;
        }
        dragActive = true;
      }

      // 標記第二招：必須先由左往右、再由右往左（或反過來）都滑過一段
      // 「有感」的距離，才算「確認」要開始標記——用累積的最大/最小 X
      // 座標來判斷，而不是每一小步的移動方向，這樣手指自然的小抖動
      // 不會被誤判成「已經反轉方向」，比較不容易誤觸發標記。
      if(pt.clientX > dragMaxX) dragMaxX = pt.clientX;
      if(pt.clientX < dragMinX) dragMinX = pt.clientX;

      const hoverEl = document.elementFromPoint(pt.clientX, pt.clientY);
      const td = hoverEl && hoverEl.closest ? hoverEl.closest("td.num") : null;

      if(td){
        const tdPath = pathOf(td);
        const tdRowKey = tdPath.date;
        if(tdRowKey !== dragStartRowKey){
          // 滑到別列去了：這一整段手勢直接作廢。如果這次手勢已經標記出去
          // 幾格了，用「返回」把這幾步全部撤銷，等於整段手勢完全沒發生過。
          for(let i = 0; i < dragCommittedCount; i++){ goBack(); }
          dragStartX = null; dragStartY = null; dragActive = false;
          dragConfirmed = false;
          dragCommittedCount = 0;
          return;
        }
        // 記下手指實際壓過的號碼格，等所有格子都滑過一輪才算數。
        if(dragSweptKeys) dragSweptKeys.add(pathKey(tdPath));
      } else if(dragRowCells){
        // elementFromPoint沒有精準命中任何td.num（格子太小、滑出縫隙），
        // 改成在目前這一列已知的格子裡，用座標找最接近的一格當作這次
        // 壓過的格子，不用像素級精準才算數（詳見上面nearestRowCell的
        // 說明）。
        const nearest = nearestRowCell(dragRowCells, pt.clientX, pt.clientY);
        if(nearest && dragSweptKeys) dragSweptKeys.add(pathKey(pathOf(nearest)));
      }

      if(!dragConfirmed){
        // 不再要求一定要碰到最左邊／最右邊那格（邊界格），只要這一列
        // 5個號碼格，不管左滑還是右滑，連續滑動的過程中全部都被
        // 壓過一輪，就視為條件成立——整列5個號碼一次全部變成指定
        // 號碼。「定期」模式整排被放大到4.3倍寬，要求一定要精準碰到
        // 最左/最右那格常常搆不到、要滑好幾次才成功，拿掉邊界限制
        // 之後只要中間5格都掃過就算數，門檻明顯降低。
        const sweptAll = dragRowCells && dragSweptKeys &&
          dragRowCells.every(function(c){ return dragSweptKeys.has(pathKey(pathOf(c))); });
        if(sweptAll){
          dragConfirmed = true;
          // 這一列如果「已經有任一格」被第二招標記過，再滑一次＝
          // 整列取消第二招；否則＝建立第二招。原本要求「全部格子都
          // 要有標記」才算已成立，如果之前有哪次手勢中途被打斷過
          // （例如中途滑到別列被撤銷、或方向判斷不穩定），可能導致
          // 這一列裡只有部分格子留下第二招紀錄，變成「不是全部都
          // 有」而判定成「還沒成立」，滑第二次就又補標記一次而不是
          // 取消。改成只要「任一格」已成立就視為這一列已成立，滑一次
          // 就整批清除，不管前面狀態完不完整都能正確取消。
          const alreadyDragMarked = dragRowCells.some(function(c){
            const k = pathKey(pathOf(c));
            return pickedPaths.some(function(p){ return pathKey(p) === k && p.via === "drag"; });
          });
          if(alreadyDragMarked){
            // 不管這一格本身有沒有標記都呼叫一次，unmarkCellForDrag
            // 對沒有標記的格子是安全的（回傳false、不做事），這樣
            // 不管前面狀態完不完整，這一輪滑動結束後這一整列都會
            // 確保完全清乾淨；dragCommittedCount只計算真的有改動的
            // 次數，撤銷手勢時goBack()的次數才會對得上。
            dragRowCells.forEach(function(cellEl){ if(unmarkCellForDrag(cellEl)) dragCommittedCount++; });
          } else {
            dragRowCells.forEach(function(cellEl){ if(markCellForDrag(cellEl)) dragCommittedCount++; });
          }
        }
      }
    }

    if(dragActive) e.preventDefault();
  }, { passive: false });

  const CONNECT_SNAP_RADIUS_RATIO = 0.8; // 用格子本身寬度的比例當作瞄準半徑，格子被放大多少、容許誤差就跟著放大多少

  function findNearestMarkedCell(clientX, clientY, excludeKey){
    const clone = panels;
    if(!clone) return null;
    let best = null, bestDist = Infinity, bestRadius = 30;
    clone.querySelectorAll("td.num.num-marked").forEach(function(td){
      const key = pathKey(pathOf(td));
      if(key === excludeKey) return;
      const r = td.getBoundingClientRect();
      // 被「定期」模式隱藏（display:none）的格子，量出來的寬高會是0，
      // 直接跳過，不要讓它干擾判斷。
      if(r.width === 0 && r.height === 0) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dist = Math.hypot(clientX - cx, clientY - cy);
      if(dist < bestDist){
        bestDist = dist;
        best = td;
        // 瞄準半徑不用固定 30px：開獎單被放大多少倍，格子本身也跟著
        // 變大多少倍，容許的誤差範圍要一起放大，不然被放大好幾倍之後，
        // 30px 反而變得很小、很難瞄準。
        bestRadius = Math.max(30, Math.max(r.width, r.height) * CONNECT_SNAP_RADIUS_RATIO);
      }
    });
    return (best && bestDist <= bestRadius) ? best : null;
  }

  function endDrag(e){
    if(connectStartPath && e && typeof e.clientX === "number"){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      let endTd = el && el.closest ? el.closest("td.num") : null;
      if(!endTd || !endTd.classList.contains("num-marked")){
        // 手指放開的位置沒有剛好精準壓在另一個指定號碼上，改成找
        // 附近（30px 內）最近的一個指定號碼，讓連接線手勢更好瞄準、
        // 不用像素級精準才畫得出來。
        endTd = findNearestMarkedCell(e.clientX, e.clientY, pathKey(connectStartPath));
      }
      if(endTd && endTd.classList.contains("num-marked")){
        const endPath = pathOf(endTd);
        if(pathKey(endPath) !== pathKey(connectStartPath)){
          addConnection(connectStartPath, endPath);
        }
      }
    }
    connectStartPath = null;
    dragStartX = null; dragStartY = null; dragActive = false; dragTouchedKeys = null;
    dragMaxX = null; dragMinX = null; dragConfirmed = false;
  }
  panels.addEventListener("pointerup", endDrag);
  panels.addEventListener("pointercancel", function(){ connectStartPath = null; endDrag(); });
  // pointerleave 在觸控裝置上不一定只會在手指真的放開時觸發一次，
  // 尤其「定期」模式內容被放大很多倍之後，拖曳途中更容易觸發好幾次
  // pointerleave（手指還壓著，只是暫時滑出某個判定範圍）。如果每次
  // pointerleave 都嘗試畫線，會畫出好幾條不對的線。改回只在真的放開
  // 時（pointerup／pointercancel）才嘗試畫線，pointerleave 只負責
  // 把這次手勢作廢，不嘗試畫線。
  panels.addEventListener("pointerleave", function(){ connectStartPath = null; endDrag(); });

  // 第四招：長按空白（未開獎）格子，彈出01~39號碼選擇框，選一個號碼
  // 直接填進那一格，把它從「未開獎的空白格」變成一般看得到號碼的格子。
  const LONG_PRESS_MS = 550;
  const LONG_PRESS_MOVE_TOLERANCE = 10; // 超過這個距離就不算長按，當作滑動/其他手勢
  let longPressTimer = null;
  let longPressStartX = null, longPressStartY = null, longPressTargetTd = null;

  function cancelLongPress(){
    clearTimeout(longPressTimer);
    longPressTimer = null;
    longPressTargetTd = null;
  }

  panels.addEventListener("pointerdown", function(e){
    if(!document.body.classList.contains("magnifier-mode")) return;
    const td = e.target.closest("td.num.pending");
    if(!td) return;
    longPressStartX = e.clientX;
    longPressStartY = e.clientY;
    longPressTargetTd = td;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function(){
      if(longPressTargetTd) openNumPicker(longPressTargetTd);
      longPressTimer = null;
    }, LONG_PRESS_MS);
  });
  panels.addEventListener("pointermove", function(e){
    if(!longPressTimer) return;
    const dist = Math.hypot(e.clientX - longPressStartX, e.clientY - longPressStartY);
    if(dist > LONG_PRESS_MOVE_TOLERANCE) cancelLongPress();
  });
  panels.addEventListener("pointerup", cancelLongPress);
  panels.addEventListener("pointercancel", cancelLongPress);
  panels.addEventListener("pointerleave", cancelLongPress);

  const numPickerOverlay = document.getElementById("num-picker-overlay");
  const numPickerGrid = document.getElementById("num-picker-grid");
  const numPickerCancel = document.getElementById("num-picker-cancel");
  let numPickerTargetTd = null;

  // 4列、每列10個，前39格是01~39號碼（第4列是31~39），第40格顯示✕
  // （點下去等於取消，不選任何號碼）。
  if(numPickerGrid && !numPickerGrid.children.length){
    for(let n = 1; n <= 39; n++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = String(n).padStart(2, "0");
      btn.addEventListener("click", function(){
        applyNumPickerChoice(n);
      });
      numPickerGrid.appendChild(btn);
    }
    const xBtn = document.createElement("button");
    xBtn.type = "button";
    xBtn.textContent = "✕";
    xBtn.setAttribute("aria-label", "取消");
    xBtn.addEventListener("click", closeNumPicker);
    numPickerGrid.appendChild(xBtn);
  }

  function openNumPicker(td){
    numPickerTargetTd = td;
    numPickerOverlay.classList.add("open");
  }
  function closeNumPicker(){
    numPickerOverlay.classList.remove("open");
    numPickerTargetTd = null;
  }
  // 第四招填的號碼本來只是直接改在畫面上的DOM，沒有被記錄下來，首頁
  // 每60秒會自動重新抓資料、重畫整個開獎單，重畫時這些手動填的號碼
  // 就會跟著消失。這裡額外用一個陣列把「哪一格填了什麼號碼」記錄下
  // 來，重畫完之後可以呼叫 reapplyNumPickedEntries() 補回去。
  let numPickedEntries = []; // [{path, value}]

  // 填一格第四招的號碼，count>=2時額外在號碼右上方疊一個小小的累加數
  // （字體只有數字本身的1/8大小），代表這個號碼在其他空白格也被選過
  // 幾次。count最多只會顯示到9（累加數字本身沒有上限，只是畫面顯示
  // 上限制在9，避免兩位數的累加數在那麼小的字體下擠不下、看不清楚）。
  function fillNumPickedCell(td, n, count){
    let html = '<span class="cell-shift">' + String(n).padStart(2, "0") + '</span>';
    if(count >= 2){
      html += '<span class="pick-dup-badge">' + Math.min(count, 9) + '</span>';
    }
    td.innerHTML = html;
    td.classList.remove("pending");
    td.classList.add("num-picked");
  }
  // 把一格還原成單純的空白（未開獎）格，用在「這一格是重複號碼、
  // 不顯示選到的號碼」以及「重新整理前先清空全部格子」的情況。
  function clearNumPickedCell(td){
    td.innerHTML = "&nbsp;";
    td.classList.remove("num-picked");
    td.classList.add("pending");
  }
  // 重新整理「所有」第四招填過的格子——不是單純逐格獨立填色，而是
  // 先把每一格資料按「選的號碼」分組，同一個號碼如果在多個空白格
  // 被選過，只有「使用者最後（最新）填的那一格」（不是看格子在
  // 表格上的日期先後，是看實際操作順序：最新選的那一格）會真的
  // 顯示號碼＋累加數；比較早選的那些格子完全不顯示選到的號碼
  // （維持空白的樣子）。numPickedEntries這個陣列本身就是照使用者
  // 實際操作順序累加的（新選的用push加到最後面），所以分組時维持
  // 陣列原本的順序、不用額外排序，分組後每組的「最後一筆」自然就
  // 是最新選的那筆。每次新增/刪除/重新載入都整批重算一次，才能

    });

        // 最新一期之後，最多只留5列空白（未開獎）期數，多的藏起來。
        rows[i].style.display = "none";
        recentHiddenEls.push(rows[i]);
      }
    }

    // CSS 的 width:fit-content 在部分手機瀏覽器上可能支援不夠好，直接
    // 用量出來的實際內容寬度明確設定，確保外框一定貼齊、不會留一大片
    // 空白。用 requestAnimationFrame 等隱藏動作真的套用、版面重新排好
    // 之後再量，量到的才會是正確的寬度。
    requestAnimationFrame(function(){
      // 使用者要求「16方塊區」（含裡面所有文字跟表格）全螢幕顯示——
      // 原本CSS寫死的scale(4.558, 3.9)是抓一個固定倍率，沒辦法保證
      // 剛好填滿當下這支手機的實際螢幕大小（不同手機螢幕尺寸不一
      // 樣）。改成JS動態算：先把縮放關掉，量出內容「原始未縮放」的
      // 寬高，跟目前螢幕的實際可視寬高（window.innerWidth/Height）
      // 比較，算出剛好填滿整個螢幕需要的縮放倍率，直接套用成行內
      // transform（蓋過CSS那組寫死的固定倍率）。
      panels.style.transform = "none";
      const naturalW = panels.getBoundingClientRect().width;
      const naturalH = panels.getBoundingClientRect().height;
      if(naturalW > 0 && naturalH > 0){
        const scaleX = window.innerWidth / naturalW;
        const scaleY = window.innerHeight / naturalH;
        panels.style.transform = "translateX(-3%) scale(" + scaleX + ", " + scaleY + ")";
      } else {
        // 量不到原始尺寸（理論上不該發生），退回CSS原本寫死的倍率，
        // 清空行內transform讓CSS的規則生效。
        panels.style.transform = "";
      }
      const w = panels.getBoundingClientRect().width;
      const h = panels.getBoundingClientRect().height;
      if(w > 0){
        // 外框左邊往右縮1%：右邊界維持不動，寬度跟著少掉那1%、
        // 左邊留白補上對應的量；整體（含外框）再往左平移0.1%、
        // 向下平移0.5%。
        const shrink = w * 0.01;
        const shift = w * 0.001;
        // 「16方塊區」水平方向往左平移0.2%（先前已經套用）。
        const shiftLeft = w * 0.002;
        // 先前已經套用過「往右0.2%、往上0.2%」這一輪。
        const shiftRight1 = w * 0.002;
        const shiftUp1 = h * 0.002;
        // 使用者要求「就現在的位置」再整體往右平移0.3%、往上平移
        // 0.3%——在原本（已經往左0.2%、往右0.2%、往上0.2%）的
        // 基礎上再疊加，不是取代。
        const shiftRight2 = w * 0.003;
        const shiftUp2 = h * 0.003;
        // 使用者要求「就現在的位置」把左邊界向右縮減0.3%——這跟前面
        // 的「整體平移」不一樣，平移是左右邊界一起動、寬度不變；
        // 這裡只有左邊界往右收，右邊界維持不動，所以margin-left要
        // 增加0.3%、同時width要跟著減少同樣的0.3%（右邊界＝
        // margin-left+width，要維持不變，兩個值要一起調整）。
        const shrinkLeftOnly = w * 0.003;
        scrollerEl.style.marginLeft = (shrink - shift - shiftLeft + shiftRight1 + shiftRight2 + shrinkLeftOnly) + "px";
        // 「16方塊區」寬度向右延伸6%改成從內容本身（.panels的水平
        // 縮放倍率）下手，這裡量到的w已經反映了變寬之後的實際寬度，
        // 外框自動跟著變寬，不需要額外再加一個外框專屬的延伸值。
        scrollerEl.style.width = Math.ceil(w - shrink - shrinkLeftOnly) + "px";
        scrollerEl.style.marginTop = (h * 0.01 - shiftUp1 - shiftUp2) + "px";
        // transform:scale() 只改變視覺呈現，不會讓外框認知到內容真的
        // 變高了，外框還是照縮放前的高度去算，才會把縮放後多出來的
        // 部分裁掉。這裡明確設定外框高度＝實際量到、已經縮放過的高度，
        // 才不會被截斷。
        scrollerEl.style.height = Math.ceil(h) + "px";
      }
      // 縮放狀態改變之後，已經畫好的連接線也要重新算一次位置——不然
      // 線條可能還停留在改變之前算好的舊座標，在畫面上看起來像消失了
      // （其實只是位置沒對上），要等下次別的操作觸發重繪才會補上來。
      renderConnections();
    });
  }

  // 首頁每60秒會自動重新抓資料、重畫開獎單（見 loadData），重畫會把
  // #panels 整個換成新節點，導致「定期」模式做的隱藏/縮放/外框調整、
  // 還有目前的標記狀態全部被清空、打回原樣。這裡對外露出一個補救用
  // 的函式，讓 loadData 重畫完之後可以呼叫，把目前畫面該有的狀態
  // 重新套用回去。
  window.__reapplyMagnifierState = function(){
    // 標記／連接線（第一二三招）不管當下在不在抓牌模式都要重新套用
    // ——它們本來就是首頁、抓牌共用同一份開獎單、同一套顯示邏輯，

    // 自動補回來，因為這段補救邏輯連跑都沒跑到。
    applyMarksToClone(); // 內部會一併呼叫 renderConnections()，標記跟連接線一起復原

    // 版面調整。
    // 不完全信任內部的 recentOnly 變數（可能在重畫過程中跟畫面實際
    // 顯示的按鈕狀態不同步），改成直接看「定期」按鈕當下是不是亮著
    // （armed）金色，用這個當作唯一的真實依據，兩邊才不會兜不起來。
    recentOnly = periodBtn.classList.contains("armed");
    applyRecentOnly();
  };
  // 四招標記（指定號碼、連接線、廣泛、返回歷史、第四招填的號碼）
  // 是539跟天天樂各自獨立的，切換分頁不可以沿用對方的標記——539的
  // 標記只屬於539，天天樂的標記只屬於天天樂。這裡對外露出兩個函式，
  // 讓 setupGameTabs() 在切換分頁的當下，先把「現在正要離開的那個
  // 玩法」的標記狀態存起來，再把「現在正要切過去的那個玩法」上次
  // 存的標記狀態（第一次切過去就是空的）讀回來，取代畫面上目前的
  // 狀態，兩邊才不會互相沿用。
  const gameMarkStash = {
    "539": { pickedPaths: [], connections: [], broadened: false, historyStack: [], numPickedEntries: [] },
    daily: { pickedPaths: [], connections: [], broadened: false, historyStack: [], numPickedEntries: [] },
    mark6: { pickedPaths: [], connections: [], broadened: false, historyStack: [], numPickedEntries: [] },
    lotto: { pickedPaths: [], connections: [], broadened: false, historyStack: [], numPickedEntries: [] }
  };
  window.__saveGameMarkState = function(gameKey){
    if(!gameMarkStash[gameKey]) return;
    gameMarkStash[gameKey] = { pickedPaths: pickedPaths, connections: connections, broadened: broadened, historyStack: historyStack, numPickedEntries: numPickedEntries };
  };
  window.__loadGameMarkState = function(gameKey){
    const stash = gameMarkStash[gameKey] || { pickedPaths: [], connections: [], broadened: false, historyStack: [], numPickedEntries: [] };
    pickedPaths = stash.pickedPaths;
    connections = stash.connections;
    broadened = stash.broadened;
    historyStack = stash.historyStack;
    numPickedEntries = stash.numPickedEntries;
    updateToolbarState();
  };
  // 放大鏡自己的兩指縮放（pageZoom，在 applyPageZoom() 裡）是獨立在
  // 外層的另一個函式，摸不到這裡面的 renderConnections。額外曝露一個
  // 全域版本，讓縮放的時候可以呼叫，重新計算連接線的位置＋粗細，
  // 確保線條會即時跟著螢幕上實際的縮放程度同步變化，不會停在縮放前
  // 算好的舊尺寸。
  window.__renderConnections = renderConnections;
  // 第四招填的號碼不管放大鏡有沒有開都要在重畫後補回去（不像標記/
  // 連接線只在放大鏡打開時才顯示），所以額外獨立掛一個全域函式。
  window.__reapplyNumPicked = reapplyNumPickedEntries;

  let periodExitClickTime = 0;
  const PERIOD_EXIT_DOUBLE_TAP_MS = 400;
  function activatePeriodMode(){
    document.body.classList.remove("no-cell-shift"); // 定期真的套用時，恢復上移左移的效果
    recentOnly = true;
    periodBtn.classList.toggle("armed", true);
    applyRecentOnly();
    if(!viewPinned) setPinned(true);
    if(!fullDisplay){ fullDisplay = true; applyFullDisplay(); }
    window.scrollTo(0, 0);
    // 「定期」啟動時，存檔／返回／清除三顆浮動按鍵維持顯示、正常
    // 可以用——存檔（saveAsImage()）內部本來就有依照目前是不是在
    // 「定期」狀態去判斷該用哪一套擷取邏輯，就算在「定期」裡按
    // 存檔，也會正確存出「定期」該有的畫面，不需要另外準備一顆

    // 現在在「定期」狀態——這顆本身就是連點兩下離開定期的其中一個

    pinBtn.style.display = "none";
    recentClearBtn.style.display = "none";
    recentShotBtn.style.display = "none";
    requestAnimationFrame(updateButtonOverlapGuard);
