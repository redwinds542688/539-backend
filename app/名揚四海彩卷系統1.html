<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>今彩539</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<style>
  :root{
    --gold:#E8B800;
    --ink:#1a1a1a;
    --ink-dim:#666666;
    --line:#8c8c8c;
    --wd-gray:#c8c8c8;
    --wd-text:#141414;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{ overscroll-behavior-y:contain; }
  html,body,*{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  body{
    background:#e9e9e9;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:24.7px;
    overflow-x:hidden;
    touch-action:pan-x pan-y;
    overscroll-behavior-y:none;
  }
  body.pinch-fullscreen-mode{
    overscroll-behavior:none;
  }
  #page-zoom-wrap{
    transform-origin:0 0;
    width:max-content;
    min-width:100%;
  }
  #page-zoom-wrap{
    margin-left:0;
  }
  #home-fixed-top{
    position:fixed;
    top:0; left:0;
    width:100%;
    z-index:500;
    background:#e9e9e9;
    margin-left:0;
    box-sizing:border-box;
  }
  body.magnifier-mode #home-fixed-top{
    display:none;
  }
  #page-zoom-spacer{
    position:absolute;
    top:0; left:0;
    width:1px; height:1px;
    opacity:0;
    pointer-events:none;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  #portrait-lock-overlay{
    display:none;
    position:fixed; inset:0; z-index:99999;
    background:#000; color:#fff;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    font-size:16px; line-height:1.8;
  }
  @media (orientation:landscape){
  }
  #header-top-bg-wrap{
    position:fixed;
    top:0; left:0; right:0;
    z-index:900;
    background:#e9e9e9;
    display:none;
  }
  body.magnifier-mode #header-top-bg-wrap{
    display:block;
  }
  body.magnifier-mode.recent-only-mode #header-top-bg-wrap{
    display:none;
  }
  body.magnifier-mode #header-top-bg-wrap header.top{
    position:static;
  }
  header.top{ padding:0 0 6px; margin:0 0.5%; }
  .brand{ display:flex; flex-direction:column; gap:2px; position:relative; }
  .brand-title-overlay{
    position:static; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#1a1a1a; letter-spacing:1px; white-space:nowrap;
    overflow:visible; pointer-events:none; line-height:1.15;
  }
  .brand-title-overlay .rc{ display:inline-block; text-shadow:0 1px 2px rgba(0,0,0,0.45), 0 0 6px rgba(255,255,255,0.25); }

  .brand h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:0.5px; color:var(--gold);}
  .game-tabs{ display:flex; gap:5px; width:100%; }
  .game-tabs button{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:3px;
    background:#111; border:1.5px solid var(--gold); color:#fff;
    border-radius:6px; padding:5px 4px;
    font-size:min(4vw, 15px); font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    -webkit-tap-highlight-color:transparent;
  }
  .game-tabs button.active{ background:var(--gold); color:#000; }
  .game-tabs button.spinning{ animation:pulseFade 0.6s ease-in-out infinite; }
  @keyframes pulseFade{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }
  .coming-soon{
    margin:12px 14px; padding:40px 16px; text-align:center;
    background:#ffffff; border:1.2px solid #000; border-radius:4px;
    color:var(--ink-dim); font-size:13px; line-height:1.8;
  }
  .coming-soon strong{ display:block; font-size:16px; color:var(--ink); margin-bottom:6px; }
  .brand span.tag{
    font-size:10px; color:#000; background:var(--gold); font-weight:700;
    padding:2px 7px; border-radius:4px; letter-spacing:0.5px; white-space:nowrap;
  }
  .sub{ font-size:11px; color:var(--ink-dim); margin-top:4px; line-height:1.5; }
  .hero{
    margin:0 0.5%; background:#ffffff; border:2px solid #000; border-radius:4px;
    padding:10px 12px;
    display:flex; flex-direction:column; gap:10px;
    outline:3px solid #ffffff; outline-offset:0;
    position:relative;
  }
  #hero-nine-grid{
    display:none;
    flex:1;
    min-height:0;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:6px;
    width:100%;
  }
  #hero-nine-grid button{
    width:100%; height:100%;
    min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:#111; color:#fff; border:1.5px solid var(--gold); border-radius:4px;
    font-size:9px;
    overflow:hidden;
    padding:0;
  }
  .hero-label{ font-size:10px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; }
  .hero-left{ min-width:0; }
  .hero-date-row{ display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between; gap:6px; }
  .hero-date{ font-size:13px; font-weight:600; margin-top:2px; display:inline-block; }
  .data-update-btn{
    background:#000; border:1.5px solid #33D17A; color:#fff;
    border-radius:6px; font-size:10px; font-weight:700; line-height:1.2;
    padding:3px 8px; white-space:nowrap; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .data-update-btn:disabled{ opacity:0.5; }
  .hero-controls-row{
    display:flex; gap:8px; align-items:stretch;
  }
  .clean-sheet-btn{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center;
    background:#000; border:2.5px solid #33D17A; color:#fff;
    border-radius:8px; font-size:34px; font-weight:700;
    padding:8px 4px;
    -webkit-tap-highlight-color:transparent;
  }
  .clean-sheet-btn.saving{ opacity:0.6; }
  .paper-size-menu{
    background:#fff; border:1.5px solid #e02020; border-radius:8px;
    padding:8px; z-index:999;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    flex-direction:column; align-items:stretch; gap:6px;
    width:120px;
  }
  .paper-size-menu-title{
    font-size:11px; color:#666; text-align:center; font-weight:700;
  }
  .paper-size-option{
    background:#fff; border:1.5px solid #e02020; color:#000;
    border-radius:6px; font-size:14px; font-weight:700;
    padding:6px 0; -webkit-tap-highlight-color:transparent;
  }
  .paper-size-option.active{ background:#e02020; color:#fff; }
  .hero-balls{ display:flex; gap:5.5px; margin-top:22px; flex-wrap:wrap; }
  .ball{
    width:48px; height:48px; border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #ffb3b3 0%, #ff6b6b 22%, #e01e1e 55%, #a30000 82%, #700000 100%);
    box-shadow:
      inset -3px -3px 6px rgba(0,0,0,0.35),
      inset 2px 2px 3px rgba(255,255,255,0.7),
      0 2px 3px rgba(0,0,0,0.3);
    display:flex; align-items:center; justify-content:center;
    font-family:Arial,Helvetica,sans-serif; font-size:30px; font-weight:700; color:#FFD700;
    text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .ball.ball-special{
    background:
      radial-gradient(circle at 32% 28%, #b3d1ff 0%, #6ba3ff 22%, #1a5ce0 55%, #0033a3 82%, #001f66 100%);
    color:#E8E8E8; text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  body.game-mark6 .ball:not(.ball-special){
    background:
      radial-gradient(circle at 32% 28%, #b3d1ff 0%, #6ba3ff 22%, #1a5ce0 55%, #0033a3 82%, #001f66 100%);
  }
  body.game-mark6 .ball.ball-special{
    background:
      radial-gradient(circle at 32% 28%, #b3f0c2 0%, #6bd98a 22%, #1ea34a 55%, #0a6b2e 82%, #04471d 100%);
  }
  body.game-lotto .ball:not(.ball-special){
    background:
      radial-gradient(circle at 32% 28%, #b3f0c2 0%, #6bd98a 22%, #1ea34a 55%, #0a6b2e 82%, #04471d 100%);
  }
  body.game-daily .ball{
    background:
      radial-gradient(circle at 32% 28%, #e8d5f7 0%, #cda3ee 22%, #a866d9 55%, #7a3ba3 82%, #4d1f6b 100%);
  }
  .ball.ball-red{
    background:
      radial-gradient(circle at 32% 28%, #ffb3b3 0%, #ff6b6b 22%, #e01e1e 55%, #a30000 82%, #700000 100%);
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .ball.ball-blue{
    background:
      radial-gradient(circle at 32% 28%, #b3d1ff 0%, #6ba3ff 22%, #1a5ce0 55%, #0033a3 82%, #001f66 100%);
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .ball.ball-green{
    background:
      radial-gradient(circle at 32% 28%, #b3f0c2 0%, #6bd98a 22%, #1ea34a 55%, #0a6b2e 82%, #04471d 100%);
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .toolbar{ margin:12px 14px 0; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .toolbar button.pill{
    display:flex; align-items:center; gap:6px;
    background:#111; border:1px solid var(--gold); color:var(--gold);
    border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600;
  }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .blank-stepper{
    flex:2; min-width:0;
    display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px;
    background:#fff; border:2.5px solid #e02020; border-radius:8px; padding:8px 6px;
  }
  .blank-stepper button{
    width:38px; height:38px; border-radius:8px; border:2px solid #3FA9FF;
    background:transparent; color:#3FA9FF; font-size:26px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .blank-stepper button:active{ background:#3FA9FF; color:#000; }
  .blank-stepper button:disabled{ opacity:0.3; }
  .blank-stepper .count{
    min-width:38px; text-align:center; font-family:Arial,Helvetica,sans-serif;
    font-size:34px; font-weight:700; color:#33D17A;
  }
  .catch-card-btn{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center;
    background:#000; border:2.5px solid #33D17A; color:#fff;
    border-radius:8px; font-size:34px; font-weight:700;
    padding:8px 4px;
    -webkit-tap-highlight-color:transparent;
  }
  .scroller{
    margin:0 0.5%; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:6px; border:1.5px solid #000; border-radius:4px;
  }
  .panels{ display:flex; gap:0; width:max-content; zoom:0.59; }
  .panel{ border-right:0.9px solid #000; }
  .panel:last-child{ border-right:none; }
  .panel-head{
    background:#ffffff; color:#000; font-weight:700; font-size:13px;
    text-align:center; padding:6px 0; letter-spacing:6.5px;
    border-bottom:1px solid #bbb;
  }
  table.road{ border-collapse:collapse; background:#ffffff; table-layout:fixed; }
  table.road td{
    border-right:1px solid #bbb;
    border-bottom:1px solid #bbb;
    font-size:11px; line-height:1; text-align:left; vertical-align:middle; color:#000;
    padding:0 0 0 2px; height:19.752px; overflow:hidden; white-space:nowrap;
  }
  body.game-wide table.road td{ height:21.947px; }
  table.road td.day{
    width:16.22px; min-width:16.22px; max-width:16.22px; color:#555; font-family:"DejaVu Sans Mono","Roboto Mono",monospace; font-size:5.2px; font-weight:400;
    text-align:center; padding:0;
  }
  table.road td.day.first-of-month{
    color:#1a4fb0; font-weight:600; padding:0; text-align:center;
  }
  table.road td.day.first-of-month .fom{
    display:inline-block; font-size:9px; font-family:Arial,Helvetica,sans-serif;
    transform:translate(0%, 10%) scale(0.48); transform-origin:center center; white-space:nowrap; vertical-align:middle;
  }
  table.road tr.future td.day{ color:#555; }
  table.road tr.month-start td{
    box-shadow: inset 0 0.6px 0 0 #000 !important;
  }
  table.road td.wd{ width:11.89px; min-width:11.89px; max-width:11.89px; padding:1px; text-align:center; background:#e2e2e2; }
  body.capturing-save-only table.road td.wd{
    border-right:1.0px solid #bbb;
  }
  table.road td.wd .badge{
    width:9px; height:9px; border-radius:2px; margin:0 auto;
    display:flex; align-items:center; justify-content:center; font-size:4.9px; font-weight:400;
    background:#e2e2e2; color:#000;
    font-family:"Noto Sans TC","PingFang TC",sans-serif;
  }
  table.road td.wd.mon-cell{ background:#666666; }
  table.road td.wd.mon-cell .badge.mon{ background:#666666; color:#fff; box-sizing:border-box; transform:translate(-5%, 10%); }
  table.road tr.future td.wd .badge{ opacity:0.4; }
  .cell-shift{ display:inline-block; transform:translate(-10%, -10%); }
  table.road td.num .cell-shift{ transform:translate(0%, 10%); }
  table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(0%, 10%); }
  table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(-5%, 0%); }
  body.recent-only-mode .cell-shift{ transform:translate(-10%, -10%) scale(1.3); }
  body.recent-only-mode table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(-10%, 15%) scale(1.3); }
  body.recent-only-mode table.road td.num .cell-shift{ transform:translate(0%, 10%) scale(1.3); }
  body.recent-only-mode table.road td.wd .badge.mon{ transform:translate(0%, 10%) scale(1.3); }
  body.recent-only-mode table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(0%, 0%) scale(1.3); }
  body.recent-only-mode table.road td.day.first-of-month .fom{ transform:translate(10%, 15%) scale(0.48) scale(1.3); }
  body.recent-only-mode table.road td.num{
    font-family:"Courier New",Courier,Arial,Helvetica,sans-serif;
    font-size:9.072px;
  }
  body.recent-only-mode.capturing-plain .cell-shift{ transform:translate(-10%, -10%); }
  body.recent-only-mode.capturing-plain table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(-20%, -37%); }
  body.recent-only-mode.capturing-plain table.road td.num .cell-shift{ transform:translate(-20%, -35%); }
  body.recent-only-mode.capturing-plain table.road td.wd.mon-cell .badge.mon{ transform:translate(-15%, -14%); }
  body.recent-only-mode.capturing-plain table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(-15%, -20%); }
  body.capturing-plain table.road td.num{ font-size:8.168px; }
  body.recent-only-mode.capturing-plain table.road td.day.first-of-month .fom{ transform:translate(5%, -23%) scale(0.48); }
  body.capturing-plain .scroller{ border-radius:0; }
  body.capturing-save-only .cell-shift{ transform:translate(-10%, -10%); }
  body.capturing-save-only table.road td.num .cell-shift{ transform:translate(0%, 10%); }
  body.capturing-save-only table.road td.day:not(.first-of-month) .cell-shift{ transform:translate(0%, 10%); }
  body.capturing-save-only table.road td.wd .badge.cell-shift:not(.mon){ transform:translate(-5%, 0%); }
  body.capturing-save-only table.road td.wd.mon-cell .badge.mon{ transform:translate(-5%, 10%); }
  body.capturing-save-only table.road td.day.first-of-month .fom{ transform:translate(0%, 10%) scale(0.432); transform-origin:center center; } 
  body.capturing-save-only table.road td.num{ font-size:11.8512px; }
  body.capturing-save-only.game-wide table.road td.num{ font-size:13.1682px; }
  body.capturing-save-only .panel-head{ padding:1.8px 0 10.2px; }
  body.capturing-save-only .panels{ transform:scaleY(1.01); transform-origin:top left; }
  body.capturing-save-only .cell-shift{ color:transparent !important; }
  body.capturing-plain table.road td.num.num-marked,
  body.capturing-save-only table.road td.num.num-marked{ outline:none !important; }
  body.capturing-plain table.road td.num.num-marked.num-marked-click::before{
    background:transparent !important;
    border:none !important;
  }
  body.capturing-save-only table.road td.num.num-marked.num-marked-click::before{
    background:transparent !important;
    border:none !important;
  }
  body.capturing-save-only .scroller{ border-width:0.9px; border-radius:0; }
  body.capturing-save-only .panel{ border-right-width:0.54px; }
  body.capturing-save-only table.road tr.month-start td{ box-shadow: inset 0 1.5px 0 0 #000 !important; }
  body.capturing-plain table.road tr.month-start td{ box-shadow:none !important; }
  body.capturing-clean-sheet table.road td.num.num-marked{
    background:transparent !important;
    border-top:none !important; border-left:none !important;
    border-right:1px solid #bbb !important; border-bottom:1px solid #bbb !important;
  }
  body.capturing-clean-sheet table.road td.num.num-marked::before{
    display:none !important;
  }
  body.capturing-clean-sheet table.road td.num.num-picked{
    background:transparent !important;
  }
  body.no-cell-shift .cell-shift{ transform:none; }
  body.no-cell-shift table.road td.wd .badge.mon{ transform:none; }
  body.no-cell-shift table.road td.day.first-of-month .fom{ transform:scale(0.48); }
  table.road td.num{
    width:28.12px; min-width:28.12px; max-width:28.12px; font-weight:700;
    font-family:"Roboto Mono","DejaVu Sans Mono","Courier New",monospace;
    font-size:15.802px; color:#000; font-variant-numeric:tabular-nums;
    text-align:center; padding:0;
  }
  body.game-wide table.road td.num{
    width:28.168px; min-width:28.168px; max-width:28.168px;
    font-size:17.558px;
  }
  table.road td.num.special{ background:#e8e8e8; }
  body.capturing-save-only table.road td.num.special{
    border-left:1.0px solid #333;
  }
  table.road td.num.special.pending{ background:transparent; }
  table.road td.num.pending{ color:#ccc; background:transparent; font-weight:400; }
  table.road td.num.num-picked{ background:#fff !important; color:var(--mark-predict-color, #FF3B3B) !important; font-weight:700; position:relative; }
  table.road td.num.num-picked .pick-dup-badge{
    position:absolute;
    top:0; right:1px;
    font-size:0.5em;
    line-height:1;
    font-weight:700;
    font-family:Arial, Helvetica, sans-serif;
    color:#FF3B3B !important;
    pointer-events:none;
    z-index:2;
  }
  table.road tr.highlight td.num{ background:#fff2b0; color:#000; }
  footer.legend{
    margin:16px 14px 8px; font-size:10.5px; color:var(--ink-dim);
    display:flex; flex-wrap:wrap; gap:6px 10px;
  }
  footer.legend .lg{ display:flex; align-items:center; gap:4px; }
  footer.legend .dot{ width:9px; height:9px; border-radius:2px; background:var(--wd-gray); }
  footer.legend .dot.mon{ box-shadow:0 0 0 1.5px #FF2020; }
  .banner-note{
    margin:12px 14px 0; padding:8px 12px; border-radius:8px;
    background:#1a1600; border:1px solid #4a3f00; font-size:11px; color:var(--gold); line-height:1.6;
  }
  .img-overlay{
    position:fixed; inset:0; background:transparent; z-index:999;
    display:none; flex-direction:column;
    pointer-events:none;
  }
  #hint-bar-bg-wrap{
    position:fixed;
    left:0; right:0;
    background:#e9e9e9;
    z-index:998;
    display:none;
  }
  body.magnifier-mode #hint-bar-bg-wrap{
    display:block;
  }
  body.magnifier-mode.recent-only-mode #hint-bar-bg-wrap{
    display:none;
  }
  #pinch-fullscreen-close-btn{
    display:none;
    position:fixed;
    top:10px; left:10px;
    z-index:1200;
    width:36px; height:36px;
    border-radius:50%;
    background:#8a8a8a; color:#fff;
    border:1.5px solid #33D17A;
    font-size:18px; line-height:1;
    align-items:center; justify-content:center;
  }
  body.pinch-fullscreen-mode #pinch-fullscreen-close-btn{
    display:flex;
    top:calc(10px + 5vh);
  }
  body.pinch-fullscreen-mode #page-zoom-wrap{
    margin-top:5vh;
  }
  body.pinch-fullscreen-mode #game-539-content{
    border-top:3px solid #ffffff;
    box-sizing:border-box;
  }
  #full-page-function-zone-outline{
    display:none;
    position:fixed;
    border:3px solid #ffffff;
    background:#e9e9e9;
    box-sizing:border-box;
    z-index:400;
    pointer-events:none;
  }
  body.pinch-fullscreen-mode #full-page-function-zone-outline{
    display:block;
  }
  body.pinch-fullscreen-mode #header-top-bg-wrap,
  body.pinch-fullscreen-mode #hint-bar-bg-wrap,
  body.pinch-fullscreen-mode .img-overlay .img-game-tabs,
  body.pinch-fullscreen-mode .img-overlay .hint-bar{
    display:none !important;

這是「抓牌」畫面裡核心的號碼標記功能，共四種操作方式：
  第一招：雙擊已開獎的號碼格 → 紅底綠框圓形標記
    - 觸發：panels 的 dblclick 監聽器 → pickCell(td)
    - 資料存放：pickedPaths 陣列，每筆 { via:"click", ... }
  第二招：手指滑過整排號碼（橫向滑動）→ 矩形外框標記
    - 觸發：panels 的 pointerdown/pointermove → markCellForDrag(td) / unmarkCellForDrag(td)
    - 資料存放：pickedPaths 陣列，每筆 { via:"drag", ... }
  第三招：拖曳已標記的格子之間 → 自動算出藍色連接線
    - 觸發：panels 的另一組 pointerdown（需要 viewPinned 為 true）
    - 資料存放：connections 陣列
  第四招：長按未開獎的空白格 → 跳出選號盤，選完在格子右上角顯示累加數字
    - 觸發：panels 的長按 pointerdown → openNumPicker(td)
    - 資料存放：numPickedEntries 陣列

  ⚠️ 已知架構限制：四招的顯示都是透過 applyMarksToClone() 統一「清空重繪」，
  任何新功能如果要疊加標記樣式，務必透過 pickedPaths 登記，
  不要直接對 td 加 num-marked / num-marked-drag / num-marked-click 這三個 class，
  否則會被 applyMarksToClone() 的清空機制打架、互相覆蓋。

  四招的啟用總開關是 body 的 "magnifier-mode" class，只有在 activatePeriodMode()
  （定期十六/E式/C式）或抓牌首頁的 activateFloatingButtons()/showFullPageImage()
  正確加上這個 class 之後，四招的判斷式才會生效。這是原始版本就存在、後來修復的坑，
  詳見下方【七、修復紀錄】。

【二、定期十六 / E式 / C式 的關係】
  三者共用同一個進入函式 togglePeriodMode() → activatePeriodMode()：
  - 定期十六（period16Btn）：純粹放大顯示最近 16~21 期
  - E式（clearBtn，即「E式概率」按鈕）：目前程式碼上跟定期十六完全一樣，
    沒有獨立的 E 式運算邏輯，只是另一個標籤/入口
  - C式（broadBtn）：在 togglePeriodMode() 之外，額外呼叫 applyCModeAutoFraming()
    疊加一層「定/差/合」分析（cModeActive = true）

  C 式啟用時（cModeActive = true）：
  - 一二三四招全部鎖住（pickCell / markCellForDrag / unmarkCellForDrag /
    長按 pointerdown / dblclick 的 num-picked 分支，都加了 if(cModeActive)return; 判斷）
  - 進入 C 式：resetAllFourMoveMarks() 清空之前定期十六階段留下的四招痕跡
  - 離開 C 式：forceExitCModeIfActive() 統一處理解鎖 + 清空，唯一入口，
    被 togglePeriodMode 的退出分支、closeBtn 的點擊、以及 activateFloatingButtons()/
    showFullPageImage() 這兩個進入點共同呼叫，確保任何路徑離開都會正確解鎖

【三、統計表（長按「定」／長按「差」）】
  兩者用完全相同的九宮拖牌演算法（見 calcNineGridDrag），
  抓上桿(A)/下桿(B)往前推 cModeDingSearchSpan / cModeChaSearchSpan 期，
  比對候選格子跟 B 錨點列號碼的九宮拖牌關係，命中就計數。

  唯一差別在於「要不要先篩選格子的標記狀態」：
  - 長按「定」→ computeCModeDingStatCounts()：排除已標記的格子，
    只對「完全沒被標記」的候選格子做運算
  - 長按「差」→ computeCModeChaStatCounts()：只對「已經被標記」的格子做運算
  判斷「有沒有被標記」統一用 pickedPaths 陣列查詢（AB 上下桿標記、
  定/差/合各自的比對命中，都會登記進 pickedPaths）。

  統計表 UI：0-9 顏色數字表（顏色數字表變數，淺灰#E5E5E5 → 深紅#7A0000 共9階），
  數字出現次數越高顏色越深，最高分會綠色閃爍（pinBlink 動畫）。
  兩張統計表互斥：開一張會自動關閉另一張。
  拖曳上/下桿時，兩張表都會即時歸零/重新計算（resetCModeXxxStatDisplay / refreshCModeXxxStatDisplay）。

【四、瓢蟲除錯系統】
  左下角固定顯示的 🐞 按鈕（id="bug-log-fab"）：
  - 輕點：擷取「按下當下往前推 2 秒內」的所有事件記錄，存成 .txt 檔案下載
  - 長按（約0.5秒）：打開完整記錄檢視器（可捲動、複製全部、清空）
  全域函式 logEvent(tag, detail) 會把事件寫入記憶體陣列 bugLog（最多留1500筆），
  同時每0.5秒同步一份到 localStorage（key: 539app_bugLog），
  window.onerror / unhandledrejection 也會自動記錄 JS 錯誤堆疊。

  瓢蟲在畫面上的位置由 positionPinOnScreen() 動態決定，共有四種【各自獨立】的排列分支：
  1. C 式啟用中：定/差/🐞/合/期，5顆按鍵，瓢蟲在正中間
  2. 定期十六／E式（非 C 式）：同樣5顆排列，但獨立判斷（看 recentOnly），不跟 C 式共用邏輯
  3. 抓牌首頁（進入定期十六前的九宮格過場）：同樣5顆排列，獨立判斷 img-overlay 的 open class
  4. 一般首頁：瓢蟲固定在左下角(6px, 6px)

【五、資料讀取／存檔機制】
  - 存檔：手動輸入、雲端同步新增開獎記錄時，只會寫入 localStorage
    （saveDbToLocalStorage）跟 IndexedDB（saveDrawRecordToDB），
    不會再觸發任何檔案下載（exportLotteryDatabaseAsFile 已整個移除）。
  - 讀取：App 開機時，boot() 一開始就先 await loadLotteryLocalDBIntoEmbedded()，
    確保 localStorage/IndexedDB 的資料在畫面第一次渲染之前就已經套用完成，
    避免「先顯示舊資料、才跳成新資料」的閃爍。
    此函式內部會兩邊都讀（先套用 localStorage，再套用 IndexedDB），
    用時間戳記（_savedAt）比對新舊，永遠留下最新的一筆，
    避免任何一邊資料比較新卻被忽略的情況。
  - 雲端同步：manualUpdateAndMergeData()（開機執行）+ runScheduledCloudChecks()
    （每60秒排程檢查，涵蓋539/天天樂/六合彩/大樂透四種玩法在特定時段自動抓取），
    此機制依賴外部雲端服務（hearty-vitality-production-0687.up.railway.app），
    若雲端資料庫本身還沒更新，App 端不會有資料可抓，需另外確認雲端來源是否已更新。

【六、截圖／存檔／印單機制】
  這是把畫面上的開獎單/標記結果匯出成圖片檔的功能，跟【五】的本機資料庫存檔是完全不同的兩件事：
  - saveAsImage()：對應「存」按鈕（floatSaveBtn 一般模式下雙擊、或 saveBtn），
    用 html2canvas 擷取 scrollerEl（整個表格區域），輸出成 PNG 下載
  - saveCleanSheetImage()：對應首頁的「印」按鈕（cleanSheetBtn）長按/雙擊，
    產生給列印用的乾淨版面
  - 兩者都共用 html2canvas 這個第三方函式庫。注意：它其實是整包內嵌在本檔案
    第一個 <script> 區塊裡（約 198KB），並不是動態下載；ensureHtml2Canvas()
    只是回傳「全域 html2canvas 是否存在」的一個 Promise，沒有真的去載入任何東西。
  - 擷取過程會顯示一個全螢幕的「處理中…」遮罩（#capture-mask），沒有預覽步驟，
    處理完直接觸發瀏覽器下載

  ⚠️ 設計決策（重要）：C 式的覆蓋元素（紅色參考弧線、拖曳把手等）刻意設計成
  跟這兩個存檔函式「完全脫鉤」——saveAsImage()/saveCleanSheetImage() 裡沒有任何
  一行程式碼認識或處理 C 式的存在。原因是 C 式啟用時，一二三四招以及原本的
  存/印按鈕都已經被鎖住/替換成「定/差/合」，使用者操作上根本無法在 C 式畫面
  觸發這兩個存檔函式，所以不需要、也不應該讓存檔功能反過來認識 C 式的內部狀態。
  C 式覆蓋元素自己有 MutationObserver 監看 recent-only-mode class 自動清理
  （clearCModeOverlay()），這才是正確的清理責任歸屬。
  （這個決策的完整討論過程，包含中間一度加過、又刪除的 html2canvas 修補程式碼，
  詳見對話紀錄，這裡只記錄最終定案的架構原則。）

【七、修復紀錄（本次對話中修正的 bug）】
  1. 統計表打開時，標定號碼背景/圓形標記、差合連線弧線、上下桿紅色參考弧線
     被 CSS 強制隱藏 → 已移除 body.c-mode-stat-open 相關的隱藏規則
  2. 統計表打開時，renderCModeArcLoop() 內部另外寫死的判斷式會清空紅色參考弧線
     → 已移除該判斷式，弧線跟連線可同時顯示
  3. 抓牌/存檔功能使用 html2canvas 擷取整頁時，C 式的 position:fixed 覆蓋元素
     （紅色弧線、拖曳把手）會被錯誤拉伸到超長截圖上 → 最終方案是從源頭修正
     C 式自身的清理機制，不讓存檔功能認識/耦合 C 式
  4. 「一二三四招」在定期十六裡完全沒反應 → 根本原因是原始檔案從頭到尾都沒有
     任何程式碼會把 body.magnifier-mode 這個總開關 class 加上去（只有 remove，沒有 add），
     已在 activatePeriodMode() 加上遺漏的 document.body.classList.add("magnifier-mode")
  5. C 式的覆蓋元素在離開後可能沒有正確解鎖 cModeActive，導致定期十六裡的
     第二招被誤鎖 → 新增 forceExitCModeIfActive() 統一處理，多個進入/退出路徑
     都會呼叫這個函式確保狀態一致
  6. 手動輸入開獎號碼後會自動觸發 JSON 資料庫下載通知 → exportLotteryDatabaseAsFile()
     整個函式已移除，改為只寫入 localStorage/IndexedDB
  7. 開機讀取本機資料庫的順序調整為「先套用 localStorage，再套用 IndexedDB，
     用時間戳比新舊」，並把資料載入時機提前到畫面渲染之前

【八、效能／記憶體優化紀錄（2026-08-21）】
  背景：使用者回報手機上「經常無法讀取網頁」（Chrome renderer 被系統強制關閉）。
  這次用無頭 Chromium 實測後確認：不是慢性記憶體洩漏，而是存檔當下的瞬間爆量。

  ● 實測基準（412x915 手機視窗、A3 輸出）
    重複呼叫 buildPanels() 40 次、切換玩法 20 次、visibilitychange 30 次之後，
    JS heap / DOM 節點數 / 事件監聽器數量都沒有成長 → 排除 detached DOM 累積。
    但按一次「存」或「印」，畫布記憶體會瞬間衝到 136MB 而且不會馬上釋放；
    若「存」和「印」時間接近而重疊，峰值可達 272MB —— 手機 renderer 會直接被砍。

  1. 存檔流程移除多餘的全尺寸中繼畫布
     原本：html2canvas 產出 rawCanvas → 再建一張同尺寸(+留白)的 canvas 複製過去
     → 在上面補畫文字 → 再縮放進 A3 紙張畫布。三張大圖同時存在。
     現在：直接在 html2canvas 回傳的畫布上補畫文字，留白改成縮放進紙張時才內縮，
     視覺結果一樣（實測只有最外框線位移不到 1px，內容像素完全相同）。

     ⚠️ 這裡有個很容易踩的坑：html2canvas 回傳的畫布，它的 2D context 內部
     還留著 scale(6,6) 的變換矩陣。要重用這張畫布補字，必須先
     ctx.setTransform(1,0,0,1,0,0) 把變換重設回單位矩陣，
     否則所有已經自己乘過 captureScale 的座標與字級會被再乘一次（字會變超大）。

  2. 畫布用完立刻釋放（releaseCanvasMemory()）
     把 canvas.width/height 設為 0 可以馬上釋放底層點陣圖，不必等 GC。
     來源畫布在畫進紙張後釋放、紙張畫布在產生 PNG 後釋放。

  3. 存檔互斥鎖（captureBusy）
     「存」和「印」共用一個旗標，避免兩個截圖同時進行造成記憶體加倍。

     實測結果：單次存檔瞬時峰值 136.3MB → 100.5MB；
     存完之後仍佔用 136.3MB → 0MB；兩個存檔同時觸發 272.5MB → 100.5MB。

  4. C 式弧線 rAF 迴圈：沒變就不重畫
     原本 renderCModeArcLoop() 每一幀都無條件 svg.innerHTML="" 再重建所有
     path/line，而且每畫一條就穿插一次 getBoundingClientRect()（layout thrashing）。
     現在改成：
       - 先用四個錨點 rect + 連線/弧線陣列的物件識別組成 signature，
         跟上一幀相同就整段跳過（cModeArcSig / cModeArcPairsRef / cModeArcArcsRef）
       - 真的要重畫時，先把所有 rect 一次量完（純讀），再用 DocumentFragment
         一次掛上去（純寫），避免讀寫交錯觸發重複 reflow
       - 上下桿那兩條紅色 path 改成重用既有節點，只更新 d 屬性
     clearCModeOverlay() 會把 signature 作廢，確保下次一定完整重畫。

     實測結果：C 式靜止 3 秒，弧線層 DOM 變動 543 次 → 0 次；
     連線數量多時的每幀重繪成本（6 倍 CPU 節流）：
       10 條 3.0ms→1.3ms、30 條 9.7ms→2.8ms、60 條 21.4ms→5.1ms、100 條 34.4ms→6.0ms。
     （60 條以上原本已經超過 16.7ms 的一幀預算，等於持續掉幀 + 持續燒電。）

  5. 雲端排程在畫面隱藏時跳過
     每 60 秒的 runScheduledCloudChecks() 加上 if(document.hidden)return。

  ● 已排除的懷疑項目（不用再花時間查）
    - buildPanels() 重複呼叫沒有留下 detached DOM，事件監聽器數量穩定
    - 切回 App 的 loadData() 節流（VISIBILITY_REFRESH_COOLDOWN_MS）確認有生效
    - 開機時間在 6 倍 CPU 節流下約 550ms，不是當機主因
